[build]
  publish = "public"
  functions = "netlify/functions"

# Send every request that isn't a real file to index.html (single-page app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served stale, or a fix to it would not
# reach phones that already have it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Browsers expect this type before they will offer "Add to Home Screen".
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Batched notifications. Runs every two hours; the function itself skips quiet
# hours and sends nothing when there is nothing new, so this is cheap.
[functions."notify-digest"]
  schedule = "0 */2 * * *"
