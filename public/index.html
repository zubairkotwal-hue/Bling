  // ---- "See all" view: one category, full grid ----
  if (seeAll){
    const shown = visibleProducts(products.filter(p => p.category === seeAll));
    return `
      <button class="bh-btn-ghost" onclick="backToShop()" style="margin-bottom:12px">\u2190 All departments</button>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px">
        <h2 class="bh-serif" style="font-size:1.35rem;color:var(--plum);margin:0">${escapeHtml(seeAll)}</h2>
      </div>
      ${controls}
      ${shown.length === 0 ? `<p class="bh-empty">Nothing matches those filters. <button class="bh-btn-ghost" style="display:inline;font-size:.85rem" onclick="clearFilters()">Clear them</button></p>` : ''}
      <div class="bh-shop-grid">${shown.map(p => `
        <div class="bh-shop-card" onclick="viewProduct('${p.id}')">
          ${p.has_image ? `<img src="${productImageUrl(p,'thumb')}" alt="${escapeHtml(p.name)}" loading="lazy">` : `<div class="noimg"></div>`}
          <div class="body">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="price">${isVoucher(p) ? 'From R' + VOUCHER_MIN : 'R ' + Number(p.price).toLocaleString('en-ZA')}</div>
            ${productColours(p).length ? `<div class="bh-card-swatches">${productColours(p).slice(0,5).map(col => `<i style="background:${colourHex(col)}"></i>`).join('')}</div>` : ''}
            ${reviewsFor(p.id).length ? `<div class="bh-shop-sizes">${stars(averageRating(p.id), '.72rem')} <span style="opacity:.7">(${reviewsFor(p.id).length})</span></div>` : ''}
            ${p.stock_status === 'made_to_order' ? `<div class="bh-shop-sizes" style="color:#a6752f;font-weight:700">${escapeHtml(setting('leadTimeLabel'))}</div>` : ''}
          </div>
        </div>`).join('')}</div>`;
  }

  // ---- filtering by colour/size cuts across categories: show one grid ----
  if (anyFilterActive()){
    const shown = visibleProducts();
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px">
        <h2 class="bh-serif" style="font-size:1.35rem;color:var(--plum);margin:0">${escapeHtml(transient.filterCategory || 'Shop')}</h2>
      </div>
      ${controls}
      ${shown.length === 0 ? `<p class="bh-empty">Nothing matches those filters. <button class="bh-btn-ghost" style="display:inline;font-size:.85rem" onclick="clearFilters()">Clear them</button></p>` : ''}
      <div class="bh-shop-grid">${shown.map(p => `
        <div class="bh-shop-card" onclick="viewProduct('${p.id}')">
          ${p.has_image ? `<img src="${productImageUrl(p,'thumb')}" alt="${escapeHtml(p.name)}" loading="lazy">` : `<div class="noimg"></div>`}
          <div class="body">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="price">${isVoucher(p) ? 'From R' + VOUCHER_MIN : 'R ' + Number(p.price).toLocaleString('en-ZA')}</div>
            ${reviewsFor(p.id).length ? `<div class="bh-shop-sizes">${stars(averageRating(p.id), '.72rem')}</div>` : ''}
          </div>
        </div>`).join('')}</div>`;
  }

  // ---- default: a carousel per category, each with See all ----
  const groups = shopCategories()
    .map(cat => ({ cat, items: visibleProducts(products.filter(p => p.category === cat)) }))
    .filter(g => g.items.length);
  const uncategorised = visibleProducts(products.filter(p => !p.category));

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px">
      <div>
        <h2 class="bh-serif" style="font-size:1.35rem;color:var(--plum);margin:0 0 2px">Shop</h2>
        <p style="font-size:.85rem;color:var(--grey);margin:0">Pieces to feel good in, whether anyone sees them or not.</p>
      </div>
    </div>

    ${products.length === 0 ? `<p class="bh-empty">Nothing in the shop yet \u2014 check back soon.</p>` : controls}

    ${groups.map(g => `
      <div class="bh-rail-wrap" style="padding:14px 0 4px">
        <div class="bh-rail-head" style="padding:0 0 10px">
          <h3 class="bh-serif">${escapeHtml(g.cat)}</h3>
          <button class="bh-btn-ghost" style="font-size:.78rem" onclick="showCategory('${escapeHtml(g.cat)}')">See all (${g.items.length}) \u2192</button>
        </div>
        <div class="bh-rail" style="padding-left:0;padding-right:0">
          ${g.items.slice(0, 8).map(productCard).join('')}
        </div>
      </div>`).join('')}

    ${uncategorised.length ? `
      <div class="bh-rail-wrap" style="padding:14px 0 4px">
        <div class="bh-rail-head" style="padding:0 0 10px"><h3 class="bh-serif">More</h3></div>
        <div class="bh-rail" style="padding-left:0;padding-right:0">
          ${uncategorised.slice(0, 8).map(productCard).join('')}
        </div>
      </div>` : ''}`;
}

// How recently each product last sold, worked out from real orders.
let _soldCache = null;
function lastSoldAt(productId){
  if (!_soldCache){
    _soldCache = {};
    leads.forEach(l => {
      let items = [];
      try { items = typeof l.items === 'string' ? JSON.parse(l.items || '[]') : (l.items || []); } catch (e) {}
      const when = new Date(l.created_at || 0).getTime();
      (items || []).forEach(i => {
        if (!i.productId) return;
        if (!_soldCache[i.productId] || when > _soldCache[i.productId]) _soldCache[i.productId] = when;
      });
    });
  }
  return _soldCache[productId] || 0;
}
function clearSoldCache(){ _soldCache = null; }

function inStockCount(p){ return productSizes(p).length; }

function visibleProducts(list){
  let out = (list || products).slice();

  if (transient.filterCategory) out = out.filter(p => p.category === transient.filterCategory);
  if (transient.filterAvail.length)
    out = out.filter(p => transient.filterAvail.includes(availabilityOf(p)));
  if (transient.filterColour.length)
    out = out.filter(p => productColours(p).some(c => transient.filterColour.includes(c)));
  if (transient.filterSize.length)
    out = out.filter(p => allSizesFor(p).all.some(s => transient.filterSize.includes(s)));

  const min = parseFloat(transient.priceMin);
  const max = parseFloat(transient.priceMax);
  if (!isNaN(min)) out = out.filter(p => (parseFloat(p.price) || 0) >= min);
  if (!isNaN(max)) out = out.filter(p => (parseFloat(p.price) || 0) <= max);

  const num = v => parseFloat(v) || 0;
  const newest = (a,b) => new Date(b.created_at||0) - new Date(a.created_at||0);

  switch (transient.sortBy){
    case 'in_stock':
      out.sort((a,b) => (inStockCount(b) > 0) - (inStockCount(a) > 0) || newest(a,b));
      break;
    case 'size':
      out.sort((a,b) => String(a.size_type||'').localeCompare(String(b.size_type||''))
        || allSizesFor(b).all.length - allSizesFor(a).all.length || newest(a,b));
      break;
    case 'az': out.sort((a,b) => String(a.name||'').localeCompare(String(b.name||''))); break;
    case 'za': out.sort((a,b) => String(b.name||'').localeCompare(String(a.name||''))); break;
    case 'price_low':  out.sort((a,b) => num(a.price) - num(b.price)); break;
    case 'price_high': out.sort((a,b) => num(b.price) - num(a.price)); break;
    case 'newest':     out.sort(newest); break;
    default:
      // Recently sold first — what is actually moving.
      out.sort((a,b) => lastSoldAt(b.id) - lastSoldAt(a.id) || newest(a,b));
  }
  return out;
}

// Only offer sizes and colours that actually exist in the shop.
function sizesInShop(){
  const set = new Set();
  products.forEach(p => allSizesFor(p).all.forEach(s => set.add(s)));
  return Array.from(set);
}
function coloursInShop(){
  const set = new Set();
  products.forEach(p => productColours(p).forEach(x => set.add(x)));
  return Array.from(set);
}
function categoriesInShop(){
  return shopCategories().filter(cat => products.some(p => p.category === cat));
}

// Category is still a single choice, set from the department rails.
function setFilter(kind, value){
  if (kind === 'Category'){
    transient.filterCategory = transient.filterCategory === value ? '' : value;
    render();
  }
}
function setSort(v){ transient.sortBy = v; render(); }

const SORT_LABELS = {
  recent:     'Featured',
  in_stock:   'In stock first',
  az:         'Alphabetically, A\u2013Z',
  za:         'Alphabetically, Z\u2013A',
  price_low:  'Price, low to high',
  price_high: 'Price, high to low',
  newest:     'Date, new to old',
  size:       'By size range',
};

// The right-hand "Filter and sort" drawer. Rendered at the top level of the
// page, not inside the shop markup, so position:fixed is not affected by any
// ancestor.
function renderFilterDrawer(){
  if (!transient.filterOpen) return '';
  const d = transient.filterDraft || EMPTY_FILTERS();
  const scope = filterScope();
  const panel = transient.filterPanel;

  const countAvail  = v => scope.filter(p => availabilityOf(p) === v).length;
  const countColour = v => scope.filter(p => productColours(p).includes(v)).length;
  const countSize   = v => scope.filter(p => allSizesFor(p).all.includes(v)).length;

  const avails = ['In stock', 'Made to order'].filter(v => countAvail(v) > 0);
  const cols   = coloursInShop().filter(c => countColour(c) > 0);
  const sizes  = sizesInShop().filter(s => countSize(s) > 0);

  const tick = (on, label, count, onclick, swatch) => `
    <div class="bh-fopt ${on ? 'on' : ''}" onclick="${onclick}">
      <i></i>
      ${swatch ? `<span class="sw" style="background:${swatch}"></span>` : ''}
      <span>${escapeHtml(label)}${count === null ? '' : ` (${count})`}</span>
    </div>`;

  const backHead = (title) => `
    <button class="bh-fback" onclick="filterPanel('')">
      <span>\u2190</span><span>${escapeHtml(title)}</span>
    </button>`;

  const rowsSummary = (arr) => arr.length ? `<span class="on">${arr.length}</span>` : '<span class="arrow">\u2192</span>';

  let body;
  if (panel === 'avail'){
    body = backHead('Availability') + avails.map(v =>
      tick(d.avail.includes(v), v, countAvail(v), `toggleDraft('avail','${escapeHtml(v)}')`)).join('');
  } else if (panel === 'price'){
    const prices = scope.map(p => parseFloat(p.price) || 0);
    const hi = prices.length ? Math.max(...prices) : 0;
    body = backHead('Price') + `
      <p style="padding:0 20px;font-size:.78rem;color:var(--grey);margin:0 0 10px">
        The highest price in the shop is R${hi.toLocaleString('en-ZA')}
      </p>
      <div class="bh-fprice">
        <input type="number" inputmode="numeric" placeholder="From (R)" value="${escapeHtml(d.min)}"
               oninput="setDraftPrice('min', this.value)">
        <span style="color:var(--grey)">\u2013</span>
        <input type="number" inputmode="numeric" placeholder="To (R)" value="${escapeHtml(d.max)}"
               oninput="setDraftPrice('max', this.value)">
      </div>`;
  } else if (panel === 'size'){
    body = backHead('Size') + (sizes.length
      ? sizes.map(s => tick(d.sizes.includes(s), s, countSize(s), `toggleDraft('sizes','${escapeHtml(s)}')`)).join('')
      : `<p style="padding:0 20px;color:var(--grey);font-size:.85rem">No sizes to filter on yet.</p>`);
  } else if (panel === 'colour'){
    body = backHead('Colour') + (cols.length
      ? cols.map(c => tick(d.colours.includes(c), c, countColour(c), `toggleDraft('colours','${escapeHtml(c)}')`, colourHex(c))).join('')
      : `<p style="padding:0 20px;color:var(--grey);font-size:.85rem">No colours to filter on yet.</p>`);
  } else {
    body = `
      ${avails.length ? `<button class="bh-frow" onclick="filterPanel('avail')"><span>Availability</span>${rowsSummary(d.avail)}</button>` : ''}
      <button class="bh-frow" onclick="filterPanel('price')"><span>Price</span>${(d.min !== '' || d.max !== '') ? '<span class="on">1</span>' : '<span class="arrow">\u2192</span>'}</button>
      ${sizes.length ? `<button class="bh-frow" onclick="filterPanel('size')"><span>Size</span>${rowsSummary(d.sizes)}</button>` : ''}
      ${cols.length ? `<button class="bh-frow" onclick="filterPanel('colour')"><span>Colour</span>${rowsSummary(d.colours)}</button>` : ''}
      <div class="bh-fsortrow">
        <label for="bhSortSel">Sort by:</label>
        <select id="bhSortSel" onchange="setDraftSort(this.value)">
          ${Object.keys(SORT_LABELS).map(k =>
            `<option value="${k}" ${d.sort === k ? 'selected' : ''}>${escapeHtml(SORT_LABELS[k])}</option>`).join('')}
        </select>
      </div>`;
  }

  // Counting against the draft, so the header updates as boxes are ticked.
  const preview = (function(){
    const saved = {
      a: transient.filterAvail, c: transient.filterColour, s: transient.filterSize,
      mn: transient.priceMin, mx: transient.priceMax,
    };
    transient.filterAvail = d.avail; transient.filterColour = d.colours;
    transient.filterSize = d.sizes; transient.priceMin = d.min; transient.priceMax = d.max;
    const n = visibleProducts(scope).length;
    transient.filterAvail = saved.a; transient.filterColour = saved.c;
    transient.filterSize = saved.s; transient.priceMin = saved.mn; transient.priceMax = saved.mx;
    return n;
  })();

  return `
    <div class="bh-fscrim" onclick="closeFilters()"></div>
    <div class="bh-fdrawer" role="dialog" aria-label="Filter and sort">
      <div class="bh-fhead">
        <h3>Filter and sort</h3>
        <div class="sub">${preview} product${preview === 1 ? '' : 's'}</div>
        <button class="bh-fx" onclick="closeFilters()" aria-label="Close">\u2715</button>
      </div>
      <div class="bh-fbody">${body}</div>
      <div class="bh-ffoot">
        <button class="bh-fclear" onclick="clearDraft('${panel}')">${panel ? 'Clear' : 'Remove all'}</button>
        <button class="bh-fapply" onclick="applyFilters()">Apply</button>
      </div>
    </div>`;
}

function availabilityOf(p){
  return productSizes(p).length > 0 ? 'In stock' : 'Made to order';
}

// Products the drawer is filtering within — the whole shop, or one department
// when a "See all" page is open. Counts and the header total come from here.
function filterScope(){
  return transient.shopSeeAll
    ? products.filter(p => p.category === transient.shopSeeAll)
    : products.slice();
}

function activeFilterCount(){
  return transient.filterAvail.length + transient.filterColour.length + transient.filterSize.length
    + (transient.priceMin !== '' ? 1 : 0) + (transient.priceMax !== '' ? 1 : 0);
}
function anyFilterActive(){ return activeFilterCount() > 0 || !!transient.filterCategory; }

const EMPTY_FILTERS = () => ({ avail: [], colours: [], sizes: [], min: '', max: '', sort: 'recent' });

function openFilters(){
  transient.filterDraft = {
    avail: transient.filterAvail.slice(),
    colours: transient.filterColour.slice(),
    sizes: transient.filterSize.slice(),
    min: transient.priceMin,
    max: transient.priceMax,
    sort: transient.sortBy,
  };
  transient.filterPanel = '';
  transient.filterOpen = true;
  document.body.classList.add('bh-filters-open');
  render();
}
function closeFilters(){
  transient.filterOpen = false;
  transient.filterPanel = '';
  transient.filterDraft = null;
  document.body.classList.remove('bh-filters-open');
  render();
}
function filterPanel(name){ transient.filterPanel = name; render(); }

function toggleDraft(key, value){
  const d = transient.filterDraft;
  if (!d) return;
  const i = d[key].indexOf(value);
  if (i === -1) d[key].push(value); else d[key].splice(i, 1);
  render();
}
function setDraftPrice(which, v){ if (transient.filterDraft) transient.filterDraft[which] = v; }
function setDraftSort(v){ if (transient.filterDraft) transient.filterDraft.sort = v; }

// "Clear" inside a panel empties just that panel; on the front screen it
// removes everything.
function clearDraft(panel){
  const d = transient.filterDraft;
  if (!d) return;
  if (panel === 'avail')       d.avail = [];
  else if (panel === 'colour') d.colours = [];
  else if (panel === 'size')   d.sizes = [];
  else if (panel === 'price')  { d.min = ''; d.max = ''; }
  else Object.assign(d, EMPTY_FILTERS(), { sort: d.sort });
  render();
}

function applyFilters(){
  const d = transient.filterDraft || EMPTY_FILTERS();
  transient.filterAvail  = d.avail.slice();
  transient.filterColour = d.colours.slice();
  transient.filterSize   = d.sizes.slice();
  transient.priceMin     = d.min;
  transient.priceMax     = d.max;
  transient.sortBy       = d.sort;
  closeFilters();
}

function clearFilters(){
  transient.filterCategory = '';
  transient.filterColour = [];
  transient.filterSize = [];
  transient.filterAvail = [];
  transient.priceMin = '';
  transient.priceMax = '';
  transient.shopSeeAll = '';
  render();
}

function showCategory(cat){
  transient.shopSeeAll = cat;
  transient.filterCategory = '';
  render();

function chooseSize(s, btn, toOrder){

  const grid = document.getElementById('detailSizeGrid');
  if (grid) grid.querySelectorAll('.bh-size-opt').forEach(b => b.classList.toggle('on', b === btn));
  const note = document.getElementById('sizeNote');
  if (note){

  }
  const err = document.getElementById('detailError');
  if (err) err.textContent = '';

function addToCartFromDetail(productId){
  const product = products.find(p => p.id === productId);
  const err = document.getElementById('detailError');

  if (isVoucher(product)){
    const amount = transient.voucherAmount || VOUCHER_MIN;
    cart.push({ productId, name: product.name, price: String(amount), size: '', qty: 1, toOrder: false, voucher: true });
    saveCart();
    transient.voucherAmount = VOUCHER_MIN;
    viewCart();
    return;
  }

  const sizeInfo = allSizesFor(product);
  if (sizeInfo.all.length > 1 && !transient.chosenSize){
    if (err) err.textContent = 'Please choose a size first.';
    return;
  }
  const size = transient.chosenSize || (sizeInfo.all.length === 1 ? sizeInfo.all[0] : '');
  addToCart(productId, size, isMadeToOrder(product, size));
  transient.chosenSize = '';
  viewCart();
}

async function applyDiscount(){
  const input = document.getElementById('discountInput');
  const note = document.getElementById('discountNote');
  const code = (input ? input.value : '').trim().toUpperCase();
  if (!code){
    transient.discountCode = ''; transient.discountAmount = 0; transient.discountNote = '';
    render(); return;
  }
  note.textContent = 'Checking\u2026';
  try {
    const res = await fetch(API + '/discounts?check=1', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, subtotal: cartSubtotal() }),
    }).then(r => r.json());

    if (res.ok){
      transient.discountCode = res.code;
      transient.discountAmount = res.amount;
      transient.discountNote = res.kind === 'percent'
        ? `${res.value}% off applied \u2014 R${res.amount} saved.`
        : `R${res.amount} off applied.`;
    } else {
      transient.discountCode = ''; transient.discountAmount = 0;
      transient.discountNote = res.reason || 'That code cannot be used.';
    }
  } catch (e) {
    transient.discountCode = ''; transient.discountAmount = 0;
    transient.discountNote = "Couldn't check that code \u2014 please try again.";
  }
  render();
}

async function submitOrder(){
  const buyer = document.getElementById('orderBuyer').value.trim();
  const phone = document.getElementById('orderPhone').value.trim();
  const deliveryMethod = document.querySelector('input[name=deliveryMethod]:checked').value;
  const address = deliveryMethod === 'Shipping' ? document.getElementById('orderAddress').value.trim() : '';
  const errEl = document.getElementById('orderError');

  if (!buyer || !phone){ errEl.textContent = 'Please add your name and WhatsApp number.'; return; }
  if (deliveryMethod === 'Shipping' && !address){ errEl.textContent = 'Please add a shipping address.'; return; }
  if (cart.length === 0){ errEl.textContent = 'Your basket is empty.'; return; }

  errEl.textContent = 'Sending…';
  try {
    await apiFetch('/leads', {
      method: 'POST',
      body: JSON.stringify({
        buyer, phone, deliveryMethod, address,
        items: cart,
        leadTime: cart.some(i => i.toOrder) ? setting('leadTimeLabel') : '',
        subtotal: cartSubtotal().toFixed(0),
        discountCode: transient.discountCode || '',
        shipping: shippingFor(deliveryMethod).toFixed(0),
        total: cartTotal(deliveryMethod).toFixed(0),
      }),
    });
    clearCart();
    transient.discountCode = ''; transient.discountAmount = 0; transient.discountNote = '';
    transient.orderSent = true;
    transient.loadError = '';
  } catch (e) {
    errEl.textContent = "Couldn't place that order — please try again in a moment.";
    return;
  }
  render();
}

// Turn a thrown apiFetch error into something worth showing. The generic
// "please try again" hid the real cause for a whole afternoon: the server
// says exactly what is wrong (a missing table, for instance) and there is no
// reason to throw that away.
function failureText(e, fallback){
  const msg = (e && e.message) ? String(e.message) : '';
  if (!msg || /^Failed to fetch$/i.test(msg)) return fallback + ' (no connection to the server)';
  return fallback + ' \u2014 ' + msg;
}

// ---- Dashboard ----
// Everything here is worked out from the data already loaded. Nothing is
// stored or fetched separately, so it cannot drift out of step with the tabs.

function daysSince(iso){
  if (!iso) return null;
  const then = new Date(iso).getTime();
  if (isNaN(then)) return null;
  return Math.floor((Date.now() - then) / 86400000);
}

function agoWords(iso){
  const d = daysSince(iso);
  if (d === null) return '';
  if (d <= 0) return 'today';
  if (d === 1) return 'yesterday';
  return d + ' days ago';
}

function dashStats(){
  const live = s => !s.archived_at;
  const pending  = stories.filter(s => live(s) && s.status === 'pending');
  const approved = stories.filter(s => live(s) && s.status === 'approved');
  const ready    = approved.filter(s => !s.posted);
  const week = Date.now() - 7 * 86400000;
  const inWeek = iso => { const t = new Date(iso).getTime(); return !isNaN(t) && t >= week; };

  // Submissions per day for the last 7 days, oldest first.
  const days = [];
  for (let i = 6; i >= 0; i--){
    const start = new Date(); start.setHours(0,0,0,0);
    start.setDate(start.getDate() - i);
    const end = start.getTime() + 86400000;
    days.push(stories.filter(s => {
      const t = new Date(s.created_at).getTime();
      return t >= start.getTime() && t < end;
    }).length);
  }

  const oldest = pending
    .map(s => s.created_at)
    .filter(Boolean)
    .sort((a,b) => new Date(a) - new Date(b))[0];

  const money = list => list.reduce((sum, l) => sum + (parseFloat(l.total) || 0), 0);
  const byStatus = st => leads.filter(l => l.status === st);

  const arrivedThisWeek = stories.filter(s => inWeek(s.created_at)).length;
  const madeThisWeek = stories.filter(s => s.posted_at && inWeek(s.posted_at)).length;

  return {
    arrivedThisWeek,
    keepingUp: madeThisWeek >= arrivedThisWeek,
    clearing: madeThisWeek >= arrivedThisWeek ? 'faster than they arrive' : 'slower than they arrive',
    pending: pending.length,
    oldestPending: oldest,
    readyToPost: ready.length,
    // Counted from posted_at, the moment the card was made — not from when the
    // story was submitted. Stories posted before posted_at existed have no
    // date, so they are simply not counted rather than guessed at.
    madeThisWeek: stories.filter(s => s.posted_at && inWeek(s.posted_at)).length,
    madeToday: stories.filter(s => s.posted_at && daysSince(s.posted_at) === 0).length,
    everMade: stories.filter(s => s.posted).length,
    haveTimestamps: stories.some(s => s.posted_at),
    repliesWaiting: replies.filter(r => !r.archived_at && r.status === 'pending').length,
    days,
    submittedToday: days[6],
    dailyAverage: Math.round(days.reduce((a,b) => a+b, 0) / 7),

    awaitingPayment: byStatus('Enquired').length,
    toPack: byStatus('Paid').length,
    toSend: byStatus('Ready').length,
    sentThisWeek: byStatus('Sent').filter(l => inWeek(l.created_at)).length,
    owed: money(byStatus('Enquired')),
    takenThisWeek: money(leads.filter(l => l.status !== 'Enquired' && inWeek(l.created_at))),

    productsLive: products.length,
    noPicture: products.filter(p => !p.has_image).length,
    outOfStock: products.filter(p => productSizes(p).length === 0).length,
    reviewsWaiting: reviews.filter(r => r.status === 'pending').length,
    helpNew: helpMessages.filter(h => h.status === 'new').length,
  };
}

// ---- Admin: review queue ----
// Turning a reply into its own story.
// Someone often asks a question in a reply that deserves its own discussion.
// This copies the text into a new story so it can collect replies of its own.
// The wording is editable first, because a reply is usually phrased as an
// answer to something and needs a small rewrite to stand alone.
function startPromote(replyId){
  const r = replies.find(x => x.id === replyId);
  if (!r) return;
  const parent = stories.find(s => s.id === r.storyId);
  transient.promoteReplyId = replyId;
  transient.promoteText = r.text;
  transient.promoteCategory = (parent && parent.category) || categories()[0];
  transient.promoteKeep = false;
  transient.promoteStatus = '';
  render();
}
function cancelPromote(){
  transient.promoteReplyId = null;
  transient.promoteStatus = '';
  render();
}

function renderPromotePanel(r){
  return `
    <div class="bh-promote">
      <p class="hint">This becomes a new story that people can reply to. Tidy the wording if it only makes sense as a reply.</p>
      <textarea class="bh-textarea" style="min-height:90px"
        oninput="transient.promoteText = this.value">${escapeHtml(transient.promoteText || '')}</textarea>
      <div class="row">
        <label class="bh-label" style="margin:0">Folder</label>
        <select onchange="transient.promoteCategory = this.value">
          ${categories().map(c => `<option value="${escapeHtml(c)}" ${transient.promoteCategory === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
        </select>
      </div>
      <label class="keep">
        <input type="checkbox" ${transient.promoteKeep ? 'checked' : ''}
          onchange="transient.promoteKeep = this.checked">
        <span>Also keep it as a reply under "${escapeHtml((stories.find(s => s.id === r.storyId) || {}).text ? (stories.find(s => s.id === r.storyId).text.slice(0, 30) + '\u2026') : 'the original story')}"</span>
      </label>
      <div class="acts">
        <button class="bh-btn" onclick="promoteReply('${r.id}')">Make it a story</button>
        <button class="bh-btn-ghost" onclick="cancelPromote()">Cancel</button>
      </div>
      ${transient.promoteStatus ? `<p class="stat">${escapeHtml(transient.promoteStatus)}</p>` : ''}
    </div>`;
}

async function promoteReply(replyId){
  const text = (transient.promoteText || '').trim();
  if (text.length < 10){
    transient.promoteStatus = 'Give it a bit more text first.';
    return render();
  }
  const reply = replies.find(x => x.id === replyId);
  transient.promoteStatus = 'Making the story\u2026';
  render();

  try {
    // Created silently and already approved: she is deliberately publishing it,
    // and does not need a notification about her own action.
    const made = await apiFetch('/stories', {
      method: 'POST',
      body: JSON.stringify({
        text,
        category: transient.promoteCategory || categories()[0],
        pseudonym: (reply && reply.pseudonym) || null,
        silent: true,
      }),
    });
    await apiFetch('/stories', {
      method: 'PATCH',
      body: JSON.stringify({ id: made.id, status: 'approved' }),
    });

    // Unless she ticked the box, take the reply out of the queue so the same
    // words are not sitting in two places waiting to be dealt with.
    if (!transient.promoteKeep && reply){
      await apiFetch('/replies', { method: 'PATCH', body: JSON.stringify({ id: replyId, archived: true }) });
    } else if (reply && reply.status === 'pending'){
      await apiFetch('/replies', { method: 'PATCH', body: JSON.stringify({ id: replyId, status: 'approved' }) });
    }

    transient.promoteReplyId = null;
    transient.promoteStatus = '';
    await Promise.all([fetchStories(), fetchReplies()]);
    transient.loadError = '';
    render();
  } catch (e) {
    transient.promoteStatus = "Couldn't do that \u2014 " + (e.message || 'try again');
    render();
  }
}

// ---- The queue ----
// One list, filtered. Waiting, ready to post, posted and archived used to be
// spread across two tabs; they are the same items at different stages.

const Q_STATES = [
  { key:'waiting',  label:'Waiting' },
  { key:'ready',    label:'To post' },
  { key:'posted',   label:'Posted' },
  { key:'archived', label:'Archived' },
  { key:'roundup',  label:'Round-up' },
];

function qState(){ return transient.qState || 'waiting'; }
function qType(){ return transient.qType || 'all'; }
function qSearch(){ return (transient.qSearch || '').trim().toLowerCase(); }

// Oldest first while clearing a backlog, so a story from four days ago does not
// sink below today's forty and never get read. Newest first everywhere else,
// because that is history being scanned.
function qSort(){
  if (transient.qSort) return transient.qSort;
  return qState() === 'waiting' ? 'oldest' : 'newest';
}

function setQState(v){
  transient.qState = v;
  transient.qSort = null;      // back to the sensible default for that view
  transient.qLimit = 25;
  render();
}
function setQType(v){ transient.qType = v; transient.qLimit = 25; render(); }
function setQSort(v){ transient.qSort = v; render(); }
function setQSearch(v){ transient.qSearch = v; transient.qLimit = 25; renderQueueList(); }
function showMoreQueue(){ transient.qLimit = (transient.qLimit || 25) + 25; render(); }

// Everything as one list of {kind, obj, at, text}.
function queueItems(state, type){
  const out = [];
  const wantStories = type !== 'replies';
  const wantReplies = type !== 'stories';

  if (wantStories){
    stories.forEach(st => {
      const archived = isArchived(st);
      let keep = false;
      if (state === 'waiting')  keep = st.status === 'pending' && !archived;
      if (state === 'ready')    keep = st.status === 'approved' && !st.posted && !archived;
      if (state === 'posted')   keep = st.status === 'approved' && st.posted && !archived;
      if (state === 'archived') keep = archived;
      if (keep) out.push({ kind:'story', obj:st, at:st.created_at, text:st.text || '' });
    });
  }
  if (wantReplies){
    replies.forEach(r => {
      const archived = isArchived(r);
      let keep = false;
      if (state === 'waiting')  keep = r.status === 'pending' && !archived;
      if (state === 'archived') keep = archived;
      // A reply is never made into a card of its own, so "To post" and
      // "Posted" are story-only. An approved reply is simply live on its
      // story's page.

      if (keep) out.push({ kind:'reply', obj:r, at:r.created_at, text:r.text || '' });
    });
  }

  const needle = qSearch();
  const filtered = needle ? out.filter(i => i.text.toLowerCase().includes(needle)) : out;

  const dir = qSort() === 'oldest' ? 1 : -1;
  filtered.sort((a, b) => (new Date(a.at) - new Date(b.at)) * dir);
  return filtered;
}

function queueCount(state){ return queueItems(state, 'all').length; }

// "Today", "Yesterday", then the date. Grouping beats a column of timestamps.
function dayLabel(iso){
  const d = new Date(iso);
  if (isNaN(d)) return 'Undated';
  const today = new Date(); today.setHours(0,0,0,0);
  const then = new Date(d); then.setHours(0,0,0,0);
  const days = Math.round((today - then) / 86400000);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 7) return d.toLocaleDateString('en-ZA', { weekday:'long' });
  return d.toLocaleDateString('en-ZA', { day:'numeric', month:'long' });
}

function timeLabel(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit', hour12:false });
}

function waitingTooLong(iso){
  const days = daysSince(iso);
  return days !== null && days >= 2;
}

function renderQueueList(){
  const el = document.getElementById('queueList');
  if (el) el.innerHTML = queueListHtml();
}

function queueListHtml(){
  const state = qState();
  const items = queueItems(state, qType());
  const limit = transient.qLimit || 25;
  const shown = items.slice(0, limit);

  if (!items.length){
    return `<p class="bh-empty">${qSearch()
      ? 'Nothing matches that.'
      : 'Nothing here right now.'}</p>`;
  }

  let html = '';
  let lastDay = null;
  shown.forEach(item => {
    const day = dayLabel(item.at);
    if (day !== lastDay){
      html += `<div class="bh-qday">${escapeHtml(day)}</div>`;
      lastDay = day;
    }
    html += item.kind === 'story' ? queueStoryRow(item.obj, state) : queueReplyRow(item.obj, state);
  });

  if (items.length > shown.length){
    html += `<button class="bh-qmore" onclick="showMoreQueue()">Show more (${items.length - shown.length} left)</button>`;
  }
  return html;
}

function queueStamp(item){
  return `<span class="bh-qstamp">${escapeHtml(timeLabel(item.created_at))}
    ${waitingTooLong(item.created_at) && item.status === 'pending'
      ? `<em>waiting ${escapeHtml(agoWords(item.created_at))}</em>` : ''}</span>`;
}

function queueReplyRow(r, state){
  const parent = stories.find(x => x.id === r.storyId);

          <button class="bh-reject" onclick="rejectReply('${r.id}')">\u2715 Reject</button>
          <button class="bh-btn-ghost" style="font-size:.72rem" onclick="startPromote('${r.id}')">Make it a story</button>` : ''}
        ${state === 'archived' ? `
          <button class="bh-btn-ghost" style="font-size:.72rem" onclick="archiveReply('${r.id}', false)">Put back</button>` : ''}
        ${state !== 'archived' ? `
          <button class="bh-btn-ghost" style="font-size:.72rem" onclick="archiveReply('${r.id}', true)">Archive</button>` : ''}
        <button class="bh-btn-ghost" style="color:var(--risk);font-size:.72rem" onclick="deleteReply('${r.id}')">Delete</button>
      </span>
    </div>`;
}

function renderArchiveSection(){
  const archived = []
    .concat(stories.filter(archivedRecently).map(s => ({ ...s, kind: 'story' })))
    .concat(replies.filter(archivedRecently).map(r => ({ ...r, kind: 'reply' })))
    .sort((a, b) => new Date(b.archived_at) - new Date(a.archived_at));

  if (!archived.length) return '';

  const byDay = {};
  archived.forEach(item => {
    const d = new Date(item.archived_at);
    const key = d.toLocaleDateString('en-ZA', { weekday:'long', day:'numeric', month:'long' });
    (byDay[key] = byDay[key] || []).push(item);
  });

  return `
    <div style="margin-top:36px;padding-top:20px;border-top:1px solid var(--line)">
      <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:4px">Archived (${archived.length})</h3>
      <p style="font-size:.78rem;color:var(--grey);margin:0 0 6px">Tidied off the list above. These clear from this screen after 7 days \u2014 nothing is deleted, and anything approved stays in its folder.</p>
      ${Object.keys(byDay).map(day => `
        <div class="bh-arch-day">${escapeHtml(day)}</div>
        ${byDay[day].map(item => `
          <div class="bh-arch-row">

            <button class="bh-btn-ghost" style="font-size:.72rem" onclick="${item.kind === 'story' ? `archiveStory('${item.id}', false)` : `archiveReply('${item.id}', false)`}">Put back</button>

async function unpublishStory(id){
  await apiFetch('/stories', { method: 'PATCH', body: JSON.stringify({ id, status: 'pending' }) });
  await fetchStories();
  alert('Taken off the site. It is back in your review queue if you want to put it up again.');
  goHome();
}

async function deleteStory(id){
  const story = stories.find(s => s.id === id);
  const snippet = story ? story.text.slice(0, 60) + (story.text.length > 60 ? '…' : '') : 'this story';
  if (!confirm('Permanently delete this story and all its replies?\n\n"' + snippet + '"\n\nThis cannot be undone.')) return;
  await apiFetch('/stories', { method: 'DELETE', body: JSON.stringify({ id }) });
  await Promise.all([fetchStories(), fetchReplies()]);
  // If we were reading that story, there's nothing left to show.
  if (nav.view === 'story' && nav.activeStoryId === id) goHome();
  else render();
}

async function deleteReply(id){
  if (!confirm('Permanently delete this reply? This cannot be undone.')) return;
  await apiFetch('/replies', { method: 'DELETE', body: JSON.stringify({ id }) });
  await fetchReplies();
  render();
}

// Archived items drop off the admin screen after a week. They are never
// deleted, and anything approved stays published in its folder.
function archivedRecently(x){
  if (!x || !x.archived_at) return false;
  const days = (Date.now() - new Date(x.archived_at).getTime()) / 86400000;
  return days <= 7;
}

// ---- Admin: bulk import ----
// Adds many products in one go from a folder of photos. The photos carry no
// names, so the names come from a sheet pasted into the box below — one line
// per product. Anything without a line still appears, named after its file,
// ready to be typed over. Nothing is sent until Import is pressed.
//
// Rows live here rather than in the DOM: render() rebuilds everything, and a
// half-typed name in an input would be thrown away with it.
let bulk = {
  files: [],        // File objects, kept until import so nothing is resized early
  rows: [],
  previews: {},     // filename -> object URL, made once so re-renders don't leak
  sheetText: '',
  price: '450',
  stockStatus: 'made_to_order',
  sizeType: 'clothing',
  orderSizes: ['S','M','L','XL'],
  running: false,
  total: 0,
  done: 0,
  failed: 0,
  log: [],
};

function bulkPreview(file){
  if (!bulk.previews[file.name]) bulk.previews[file.name] = URL.createObjectURL(file);
  return bulk.previews[file.name];
}

// A sheet line is:  filename [+ filename] | Name | Colour / Colour |
//                   Category | Price | Stock | Sizes | Description
// Stock is "stock" or "order"; sizes are separated by spaces or commas
// (S M L XL, or 32A 32B 34A). Any column left blank falls back to the
// setting chosen above the sheet.
// Everything after the filename is optional. Blank lines and lines starting
// with # are ignored, so a pasted sheet can carry notes.
function bulkParseSheet(text){
  return String(text || '').split('\n').map(line => {
    const t = line.trim();
    if (!t || t.charAt(0) === '#') return null;
    const parts = t.split('|').map(s => s.trim());
    const files = parts[0].split(/[+,]/).map(s => s.trim()).filter(Boolean);
    if (!files.length) return null;
    return {
      files,
      name: parts[1] || '',
      colours: (parts[2] || '').split(/[\/,]/).map(s => s.trim()).filter(Boolean),
      category: parts[3] || '',
      price: (parts[4] || '').replace(/^[Rr]\s*/, ''),
      stock: parts[5] || '',
      sizes: (parts[6] || '').split(/[\s,]+/).map(x => x.trim()).filter(Boolean),
      description: parts[7] || '',
    };
  }).filter(Boolean);
}

// A row that names bra sizes imports as a bra-sized product without changing
// the setting for the whole batch. Anything unrecognised returns blank, which
// means "use the setting above the sheet".
function bulkSizeTypeFor(sizes){
  const list = (sizes || []).map(x => String(x).trim()).filter(Boolean);
  if (!list.length) return "";
  const fits = key => list.every(x =>
    SIZE_PRESETS[key].options.some(o => o.toLowerCase() === x.toLowerCase()));
  if (fits("clothing")) return "clothing";
  if (fits("bra")) return "bra";
  return "";
}

function bulkNormaliseSizes(sizes, type){
  if (!type) return [];
  const out = [];
  (sizes || []).forEach(raw => {
    const m = SIZE_PRESETS[type].options.find(o => o.toLowerCase() === String(raw).trim().toLowerCase());
    if (m && out.indexOf(m) === -1) out.push(m);
  });
  return out;
}

// Filenames are matched loosely — the tail is enough, so a sheet written
// against "IMG-1234.jpg" still finds "WA/IMG-1234.jpg" or a renamed copy.
function bulkFileMatches(actual, wanted){
  const a = String(actual).toLowerCase();
  const w = String(wanted).toLowerCase();
  return a === w || a.endsWith(w) || w.endsWith(a);
}

// Last resort when a picture has no sheet line: turn the filename into
// something readable so the row is at least identifiable.
function bulkNameFromFile(filename){
  return String(filename)
    .replace(/\.[a-z0-9]+$/i, '')
    .replace(/[_\-]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Colours are checked against the shop's own list so the filters keep
// working. Unknown ones are kept on the row and shown in red rather than
// silently dropped.
function bulkNormaliseColours(list){
  const out = [];
  (list || []).forEach(raw => {
    const match = COLOURS.find(c => c.name.toLowerCase() === String(raw).trim().toLowerCase());
    const name = match ? match.name : String(raw).trim();
    if (name && !out.includes(name)) out.push(name);
  });
  return out;
}
function bulkColourKnown(name){
  return COLOURS.some(c => c.name === name);
}

function bulkMakeRow(files, name, colours, category, extra){
  const trimmed = String(name || '').trim();
  const e = extra || {};
  const sizeType = bulkSizeTypeFor(e.sizes);
  const stock = /^(stock|in.stock|yes)/i.test(e.stock || '') ? 'in_stock'
    : /^(order|made|no)/i.test(e.stock || '') ? 'made_to_order' : '';
  return {
    files,
    name: trimmed,
    colours: bulkNormaliseColours(colours),
    category: category || '',
    price: e.price || '',
    description: e.description || '',
    // Blank means "use the setting above the sheet" for this row.
    stockStatus: stock,
    sizeType: sizeType,
    sizes: bulkNormaliseSizes(e.sizes, sizeType),
    // Anything already in the shop starts ticked, so running this twice
    // cannot make a second copy.
    skip: !!trimmed && products.some(p => (p.name || '').trim().toLowerCase() === trimmed.toLowerCase()),
    status: '',
  };
}

function bulkBuildRows(){
  const sheet = bulkParseSheet(bulk.sheetText);
  const used = new Set();
  const rows = [];
  sheet.forEach(entry => {
    const matched = [];
    entry.files.forEach(wanted => {
      const f = bulk.files.find(file => !used.has(file.name) && bulkFileMatches(file.name, wanted));
      if (f){ used.add(f.name); matched.push(f); }
    });
    if (matched.length) rows.push(bulkMakeRow(matched, entry.name, entry.colours, entry.category, entry));
  });
  bulk.files.forEach(f => {
    if (!used.has(f.name)) rows.push(bulkMakeRow([f], bulkNameFromFile(f.name), [], ''));
  });
  bulk.rows = rows;
}

function bulkChooseFiles(event){
  const chosen = Array.from(event.target.files || []);
  if (!chosen.length) return;
  bulk.files = chosen;
  bulk.done = 0; bulk.failed = 0; bulk.log = [];
  bulkBuildRows();
  render();
}

function bulkApplySheet(){
  const box = document.getElementById('bulkSheet');
  if (box) bulk.sheetText = box.value;
  bulkBuildRows();
  render();
}

function bulkToggleOrderSize(size, el){
  const i = bulk.orderSizes.indexOf(size);
  if (i === -1) bulk.orderSizes.push(size); else bulk.orderSizes.splice(i, 1);
  if (el) el.classList.toggle('on');
}

function bulkSetSizeType(value){
  bulk.sizeType = value;
  bulk.orderSizes = bulk.orderSizes.filter(s => SIZE_PRESETS[value].options.includes(s));
  render();
}

function bulkSetColours(i, value){
  bulk.rows[i].colours = bulkNormaliseColours(String(value).split(/[\/,]/));
  render();
}

function bulkClear(){
  if (!confirm('Clear the chosen pictures and start again?')) return;
  Object.keys(bulk.previews).forEach(k => URL.revokeObjectURL(bulk.previews[k]));
  bulk = { ...bulk, files: [], rows: [], previews: {}, total: 0, done: 0, failed: 0, log: [], running: false };
  render();
}

// Status is written straight into the cell. Re-rendering the whole page for
// every product would throw away any name still being typed, and with a
// hundred rows it crawls.
function bulkSetStatus(i, text, tone){
  bulk.rows[i].status = text;
  const cell = document.getElementById('bulkStatus-' + i);
  if (cell){
    cell.textContent = text;
    cell.style.color = tone === 'bad' ? 'var(--risk)' : (tone === 'good' ? 'var(--good, #3f6b46)' : 'var(--grey)');
  }
}
function bulkNote(line){
  bulk.log.push(line);
  const box = document.getElementById('bulkLog');
  if (box){ box.textContent = bulk.log.join('\n'); box.scrollTop = box.scrollHeight; }
}
function bulkProgress(){
  const total = bulk.total;
  const bar = document.getElementById('bulkBar');
  const label = document.getElementById('bulkProgressText');
  const pct = total ? Math.round((bulk.done + bulk.failed) * 100 / total) : 0;
  if (bar) bar.style.width = pct + '%';
  if (label) label.textContent = (bulk.done + bulk.failed) + ' of ' + total + ' — ' + bulk.done + ' added, ' + bulk.failed + ' failed';
}

async function bulkRun(dryRun){
  if (bulk.running) return;
  const todo = bulk.rows.filter(r => !r.skip);
  if (!todo.length){ alert('Nothing to import — every row is ticked to skip.'); return; }
  const missing = todo.filter(r => !r.name.trim());
  if (missing.length){ alert(missing.length + ' product(s) have no name. Give them a name or tick Skip.'); return; }
  if (!dryRun && !confirm('Add ' + todo.length + ' product(s) to the shop? This cannot be undone in one step.')) return;

  bulk.running = true;
  bulk.total = todo.length;
  bulk.done = 0; bulk.failed = 0; bulk.log = [];
  render();
  bulkNote(dryRun ? 'Dry run — building everything, sending nothing.' : 'Importing…');

  for (let i = 0; i < bulk.rows.length; i++){
    const row = bulk.rows[i];
    if (row.skip) continue;
    try {
      bulkSetStatus(i, 'Preparing…');
      const images = [];
      for (const file of row.files.slice(0, MAX_PICTURES)){
        const thumb = await resizeImage(file, 500, 0.72);
        const full  = await resizeImage(file, 1400, 0.82);
        images.push({ thumb, full });
      }
      const rowStock = row.stockStatus || bulk.stockStatus;
      const rowSizeType = row.sizeType || bulk.sizeType;
      const rowSizes = (row.sizes && row.sizes.length) ? row.sizes
        : (row.sizeType ? [] : bulk.orderSizes);
      const payload = {
        name: row.name.trim(),
        price: (row.price.trim() || bulk.price),
        images,
        sizeType: rowSizeType,
        sizes: rowStock === 'in_stock' ? rowSizes : [],
        description: row.description || '',
        stockStatus: rowStock,
        orderSizes: rowSizes,
        category: row.category,
        colours: row.colours,
        productType: 'item',
      };
      if (dryRun){
        const kb = Math.round(JSON.stringify(payload).length / 1024);
        bulkSetStatus(i, 'Ready (' + kb + ' KB)', 'good');
        bulkNote('OK  ' + payload.name + '  — ' + row.files.length + ' picture(s), ' +
                 (payload.colours.join('/') || 'no colour') + ', R' + payload.price + ', ' +
                 (rowStock === 'in_stock' ? 'in stock' : 'to order') + ' ' +
                 (payload.orderSizes.join('/') || 'no sizes') + ', ' + kb + ' KB');
      } else {
        bulkSetStatus(i, 'Sending…');
        await apiFetch('/products', { method: 'POST', body: JSON.stringify(payload) });
        // Ticking Skip and remembering the name means a second press of
        // Import cannot add the same product twice.
        row.skip = true;
        bulkSetStatus(i, 'Added', 'good');
        bulkNote('Added  ' + payload.name);
      }
      bulk.done += 1;
    } catch (err) {
      bulk.failed += 1;
      bulkSetStatus(i, 'Failed', 'bad');
      bulkNote('FAILED  ' + (row.name || '(no name)') + '  — ' + err.message);
    }
    bulkProgress();
  }

  bulkNote('Finished. ' + bulk.done + ' done, ' + bulk.failed + ' failed.');
  bulk.running = false;
  if (!dryRun) await fetchProducts();
  render();
}

// ---- Admin: shop manager ----
// A link straight to this product, for the Instagram link sticker. Shown as
// selectable text rather than only behind a button, so it can be copied by
// hand if the browser blocks the clipboard — the same problem the story links
// had.
// ---- Sharing a product to Instagram ----
// Instagram's API cannot add a link sticker, so the paste step cannot be
// removed. What can be removed is the hunting: this makes the story picture and
// puts the link on the clipboard in one action, then hands the picture straight
// to Instagram through the phone's share sheet.

function loadProductImage(url){
  return new Promise((resolve) => {
    if (!url) return resolve(null);
    const img = new Image();
    // Same origin, so the canvas stays clean and can still be exported.
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

// Draws the photo filling the frame, cropped to fit rather than squashed.
function drawCover(ctx, img, x, y, w, h){
  const scale = Math.max(w / img.width, h / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

async function drawProductCard(canvas, product){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const T = cardTheme();
  await loadCanvasFonts();

  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, T.from); grad.addColorStop(1, T.to);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

  // The photo, large, in the upper two thirds.
  const img = await loadProductImage(productImageUrl(product, 'full'));
  const boxX = 80, boxY = 300, boxW = w - 160, boxH = 1080;
  if (img){
    ctx.save();
    ctx.beginPath();
    ctx.rect(boxX, boxY, boxW, boxH);
    ctx.clip();
    drawCover(ctx, img, boxX, boxY, boxW, boxH);
    ctx.restore();
  } else {
    ctx.fillStyle = 'rgba(255,253,249,.12)';
    ctx.fillRect(boxX, boxY, boxW, boxH);
  }

  ctx.textBaseline = 'alphabetic';

  // Name, wrapped, under the photo.
  ctx.fillStyle = T.text;
  ctx.font = `600 62px ${CARD_BRAND_FONT}`;
  const nameLines = wrapCanvasText(ctx, product.name || '', boxW).slice(0, 2);
  let y = boxY + boxH + 110;
  nameLines.forEach((line) => { ctx.fillText(line, boxX, y); y += 74; });

  // Price.
  const price = isVoucher(product) ? 'Gift voucher' : 'R' + (product.price || '');
  ctx.fillStyle = T.accent;
  ctx.font = `500 54px ${CARD_BODY_FONT}`;
  ctx.fillText(price, boxX, y + 14);

  // A nudge towards the link sticker.
  ctx.fillStyle = T.text;
  ctx.font = `500 30px ${CARD_BODY_FONT}`;
  ctx.globalAlpha = 0.75;
  ctx.fillText('Tap the link to see it', boxX, y + 86);
  ctx.globalAlpha = 1;

  await drawWatermark(ctx, w, h);
}

function canvasToBlob(canvas){
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.92));
}

// Two taps, deliberately.
//
// Safari on iPhone only allows navigator.share() and clipboard writes while a
// user gesture is still "live". Drawing the card and reading the photo takes
// long enough that the gesture has expired by the time share() is called, and
// iOS then refuses with no useful message. So: the first tap prepares the
// picture, the second tap shares it — and that second tap calls share()
// immediately, with nothing awaited in between.
async function prepareShare(id){
  const product = products.find(p => p.id === id);
  if (!product) return;

  // Fire the clipboard write BEFORE anything is awaited, while the gesture is
  // still valid. On iOS this is the only moment it will be allowed.
  const url = productUrl(product);
  let copying = null;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      copying = navigator.clipboard.writeText(url);
    }
  } catch (e) { /* the link is shown underneath anyway */ }

  transient.shareStatus = { id, text: 'Making the picture\u2026' };
  render();

  try {
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1920;
    await drawProductCard(canvas, product);
    const blob = await canvasToBlob(canvas);
    const name = (product.name || 'product').replace(/[^a-z0-9]+/gi, '-').toLowerCase();

    let copied = false;
    try { if (copying){ await copying; copied = true; } } catch (e) { copied = false; }

    transient.sharePrepared = {
      id,
      file: new File([blob], `bling-${name}.jpg`, { type: 'image/jpeg' }),
      canvas,
      name,
      copied,
    };
    transient.shareStatus = { id, text: copied
      ? 'Ready. The link is copied \u2014 now send the picture to Instagram.'
      : 'Ready. Copy the link below, then send the picture to Instagram.' };
  } catch (e) {
    transient.sharePrepared = null;
    transient.shareStatus = { id, text: "Couldn't make the picture \u2014 " + (e.message || 'try again') };
  }
  render();
}

// Second tap. Nothing is awaited before share() so the gesture stays valid.
function sendPreparedShare(){
  const ready = transient.sharePrepared;
  if (!ready) return;

  if (navigator.canShare && navigator.canShare({ files: [ready.file] })){
    navigator.share({ files: [ready.file], title: 'Bling Happiness' })
      .then(() => {
        transient.shareStatus = { id: ready.id, text: ready.copied
          ? 'Sent. Paste the link into a link sticker.'
          : 'Sent. Copy the link below for the sticker.' };
        transient.sharePrepared = null;
        render();
      })
      .catch((e) => {
        // Cancelling is not a failure.
        if (!/abort/i.test(e.name || '')){
          transient.shareStatus = { id: ready.id, text: 'Sharing was blocked \u2014 use Save picture instead.' };
          render();
        }
      });
    return;
  }

  // No share sheet: save it to the camera roll instead.
  savePreparedShare();
}

function savePreparedShare(){
  const ready = transient.sharePrepared;
  if (!ready) return;
  downloadCanvas(ready.canvas, `bling-${ready.name}.jpg`);
  transient.shareStatus = { id: ready.id, text: ready.copied
    ? 'Picture saved. The link is copied \u2014 add both in Instagram.'
    : 'Picture saved. Copy the link below for the sticker.' };
  transient.sharePrepared = null;
  render();
}

function cancelShare(){
  transient.sharePrepared = null;
  transient.shareStatus = null;
  render();
}

function productLinkRow(p){
  const url = productUrl(p);
  return `

             <button onclick="savePreparedShare()">Save the picture instead</button>
