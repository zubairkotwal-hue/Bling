// Up to 4 pictures. The first is the one shown in the shop grid.
// The preview strip is updated in place: a full re-render here would wipe the
// name and price already typed into the form.
async function handleShopFile(e){
  const files = Array.from(e.target.files || []);
  if (!files.length) return;

  const statusEl = document.getElementById('imageStatus');
  if (!Array.isArray(transient.shopImages)) transient.shopImages = [];
  const room = MAX_PICTURES - transient.shopImages.length;
  const taking = files.slice(0, Math.max(0, room));

  if (!taking.length){
    transient.imageStatus = `That is already ${MAX_PICTURES} pictures \u2014 remove one first.`;
    if (statusEl) statusEl.textContent = transient.imageStatus;
    e.target.value = '';
    return;
  }

  if (statusEl) statusEl.textContent = taking.length > 1
    ? `Preparing ${taking.length} pictures\u2026` : 'Preparing picture\u2026';

  let failed = 0;
  for (const file of taking){
    try {
      // A small one for the grid, a larger one for the product page.
      const [thumb, full] = await Promise.all([
        resizeImage(file, 500, 0.72),
        resizeImage(file, 1400, 0.82),
      ]);
      transient.shopImages.push({ thumb, full });
    } catch (err) { failed += 1; }
  }

  const n = transient.shopImages.length;
  const kb = Math.round(transient.shopImages
    .reduce((a, im) => a + im.thumb.length + im.full.length, 0) / 1024);
  transient.shopImageData = n ? transient.shopImages[0].thumb : null;
  transient.imageStatus = n
    ? `${n} picture${n === 1 ? '' : 's'} ready (${kb} KB)${failed ? ` \u2014 ${failed} could not be used` : ''}${
        files.length > taking.length ? ` \u2014 only ${MAX_PICTURES} are allowed` : ''}.`
    : "Couldn't use that picture \u2014 try another one.";
  if (statusEl) statusEl.textContent = transient.imageStatus;
  e.target.value = '';
  paintPictureStrip();
}

// Redraws just the thumbnail strip, leaving the rest of the form alone.
function paintPictureStrip(){
  const strip = document.getElementById('picStrip');
  if (!strip) return;
  strip.innerHTML = pictureStripHtml();
}

function pictureStripHtml(){
  const list = Array.isArray(transient.shopImages) ? transient.shopImages : [];
  const editing = transient.editingProductId;
  const edited = editing ? products.find(p => p.id === editing) : null;

  // While editing, show the pictures already saved until new ones are chosen.
  if (!list.length && edited && edited.has_image){
    const n = pictureCount(edited);
    return `<div class="bh-pics">
      ${Array.from({ length: n }, (_, i) => `
        <div class="bh-pic">
          <img src="${productImageUrl(edited, 'thumb', i)}" alt="">
          ${i === 0 ? '<span class="main">Main</span>' : ''}
        </div>`).join('')}
    </div>
    <p class="bh-pics-note">${n} picture${n === 1 ? '' : 's'} saved. Choosing new ones replaces all of them.</p>`;
  }

  if (!list.length) return '';

  return `<div class="bh-pics">
    ${list.map((im, i) => `
      <div class="bh-pic">
        <img src="${im.thumb}" alt="">
        ${i === 0 ? '<span class="main">Main</span>' : ''}
        <button class="x" onclick="removePicture(${i})" title="Remove">\u00d7</button>
        ${i > 0 ? `<button class="up" onclick="makeMainPicture(${i})" title="Make this the main one">\u2605</button>` : ''}
      </div>`).join('')}
  </div>
  <p class="bh-pics-note">The first one shows in the shop. ${list.length} of ${MAX_PICTURES} used.</p>`;
}

function removePicture(i){
  if (!Array.isArray(transient.shopImages)) return;
  transient.shopImages.splice(i, 1);
  transient.shopImageData = transient.shopImages.length ? transient.shopImages[0].thumb : null;
  const n = transient.shopImages.length;
  transient.imageStatus = n ? `${n} picture${n === 1 ? '' : 's'} ready.` : 'No pictures chosen.';
  const statusEl = document.getElementById('imageStatus');
  if (statusEl) statusEl.textContent = transient.imageStatus;
  paintPictureStrip();
}

function makeMainPicture(i){
  if (!Array.isArray(transient.shopImages)) return;
  const [pic] = transient.shopImages.splice(i, 1);
  transient.shopImages.unshift(pic);
  transient.shopImageData = pic.thumb;
  paintPictureStrip();
}

function changeSizeType(type){
  transient.sizeType = type;
  // free size selects itself automatically — there is only one option
  transient.selectedSizes = type === 'freesize' ? ['Free size'] : [];
  // Rebuild only the size grid so typed fields aren't lost.
  transient.orderSizes = [];
  const grid = document.getElementById('shopSizeGrid');
  if (grid){
    grid.innerHTML = SIZE_PRESETS[type].options.map(s =>
      `<button class="bh-size-opt ${transient.selectedSizes.includes(s) ? 'on' : ''}" onclick="toggleSize('${escapeHtml(s)}', this)">${escapeHtml(s)}</button>`
    ).join('');
  }
  const oGrid = document.getElementById('shopOrderSizeGrid');
  if (oGrid){
    oGrid.innerHTML = SIZE_PRESETS[type].options.map(s =>
      `<button class="bh-size-opt to-order" onclick="toggleOrderSize('${escapeHtml(s)}', this)">${escapeHtml(s)}</button>`
    ).join('');
  }
}

// Read whatever is currently in the three free-text boxes back into state.
// Anything that triggers a re-render while the product form is open must call
// this first, or the typed name and price are thrown away.
function captureProductForm(){
  const n = document.getElementById('shopName');
  const p = document.getElementById('shopPrice');
  const d = document.getElementById('shopDesc');
  if (n) transient.shopName = n.value;
  if (p) transient.shopPrice = p.value;
  if (d) transient.shopDesc  = d.value;
}

function changeProductType(cat){
  captureProductForm();
  transient.category = cat;
  render(); // the form changes shape for vouchers
}

function toggleColour(name, btn){
  const i = transient.colours.indexOf(name);
  if (i === -1) transient.colours.push(name);
  else transient.colours.splice(i, 1);
  if (btn) btn.classList.toggle('on', i === -1);
}

function changeStockStatus(v){
  transient.stockStatus = v;
  if (v === 'made_to_order') transient.selectedSizes = [];
  const wrap = document.getElementById('inStockWrap');
  if (wrap) wrap.style.display = v === 'made_to_order' ? 'none' : 'block';
}

function toggleOrderSize(s, btn){
  const i = transient.orderSizes.indexOf(s);
  if (i === -1) transient.orderSizes.push(s);
  else transient.orderSizes.splice(i, 1);
  if (btn) btn.classList.toggle('on', i === -1);
}

function toggleSize(s, btn){
  const i = transient.selectedSizes.indexOf(s);
  if (i === -1) transient.selectedSizes.push(s);
  else transient.selectedSizes.splice(i, 1);
  // Update only this button — a full re-render would wipe whatever has
  // already been typed into the name/price/description fields.
  if (btn) btn.classList.toggle('on', i === -1);
}

// Load an existing product into the same form used for adding. Everything
// needed is already in the products list, so this needs no extra request.
function editProduct(id){
  const p = products.find(x => x.id === id);
  if (!p) return;
  transient.editingProductId = id;
  transient.editingHasImage = !!p.has_image;
  transient.shopName  = p.name || '';
  transient.shopPrice = isVoucher(p) ? '' : String(p.price == null ? '' : p.price);
  transient.shopDesc  = p.description || '';
  transient.sizeType  = SIZE_PRESETS[p.size_type] ? p.size_type : 'freesize';
  transient.selectedSizes = productSizes(p).slice();
  transient.orderSizes    = orderOnlySizes(p).slice();
  transient.colours   = productColours(p).slice();
  transient.stockStatus = p.stock_status === 'made_to_order' ? 'made_to_order' : 'in_stock';
  transient.category  = p.category || '';
  // A new picture is optional — the existing one stays unless one is chosen.
  transient.shopImages = [];
  transient.shopImageData = null;
  transient.imageStatus = '';
  transient.loadError = '';
  render();
  const card = document.getElementById('shopFormCard');
  if (card && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetProductForm(){
  transient.editingProductId = null;
  transient.editingHasImage = false;
  transient.shopName = '';
  transient.shopPrice = '';
  transient.shopDesc = '';
  transient.shopImageData = null;
  transient.shopImages = [];
  transient.imageStatus = '';
  transient.selectedSizes = transient.sizeType === 'freesize' ? ['Free size'] : [];
  transient.orderSizes = [];
  transient.colours = [];
}

function cancelEditProduct(){
  resetProductForm();
  transient.loadError = '';
  render();
}

async function addProduct(){
  captureProductForm();
  const name = (transient.shopName || '').trim();
  const isGiftVoucher = transient.category === 'Gift Voucher';
  const price = isGiftVoucher ? String(VOUCHER_MIN) : (transient.shopPrice || '').trim();
  const description = (transient.shopDesc || '').trim();

  if (!transient.category){
    transient.loadError = 'Choose a category for this product.';
    render();
    return;
  }
  if (!name || !price){
    transient.loadError = transient.editingProductId
      ? 'A product needs both a name and a price.'
      : 'Give the product a name and a price before adding it.';
    render();
    return;
  }
  if (!isGiftVoucher && transient.selectedSizes.length === 0 && transient.orderSizes.length === 0){
    transient.loadError = 'Pick at least one size \u2014 either in stock, or one you can order in.';
    render();
    return;
  }
  transient.loadError = '';
  const editingId = transient.editingProductId;
  const payload = {
    name, price,
    description,
    sizeType: transient.sizeType,
    sizes: transient.selectedSizes,
    orderSizes: transient.orderSizes,
    stockStatus: transient.stockStatus,
    category: transient.category,
    colours: transient.colours,
    productType: isGiftVoucher ? 'voucher' : 'item',
  };
  // On an edit, a picture is only sent if a new one was chosen — otherwise the
  // existing one is left in place.
  const pics = Array.isArray(transient.shopImages) ? transient.shopImages : [];
  if (pics.length) payload.images = pics;
  else if (!editingId) payload.images = null;

  try {
    await apiFetch('/products', {
      method: editingId ? 'PATCH' : 'POST',
      body: JSON.stringify(editingId ? Object.assign({ id: editingId }, payload) : payload),
    });
  } catch (err) {
    // Keep everything typed in so the work isn't lost on a failed save.
    transient.loadError = editingId
      ? "Couldn't save those changes \u2014 check your connection and try again."
      : "Couldn't add that product \u2014 check your connection and try again.";
    render();
    return;
  }

  resetProductForm();
  await fetchProducts();
  render();
}
async function removeProduct(id){ await apiFetch('/products', { method: 'DELETE', body: JSON.stringify({ id }) }); await fetchProducts(); render(); }

// ---- Admin: leads manager ----
// Orders are grouped by what needs doing, and each card shows one obvious
// next action. Documents and deleting are folded away behind "More", because
// twelve buttons on every card made the list impossible to scan.
const LEAD_GROUPS = [
  { status:'Enquired', title:'Waiting on payment',  note:'Sent the banking details, waiting for the money.' },
  { status:'Paid',     title:'Paid \u2014 to pack',      note:'Money is in. Pack these.' },
  { status:'Ready',    title:'Ready to go out',     note:'Packed. Tell them it is on the way or ready to collect.' },
  { status:'Sent',     title:'Done',                note:'Archive these once you are finished with them.' },
];

function leadSummary(l){
  const total = l.total || l.price || '';
  const method = l.delivery_method || l.deliveryMethod || 'Collection';
  return `
    <div class="bh-ord-top">
      <div>
        <span class="nm">${escapeHtml(l.buyer || 'No name')}</span>
        <span class="it">${escapeHtml(leadItemList(l)).replace(/\n/g, '<br>')}</span>
        <span class="mt">${l.phone ? escapeHtml(l.phone) + ' \u00b7 ' : ''}${escapeHtml(method)}${l.created_at ? ' \u00b7 ' + agoWords(l.created_at) : ''}</span>
        ${l.address ? `<span class="mt">${escapeHtml(l.address)}</span>` : ''}
        ${l.lead_time ? `<span class="mt" style="color:#a6752f">${escapeHtml(l.lead_time)}</span>` : ''}
        ${l.discount_code ? `<span class="mt" style="color:var(--ok)">${escapeHtml(l.discount_code)} \u2212R${escapeHtml(l.discount_amount || '0')}</span>` : ''}
      </div>
      ${total ? `<span class="amt">R${escapeHtml(total)}</span>` : ''}
    </div>`;
}

function leadCard(l){
  const open = transient.openLeadDocs === l.id;
  const hasPhone = !!l.phone;
  const wa = (kind, label, cls) => hasPhone
    ? `<button class="${cls}" onclick="sendLeadWhatsApp('${l.id}','${kind}')">${label}</button>` : '';

  // One primary action per status, plus the nudges she asked for.
  let actions = '';
  if (l.status === 'Enquired'){
    actions = `${wa('order','Send order &amp; banking','bh-ord-go')}
               ${wa('reminder','Remind about payment','bh-ord-2nd')}`;
  } else if (l.status === 'Paid'){
    actions = `${wa('receipt','Send receipt','bh-ord-go')}
               ${wa('update','Keep them posted','bh-ord-2nd')}`;
  } else if (l.status === 'Ready'){
    actions = `${wa('delivery','Send delivery message','bh-ord-go')}
               ${wa('update','Keep them posted','bh-ord-2nd')}`;
  } else {
    actions = `<button class="bh-ord-go" onclick="archiveLead('${l.id}')">Archive this order</button>
               ${wa('update','Message them','bh-ord-2nd')}`;
  }

  const nextLabel = { Enquired:'Mark as paid', Paid:'Mark as packed', Ready:'Mark as sent' }[l.status];

  return `
    <div class="bh-ord">
      ${leadSummary(l)}
      ${!hasPhone ? `<p class="bh-ord-warn">No WhatsApp number saved, so nothing can be sent from here.</p>` : ''}
      <div class="bh-ord-acts">${actions}</div>
      <div class="bh-ord-foot">
        ${nextLabel ? `<button class="bh-ord-next" onclick="cycleLeadStatus('${l.id}')">${nextLabel}</button>` : ''}
        <button class="bh-ord-more" onclick="toggleLeadDocs('${l.id}')">${open ? 'Less' : 'More'}</button>
      </div>
      ${open ? `
        <div class="bh-ord-docs">
          ${['order','receipt','delivery'].map(k => `
            <div class="row">
              <span>${k === 'order' ? 'Order &amp; banking' : (k === 'receipt' ? 'Receipt' : 'Delivery')}</span>
              ${hasPhone ? `<button onclick="sendLeadWhatsApp('${l.id}','${k}')">Send</button>` : ''}
              <button onclick="downloadLeadCard('${l.id}','${k}')">Picture</button>
              <button onclick="downloadLeadPDF('${l.id}','${k}')">PDF</button>
            </div>`).join('')}
          <div class="row">
            <span>Archived orders can be put back</span>
            <button onclick="archiveLead('${l.id}')">Archive</button>
            <button class="risk" onclick="removeLead('${l.id}')">Delete for good</button>
          </div>
        </div>` : ''}
    </div>`;
}

// ---- Chasing several unpaid orders ----
// WhatsApp gives no way to send to many people at once from a web page, and
// bulk-sending tools get numbers banned. So this walks through them one at a
// time instead: one tap opens the chat with the message already written, she
// sends, comes back, taps next. Each message is still personalised.
function chaseable(){
  return leads.filter(l => l.status === 'Enquired' && l.phone);
}

function startChase(){
  const list = chaseable();
  if (!list.length) return;
  transient.chase = { ids: list.map(l => l.id), i: 0, done: [], skipped: [] };
  render();
}
function chaseOpen(){
  const c = transient.chase;
  const lead = leads.find(l => l.id === c.ids[c.i]);
  if (!lead) return;
  sendLeadWhatsApp(lead.id, 'reminder');
  c.opened = lead.id;
  render();
}
function chaseNext(sent){
  const c = transient.chase;
  (sent ? c.done : c.skipped).push(c.ids[c.i]);
  c.i += 1;
  c.opened = null;
  render();
}
function chaseStop(){ transient.chase = null; render(); }

function renderChase(){
  const c = transient.chase;
  if (!c) return '';
  const total = c.ids.length;

  if (c.i >= total){
    return `
      <div class="bh-chase">
        <h4>${c.done.length} of ${total} reminded</h4>
        <p>${c.skipped.length ? c.skipped.length + ' skipped. ' : ''}You can run this again any time.</p>
        <button class="bh-ord-go" onclick="chaseStop()">Close</button>
      </div>`;
  }

  const lead = leads.find(l => l.id === c.ids[c.i]);
  const amount = lead.total || lead.price || '';
  const opened = c.opened === lead.id;

  return `
    <div class="bh-chase">
      <div class="bh-chase-bar"><span style="width:${Math.round((c.i / total) * 100)}%"></span></div>
      <p class="step">${c.i + 1} of ${total}</p>
      <h4>${escapeHtml(lead.buyer || 'No name')}</h4>
      <p>${escapeHtml(lead.phone)}${amount ? ' \u00b7 R' + escapeHtml(amount) + ' outstanding' : ''}
         ${lead.created_at ? '\u00b7 ordered ' + agoWords(lead.created_at) : ''}</p>
      ${opened
        ? `<button class="bh-ord-go" onclick="chaseNext(true)">Sent \u2014 next</button>
           <button class="bh-ord-2nd" onclick="chaseOpen()">Open again</button>`
        : `<button class="bh-ord-go" onclick="chaseOpen()">Open WhatsApp for ${escapeHtml((lead.buyer || '').split(' ')[0] || 'them')}</button>`}
      <div class="bh-chase-foot">
        <button onclick="chaseNext(false)">Skip this one</button>
        <button onclick="chaseStop()">Stop</button>
      </div>
    </div>`;
}

function renderLeadsManager(){
  const live = leads.filter(l => l.status !== 'Archived');
  const archived = leads.filter(l => l.status === 'Archived');
  const owed = live.filter(l => l.status === 'Enquired')
    .reduce((sum, l) => sum + (parseFloat(l.total || l.price) || 0), 0);

  return `
    ${owed > 0 ? `<div class="bh-ord-owed">R${Math.round(owed).toLocaleString('en-ZA')} still to come in across ${live.filter(l => l.status === 'Enquired').length} unpaid ${live.filter(l => l.status === 'Enquired').length === 1 ? 'order' : 'orders'}.</div>` : ''}

    ${LEAD_GROUPS.map(g => {
      const rows = live.filter(l => l.status === g.status);
      if (!rows.length) return '';
      return `
        <div class="bh-ord-group">
          <div class="bh-ord-head">
            <h3>${g.title}</h3>
            <span class="cnt">${rows.length}</span>
            ${g.status === 'Enquired' && rows.filter(l => l.phone).length > 1
              ? `<button class="bh-chase-start" onclick="startChase()">Remind all ${rows.filter(l => l.phone).length}</button>` : ''}
          </div>
          <p class="bh-ord-note">${g.note}</p>
          ${g.status === 'Enquired' ? renderChase() : ''}
          ${rows.map(leadCard).join('')}
        </div>`;
    }).join('')}

    ${live.length === 0 ? `<p class="bh-empty">No orders on the go. Anything bought through the shop lands here on its own.</p>` : ''}
    <p style="font-size:.78rem;color:var(--ok);margin:4px 0 10px">${escapeHtml(transient.leadDownloadStatus)}</p>

    ${archived.length ? `
      <div class="bh-ord-group">
        <button class="bh-ord-head" style="width:100%;background:none;border:none;cursor:pointer;padding:0"
                onclick="transient.showArchivedLeads = !transient.showArchivedLeads; render()">
          <h3>Archived</h3><span class="cnt">${archived.length}</span>
          <span style="margin-left:auto;color:var(--grey)">${transient.showArchivedLeads ? '\u2303' : '\u2304'}</span>
        </button>
        ${transient.showArchivedLeads ? archived.map(l => `
          <div class="bh-ord" style="opacity:.72">
            ${leadSummary(l)}
            <div class="bh-ord-foot">
              <button class="bh-ord-next" onclick="unarchiveLead('${l.id}')">Put back</button>
              <button class="bh-ord-more risk" onclick="removeLead('${l.id}')">Delete for good</button>
            </div>
          </div>`).join('') : ''}
      </div>` : ''}

    <div class="bh-card" style="margin-top:8px">
      <button class="bh-btn-outline" style="width:100%"
              onclick="transient.showAddLead = !transient.showAddLead; render()">
        ${transient.showAddLead ? 'Cancel' : 'Add an order by hand'}
      </button>
      ${transient.showAddLead ? `
        <div style="margin-top:14px">
          <div class="bh-grid2">
            <input id="leadBuyer" class="bh-input" placeholder="Buyer name" style="margin-bottom:12px">
            <input id="leadItem" class="bh-input" placeholder="Item they want" style="margin-bottom:12px">
            <input id="leadPhone" class="bh-input" placeholder="WhatsApp number" style="margin-bottom:12px">
            <input id="leadPrice" class="bh-input" placeholder="Price" style="margin-bottom:12px">
          </div>
          <button class="bh-btn" onclick="addLead()">Add order</button>
        </div>` : ''}
    </div>

    <p class="bh-note">Each order shows the one thing to do next. <strong>More</strong> opens the pictures and PDFs if you need to attach one, and archiving tidies an order away without deleting it.</p>
  `;
}

function toggleLeadDocs(id){
  transient.openLeadDocs = transient.openLeadDocs === id ? null : id;
  render();
}
async function archiveLead(id){
  await apiFetch('/leads', { method: 'PATCH', body: JSON.stringify({ id, status: 'Archived' }) });
  await fetchLeads();
  render();
}
async function unarchiveLead(id){
  await apiFetch('/leads', { method: 'PATCH', body: JSON.stringify({ id, status: 'Sent' }) });
  await fetchLeads();
  render();
}

async function addLead(){
  const buyer = document.getElementById('leadBuyer').value.trim();
  const item = document.getElementById('leadItem').value.trim();
  const phone = document.getElementById('leadPhone').value.trim();
  const price = document.getElementById('leadPrice').value.trim();
  if (!buyer || !item) return;
  await apiFetch('/leads', { method: 'POST', body: JSON.stringify({ buyer, item, phone, price, deliveryMethod: 'Collection' }) });
  await fetchLeads();
  render();
}
async function cycleLeadStatus(id){
  const lead = leads.find(l => l.id === id);
  const next = LEAD_STATUSES[(LEAD_STATUSES.indexOf(lead.status) + 1) % LEAD_STATUSES.length];
  await apiFetch('/leads', { method: 'PATCH', body: JSON.stringify({ id, status: next }) });
  await fetchLeads();
  render();
}
async function removeLead(id){ await apiFetch('/leads', { method: 'DELETE', body: JSON.stringify({ id }) }); await fetchLeads(); render(); }

function sendLeadWhatsApp(id, kind){
  const lead = leads.find(l => l.id === id);
  if (!lead.phone){ alert('No WhatsApp number saved for this order — add one to send a message.'); return; }
  // kind was accepted and then ignored, so every Send button sent the same
  // message. It is passed through now.
  const message = buildLeadMessage(lead, kind);
  window.open(buildWhatsAppLink(lead.phone, message), '_blank');
}

async function downloadLeadPDF(id, kind){
  const lead = leads.find(l => l.id === id);
  transient.leadDownloadStatus = 'Preparing PDF\u2026';
  render();
  try {
    await makeOrderPDF(lead, kind || 'order');
    transient.leadDownloadStatus = 'PDF downloaded \u2014 attach it in WhatsApp.';
  } catch (e) {
    transient.leadDownloadStatus = "Couldn't make the PDF \u2014 please try again.";
  }
  render();
}

async function downloadLeadCard(id, kind){
  const lead = leads.find(l => l.id === id);
  kind = kind || 'order';
  transient.leadDownloadStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawDocCard(canvas, lead, kind);
  await downloadCanvas(canvas, `bling-happiness-${kind}.jpg`);
  transient.leadDownloadStatus = 'Downloaded — attach it in WhatsApp before sending.';
  render();
}

// ---- Admin: reviews ----
function renderReviewsAdmin(){
  const pending = reviews.filter(r => r.status === 'pending');
  const live = reviews.filter(r => r.status === 'approved');
  const row = (r, isPending) => {
    const p = products.find(x => x.id === r.product_id);
    return `
      <div class="bh-qrow">
        <span class="txt">
          <span class="catpill">${escapeHtml(p ? p.name : 'Product')}</span>
          <span class="bh-stars">${'\u2605'.repeat(r.rating)}${'\u2606'.repeat(5-r.rating)}</span>
          <span class="bh-author" style="margin-left:6px">${escapeHtml(authorLabel(r))}</span>
          <br>${escapeHtml(r.text)}
        </span>
        <span class="actions">
          ${isPending ? `<button class="bh-approve" onclick="approveReview('${r.id}')">\u2713 Approve</button>` : ''}
          ${isPending ? `<button class="bh-reject" onclick="rejectReview('${r.id}')">\u2715 Reject</button>` : ''}
          <button class="bh-btn-ghost" style="color:var(--risk);font-size:.72rem" onclick="deleteReview('${r.id}')">Delete</button>
        </span>
      </div>`;
  };
  return `
    <div class="bh-card" style="margin-bottom:16px;background:var(--blushp);border:none">
      <p style="font-size:.85rem;color:var(--grey);margin:0">Reviews wait here until you approve them, the same as stories. Approved ones show on the product and count towards its star rating.</p>
    </div>
    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:10px">Waiting (${pending.length})</h3>
    ${pending.length === 0 ? `<p class="bh-empty">Nothing waiting right now.</p>` : pending.map(r => row(r, true)).join('')}
    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin:24px 0 10px">Published (${live.length})</h3>
    ${live.length === 0 ? `<p class="bh-empty">None yet.</p>` : live.map(r => row(r, false)).join('')}`;
}

async function approveReview(id){ await apiFetch('/reviews', { method:'PATCH', body: JSON.stringify({ id, status:'approved' }) }); await fetchReviews(); render(); }
async function rejectReview(id){ await apiFetch('/reviews', { method:'PATCH', body: JSON.stringify({ id, status:'rejected' }) }); await fetchReviews(); render(); }
async function deleteReview(id){
  if (!confirm('Delete this review for good?')) return;
  await apiFetch('/reviews', { method:'DELETE', body: JSON.stringify({ id }) });
  await fetchReviews(); render();
}

// ---- Admin: gift cards ----
function renderGiftsAdmin(){
  const STATUSES = ['Enquired','Paid','Sent'];
  return `
    <div class="bh-card" style="margin-bottom:16px;background:var(--blushp);border:none">
      <p style="font-size:.85rem;color:var(--grey);margin:0">Gift card orders. Send the payment details, then once the money reflects, send the card itself \u2014 the picture is made for you.</p>
    </div>
    ${giftCards.length === 0 ? `<p class="bh-empty">No gift cards ordered yet.</p>` : ''}
    ${giftCards.map(g => `
      <div class="bh-lead">
        <span class="who">
          <strong>R${escapeHtml(g.amount)}</strong> for <strong>${escapeHtml(g.recipient)}</strong>
          <br><span style="font-size:.78rem;color:var(--grey)">From ${escapeHtml(g.purchaser)}${g.phone ? ' \u00b7 ' + escapeHtml(g.phone) : ''}</span>
          ${g.code ? `<br><span style="font-size:.75rem;color:var(--gold);font-weight:700;letter-spacing:.05em">${escapeHtml(g.code)}</span>` : ''}
          ${g.note ? `<br><span style="font-size:.75rem;color:var(--grey)">\u201c${escapeHtml(g.note)}\u201d</span>` : ''}
        </span>
        <span class="bh-statuspill" onclick="cycleGiftStatus('${g.id}')" title="Tap to move it along">${escapeHtml(g.status)}</span>
        <span class="bh-doc-actions">
          <span class="bh-doc-group">
            <span class="bh-doc-label">Payment</span>
            ${g.phone ? `<button class="bh-wa-mini" onclick="sendGiftWhatsApp('${g.id}','payment')">Send</button>` : ''}
          </span>
          <span class="bh-doc-group">
            <span class="bh-doc-label">The card</span>
            ${g.phone ? `<button class="bh-wa-mini" onclick="sendGiftWhatsApp('${g.id}','card')">Send</button>` : ''}
            <button class="bh-doc-mini" onclick="downloadGiftCard('${g.id}')">\u2193</button>
          </span>
          <button class="bh-btn-ghost" style="color:var(--risk);font-size:.75rem" onclick="deleteGiftCard('${g.id}')">\uD83D\uDDD1</button>
        </span>
      </div>`).join('')}
    <p style="font-size:.78rem;color:var(--ok);min-height:1.1em;margin:6px 0 0">${escapeHtml(transient.giftStatus || '')}</p>
    <p class="bh-note">Tap the status to move it: Enquired \u2192 Paid \u2192 Sent. \u201cThe card\u201d downloads the picture to attach in WhatsApp.</p>`;
}

async function cycleGiftStatus(id){
  const STATUSES = ['Enquired','Paid','Sent'];
  const g = giftCards.find(x => x.id === id);
  const next = STATUSES[(STATUSES.indexOf(g.status) + 1) % STATUSES.length];
  await apiFetch('/giftcards', { method:'PATCH', body: JSON.stringify({ id, status: next }) });
  await fetchGiftCards(); render();
}

function sendGiftWhatsApp(id, kind){
  const g = giftCards.find(x => x.id === id);
  if (!g || !g.phone){ alert('No WhatsApp number saved for this order.'); return; }
  let msg;
  if (kind === 'payment'){
    msg = `Hi ${g.purchaser}, thanks for your gift card order!\n\nGift card for ${g.recipient} \u2014 R${g.amount}\n\nPlease pay via EFT:\n${setting('bankDetails')}\n\nAs soon as payment reflects we'll send the card through.`;
  } else {
    msg = `Hi ${g.purchaser}, here is the gift card for ${g.recipient} \u2014 R${g.amount}.\n\nCode: ${g.code}\n\nThey can use it on anything in the shop. Thank you!`;
  }
  window.open(buildWhatsAppLink(g.phone, msg), '_blank');
}

async function downloadGiftCard(id){
  const g = giftCards.find(x => x.id === id);
  transient.giftStatus = 'Preparing the card\u2026';
  render();
  const canvas = document.createElement('canvas');
  await drawGiftCard(canvas, g);
  await downloadCanvas(canvas, 'bling-gift-card.jpg');
  transient.giftStatus = 'Downloaded \u2014 attach it in WhatsApp.';
  render();
}

async function deleteGiftCard(id){
  if (!confirm('Delete this gift card order?')) return;
  await apiFetch('/giftcards', { method:'DELETE', body: JSON.stringify({ id }) });
  await fetchGiftCards(); render();
}

// ---- Admin: discount codes ----
function renderDiscountsAdmin(){
  return `
    <div class="bh-card" style="margin-bottom:18px">
      <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:14px">Create a code</h3>
      <label class="bh-label">Code</label>
      <input id="dcCode" class="bh-input" placeholder="e.g. SUMMER10" style="margin-bottom:12px;text-transform:uppercase">

      <div class="bh-grid2">
        <div>
          <label class="bh-label">Type</label>
          <select id="dcKind" class="bh-select" style="margin-bottom:12px">
            <option value="percent">Percentage off</option>
            <option value="amount">Rand amount off</option>
          </select>
        </div>
        <div>
          <label class="bh-label">Value</label>
          <input id="dcValue" type="number" class="bh-input" placeholder="10" style="margin-bottom:12px">
        </div>
      </div>

      <label class="bh-label">How many people can use it?</label>
      <input id="dcMax" type="number" class="bh-input" placeholder="e.g. 10" style="margin-bottom:6px">
      <p style="font-size:.75rem;color:var(--grey);margin:0 0 14px">After this many orders the code stops working. Leave it empty or 0 for no limit.</p>

      <p id="dcError" style="color:var(--risk);font-size:.8rem;min-height:1.1em;margin:0 0 8px"></p>
      <button class="bh-btn" onclick="createDiscount()">+ Create code</button>
    </div>

    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:12px">Codes (${discounts.length})</h3>
    ${discounts.length === 0 ? `<p class="bh-empty">No codes yet.</p>` : ''}
    ${discounts.map(d => {
      const used = parseInt(d.used_count,10) || 0;
      const max = parseInt(d.max_uses,10) || 0;
      const spent = max > 0 && used >= max;
      return `
      <div class="bh-lead" style="${(!d.active || spent) ? 'opacity:.55' : ''}">
        <span class="who">
          <strong style="letter-spacing:.06em">${escapeHtml(d.code)}</strong>
          \u00b7 ${d.kind === 'percent' ? escapeHtml(String(d.value)) + '% off' : 'R' + escapeHtml(String(d.value)) + ' off'}
          <br><span style="font-size:.78rem;color:var(--grey)">
            Used ${used}${max > 0 ? ' of ' + max : ' times (no limit)'}
            ${spent ? ' \u00b7 finished' : ''}${!d.active ? ' \u00b7 switched off' : ''}
          </span>
        </span>
        <button class="bh-statuspill" onclick="toggleDiscount('${d.id}', ${d.active ? 'false' : 'true'})">${d.active ? 'On' : 'Off'}</button>
        <button class="bh-btn-ghost" style="color:var(--risk);font-size:.75rem" onclick="deleteDiscount('${d.id}')">\uD83D\uDDD1</button>
      </div>`;
    }).join('')}
    <p class="bh-note">A code stops working on its own once it hits its limit \u2014 the check happens on the server when the order is placed, so it can't be got around.</p>`;
}

async function createDiscount(){
  const code = document.getElementById('dcCode').value.trim().toUpperCase();
  const kind = document.getElementById('dcKind').value;
  const value = document.getElementById('dcValue').value;
  const maxUses = document.getElementById('dcMax').value;
  const err = document.getElementById('dcError');

  if (!code){ err.textContent = 'Give the code a name.'; return; }
  if (!value || parseFloat(value) <= 0){ err.textContent = 'Give it a value.'; return; }
  if (kind === 'percent' && parseFloat(value) > 100){ err.textContent = "A percentage can't be more than 100."; return; }

  err.textContent = 'Creating\u2026';
  try {
    await apiFetch('/discounts', { method:'POST', body: JSON.stringify({ code, kind, value, maxUses }) });
    await fetchDiscounts();
    err.textContent = '';
  } catch (e) {
    err.textContent = String(e.message || '').includes('already') ? 'That code already exists.' : "Couldn't create that code.";
  }
  render();
}

async function toggleDiscount(id, active){
  await apiFetch('/discounts', { method:'PATCH', body: JSON.stringify({ id, active }) });
  await fetchDiscounts(); render();
}
async function deleteDiscount(id){
  if (!confirm('Delete this code? Anyone still holding it will no longer be able to use it.')) return;
  await apiFetch('/discounts', { method:'DELETE', body: JSON.stringify({ id }) });
  await fetchDiscounts(); render();
}

// ---- Admin: help messages ----
function renderHelpAdmin(){

  return `

      <p style="font-size:.85rem;color:var(--grey);margin:0">Messages from the Help page. Reply on WhatsApp, then mark them done so the list stays short.</p>
    </div>
    ${helpMessages.length === 0 ? `<p class="bh-empty">No messages.</p>` : ''}
    ${helpMessages.map(h => `
      <div class="bh-lead" style="${isNew(h) ? '' : 'opacity:.6'}">
        <span class="who">
          <strong>${escapeHtml(h.name || 'Someone')}</strong>
          ${h.phone ? `<span style="font-size:.78rem;color:var(--grey)"> \u00b7 ${escapeHtml(h.phone)}</span>` : ''}
          <br><span style="font-size:.85rem">${escapeHtml(h.message)}</span>

      </div>`).join('')}`;

async function cycleHelpStatus(id){
  const h = helpMessages.find(x => x.id === id);
  const next = h.status === 'new' ? 'done' : 'new';
  await apiFetch('/help', { method:'PATCH', body: JSON.stringify({ id, status: next }) });
  await fetchHelp(); render();
}

function replyHelpWhatsApp(id){
  const h = helpMessages.find(x => x.id === id);
  if (!h.phone){ alert('No number saved for this message.'); return; }
  const msg = `Hi ${h.name || 'there'}, thanks for getting in touch with Bling Happiness \u2014 you asked:\n\n\u201c${h.message}\u201d\n\n`;
  window.open(buildWhatsAppLink(h.phone, msg), '_blank');
}

async function deleteHelp(id){
  if (!confirm('Delete this message?')) return;
  await apiFetch('/help', { method:'DELETE', body: JSON.stringify({ id }) });
  await fetchHelp(); render();
}

// ---- Admin notifications ----
// Per-type, because the volumes are wildly different: a couple of orders a day
// against 50-100 stories. One setting for all of them would either bury the
// orders or turn the phone into an alarm.
const NOTIFY_TYPES = [
  { key:'orders',  label:'New orders',      note:'Someone has bought something.' },
  { key:'help',    label:'Help messages',   note:'A customer is waiting on a reply.' },
  { key:'replies',  label:'Replies to stories', note:'Needs approving before it shows.' },
  { key:'reviews', label:'Product reviews', note:'Needs approving before it shows.' },
  { key:'stories', label:'New stories',     note:'Busy \u2014 50 to 100 a day. Batched is usually wiser.' },
];
const NOTIFY_DEFAULTS = {
  orders:'instant', help:'instant', replies:'instant', reviews:'instant',
  stories:'batched', quietFrom:22, quietTo:7,
};

function notifyPrefs(){
  try {
    const raw = setting('notifyPrefs');
    return raw ? Object.assign({}, NOTIFY_DEFAULTS, JSON.parse(raw)) : Object.assign({}, NOTIFY_DEFAULTS);
  } catch (e) { return Object.assign({}, NOTIFY_DEFAULTS); }
}

function setNotifyPref(key, value){
  const prefs = notifyPrefs();
  prefs[key] = value;
  settings.notifyPrefs = JSON.stringify(prefs);
  transient.notifyDirty = true;
  render();
}

function urlBase64ToUint8Array(base64){
  const padding = '='.repeat((4 - base64.length % 4) % 4);
  const raw = atob((base64 + padding).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function enableNotifications(){
  transient.notifyStatus = 'Setting up\u2026';
  render();
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)){
      transient.notifyStatus = "This browser can't do notifications. On an iPhone, add the site to your home screen first, then try again.";
      return render();
    }

    const info = await apiFetch('/push');
    if (!info.configured){
      transient.notifyStatus = 'The server has no notification keys set up yet \u2014 see the setup note below.';
      return render();
    }

    const permission = await Notification.requestPermission();
    if (permission !== 'granted'){
      transient.notifyStatus = permission === 'denied'
        ? 'Notifications are blocked for this site. You will have to allow them in your browser settings for this site, then try again.'
        : 'Not enabled \u2014 you can tap again whenever you like.';
      return render();
    }

    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;

    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(info.publicKey),
      });
    }

    const res = await apiFetch('/push', {
      method: 'POST',
      body: JSON.stringify({ subscription: sub.toJSON() }),
    });
    transient.notifyOn = true;
    transient.notifyStatus = `This device is signed up${res.devices > 1 ? ` (${res.devices} devices)` : ''}. Send yourself a test to be sure.`;
  } catch (e) {
    transient.notifyStatus = "Couldn't set that up \u2014 " + (e.message || 'try again');
  }
  render();
}

async function testNotification(){
  transient.notifyStatus = 'Sending\u2026';
  render();
  try {
    const r = await apiFetch('/push', { method: 'POST', body: JSON.stringify({ test: true }) });
    transient.notifyStatus = r.sent
      ? 'Sent. It should appear in a second or two.'
      : "Nothing was sent \u2014 this device may need signing up again.";
  } catch (e) {
    transient.notifyStatus = "Couldn't send \u2014 " + (e.message || 'try again');
  }
  render();
}

async function disableNotifications(){
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub){
      await apiFetch('/push', { method: 'DELETE', body: JSON.stringify({ endpoint: sub.endpoint }) });
      await sub.unsubscribe();
    }
    transient.notifyOn = false;
    transient.notifyStatus = 'Turned off on this device.';
  } catch (e) {
    transient.notifyStatus = "Couldn't turn it off \u2014 " + (e.message || 'try again');
  }
  render();
}

async function checkNotifyState(){
  try {
    if (!('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    const on = !!sub && Notification.permission === 'granted';
    if (on !== transient.notifyOn){ transient.notifyOn = on; render(); }
  } catch (e) { /* not supported */ }
}

const SETTING_KEYS = ['notifyPrefs','maskOnCards','maskOnSite','maskWordsStrong','maskWordsExplicit','shippingCost','freeShippingOver','announcement','leadTimeLabel','storyCardTag','cardTheme','categories','shopCategories','bankDetails','collectionDetails','orderMessage','receiptMessage','shippingMessage','collectionMessage','reminderMessage','updateMessage'];

function readCategoryInputs(){
  return Array.from(document.querySelectorAll('.bh-cat-input'))
    .map(el => el.value.trim())
    .filter(Boolean);
}

function readShopCategoryInputs(){
  return Array.from(document.querySelectorAll('.bh-shopcat-input'))
    .map(el => el.value.trim())
    .filter(Boolean);
}

function snapshotCategoryEdits(){
  const shop = readShopCategoryInputs();
  const story = readCategoryInputs();
  if (shop.length) settings.shopCategories = JSON.stringify(shop);
  if (story.length) settings.categories = JSON.stringify(story);
}

function addShopCategory(){
  snapshotCategoryEdits();
  const list = readShopCategoryInputs();
  list.push('New department');
  settings.shopCategories = JSON.stringify(list);
  render();
}

function removeShopCategory(i){
  snapshotCategoryEdits();
  const list = readShopCategoryInputs();
  if (list.length <= 1){ alert('Keep at least one department.'); return; }
  const inUse = products.filter(p => p.category === list[i]).length;
  const msg = inUse
    ? `${inUse} ${inUse === 1 ? 'product is' : 'products are'} in "${list[i]}". Removing it will leave ${inUse === 1 ? 'it' : 'them'} without a department until you move ${inUse === 1 ? 'it' : 'them'}. Remove anyway?`
    : `Remove "${list[i]}"?`;
  if (!confirm(msg)) return;
  list.splice(i, 1);
  settings.shopCategories = JSON.stringify(list);
  render();
}

function addCategory(){
  snapshotCategoryEdits();
  const list = readCategoryInputs();
  list.push('New category');
  settings.categories = JSON.stringify(list);
  render();
}

function removeCategory(i){
  snapshotCategoryEdits();
  const list = readCategoryInputs();
  if (list.length <= 1){
    alert('Keep at least one category.');
    return;
  }
  const inUse = stories.filter(s => s.category === list[i] && s.status === 'approved').length;
  const msg = inUse
    ? `${inUse} published ${inUse === 1 ? 'story is' : 'stories are'} in "${list[i]}". Removing it will leave ${inUse === 1 ? 'it' : 'them'} without a folder until you move ${inUse === 1 ? 'it' : 'them'}. Remove anyway?`
    : `Remove "${list[i]}"?`;
  if (!confirm(msg)) return;
  list.splice(i, 1);
  settings.categories = JSON.stringify(list);
  render();
}

async function saveSettings(){
  const status = document.getElementById('settingsStatus');
  const updates = {};
  SETTING_KEYS.forEach(k => {
    const el = document.getElementById('set_' + k);
    if (el) updates[k] = el.value;
  });

  const cats = readCategoryInputs();
  if (!cats.length){
    status.style.color = 'var(--risk)';
    status.textContent = 'Keep at least one story category.';
    return;
  }
  updates.categories = JSON.stringify(cats);

  const shopCats = readShopCategoryInputs();
  if (!shopCats.length){
    status.style.color = 'var(--risk)';
    status.textContent = 'Keep at least one shop department.';
    return;
  }
  updates.shopCategories = JSON.stringify(shopCats);
  // Notification choices live in state, not an input, so carry them through.
  updates.notifyPrefs = JSON.stringify(notifyPrefs());
  if (updates.shippingCost !== undefined && isNaN(parseFloat(updates.shippingCost))){
    status.style.color = 'var(--risk)';
    status.textContent = 'Shipping cost must be a number, like 99.';
    return;
  }
  transient.notifyDirty = false;
  status.style.color = 'var(--grey)';
  status.textContent = 'Saving\u2026';
  try {
    await apiFetch('/settings', { method: 'PATCH', body: JSON.stringify(updates) });
    await fetchSettings();
    status.style.color = 'var(--ok)';
    status.textContent = 'Saved. These are live straight away.';
  } catch (e) {
    status.style.color = 'var(--risk)';
    status.textContent = "Couldn't save \u2014 please try again.";
  }
}

function resetSettings(){
  if (!confirm('Put every setting back to how it started? Anything you have changed here will be lost.')) return;
  SETTING_KEYS.forEach(k => {
    if (k === 'categories' || k === 'shopCategories') return;
    const el = document.getElementById('set_' + k);
    if (el) el.value = DEFAULT_SETTINGS[k];
  });
  const status = document.getElementById('settingsStatus');
  status.style.color = 'var(--grey)';
  status.textContent = 'Put back to the original wording \u2014 tap Save changes to keep it.';
}

          <div class="bh-trim">
            <div class="bh-trim-head">
              <span>The story on the card</span>
              <span id="trimCount">${shown.length} characters</span>
            </div>
            <textarea class="bh-textarea" style="min-height:90px"
              oninput="editTrim(this.value)">${escapeHtml(shown)}</textarea>
            <div class="bh-trim-acts">
              ${longish && !trimmed ? `<button onclick="useSuggestedTrim()">Shorten it for me</button>` : ''}
              ${trimmed ? `<button onclick="resetTrim()">Use the full story</button>` : ''}
            </div>
            <p class="bh-trim-note">${longish
              ? 'This one is long. Shortening it leaves the replies more room and keeps the text bigger \u2014 but read the shortened version before you post it, the last line often carries the point.'
              : 'Short enough to fit as it is. Edit here if you want to.'}</p>
          </div>`;
      })() : ''}
      ${compileStory && compileReplies.length === 0 ? `<p class="bh-empty">This story has no approved replies yet.</p>` : ''}
      ${compileStory && compileReplies.length > 0 ? `
        <div style="margin-bottom:16px">
          ${compileReplies.map(r => `
            <label class="bh-checkrow">
              <input type="checkbox" style="margin-top:3px" ${transient.compileChecked[r.id] ? 'checked' : ''} onchange="toggleCompileCheck('${r.id}')">
              <span>${escapeHtml(r.text)}</span>
            </label>
          `).join('')}
        </div>
        <button class="bh-btn" onclick="createRoundupCard()">Create round-up card →</button>
      ` : ''}
      ${compileStory ? `
        <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:4px">
          ${storyLinkRow(compileStory.id, 'Link for this round-up \u2014 opens the same story')}
        </div>` : ''}
      <p style="font-size:.78rem;margin-top:8px;color:${transient.compileStatus.startsWith('Pick') ? 'var(--risk)' : 'var(--ok)'}">${escapeHtml(transient.compileStatus)}</p>
    </div>
  `;
}

// A first cut at shortening a long story: keep whole sentences up to about
// 200 characters. Never used without her seeing it — the last line of these
// stories usually carries the point, and no automatic rule can spot that.
const TRIM_TARGET = 200;
function suggestTrim(text){
  const t = (text || '').trim();
  if (t.length <= TRIM_TARGET) return t;
  const sentences = t.match(/[^.!?]+[.!?]*/g) || [t];
  let out = '';
  for (const sn of sentences){
    if ((out + sn).trim().length > TRIM_TARGET) break;
    out += sn;
  }
  out = out.trim();
  // No sentence break early enough — cut on a word instead.
  if (!out) out = t.slice(0, TRIM_TARGET).replace(/\s+\S*$/, '') + '\u2026';
  return out;
}

// The text the round-up card actually uses: her edit if there is one,
// otherwise the story as written.
function compileStoryText(){
  const story = stories.find(s => s.id === transient.compileStoryId);
  if (!story) return '';
  return transient.compileTrim !== null ? transient.compileTrim : story.text;
}

function setCompileStory(id){
  transient.compileStoryId = id;
  transient.compileChecked = {};
  transient.compileStatus = '';
  transient.compileTrim = null;
  render();
}

function useSuggestedTrim(){
  const story = stories.find(s => s.id === transient.compileStoryId);
  if (!story) return;
  transient.compileTrim = suggestTrim(story.text);
  render();
}
function resetTrim(){ transient.compileTrim = null; render(); }
function editTrim(v){
  transient.compileTrim = v;
  const c = document.getElementById('trimCount');
  if (c) c.textContent = v.length + ' characters';
}
function toggleCompileCheck(id){ transient.compileChecked[id] = !transient.compileChecked[id]; render(); }

async function downloadStoryCard(id){
  const story = stories.find(s => s.id === id);

  // Read the wording and colour BEFORE re-rendering.
  const tagEl = document.getElementById('cardTagInput');
  let tagText = tagEl ? tagEl.value.trim() : '';
  const themeEl = document.getElementById('cardThemeSelect');
  if (themeEl) transient.cardTheme = themeEl.value;

  // If this person chose a pseudonym, and the wording hasn't been
  // changed by hand, credit them by that pseudonym instead of "Shared anonymously".
  const pseud = (story && story.pseudonym || '').trim();
  if (pseud && (!tagText || tagText === setting('storyCardTag'))){
    tagText = 'Shared by ' + pseud;
  }

  transient.postDownloadStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawStoryCard(canvas, story.text, tagText);
  await downloadCanvas(canvas, 'bling-happiness-story.jpg');
  await apiFetch('/stories', { method: 'PATCH', body: JSON.stringify({ id, posted: true }) });
  await fetchStories();
  transient.postDownloadStatus = 'Downloaded — ready to post to Stories.';
  render();
}

async function createRoundupCard(){
  const compileReplies = replies.filter(r => r.storyId === transient.compileStoryId && r.status === 'approved');
  const chosen = compileReplies
    .filter(r => transient.compileChecked[r.id])
    .map(r => (r.pseudonym ? r.text + '  — ' + r.pseudonym : r.text));
  if (chosen.length === 0){
    transient.compileStatus = 'Pick at least one reply to include.';
    render();
    return;
  }
  // Read the wording and the story BEFORE re-rendering (render rebuilds the input).
  const tagEl2 = document.getElementById('cardTagInput');
  const tagText2 = tagEl2 ? tagEl2.value.trim() : '';
  transient.cardTag = tagText2;
  const themeEl2 = document.getElementById('cardThemeSelect');
  if (themeEl2) transient.cardTheme = themeEl2.value;
  const compileStoryForCard = stories.find(s => s.id === transient.compileStoryId);
  transient.compileStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawCompileCard(canvas, chosen, tagText2, compileStoryText(),
    compileStoryForCard ? (compileStoryForCard.pseudonym || '') : '');
  await downloadCanvas(canvas, 'bling-happiness-roundup.jpg');
  transient.compileStatus = 'Downloaded — ready to post back to Stories.';
  render();
}

// ---- Boot ----
async function boot(){
  render(); // show something immediately

  // Load each thing on its own. If one fails — say a feature hasn't been
  // deployed yet — the rest of the site still works instead of the whole
  // page showing an error.
  const jobs = [
    ['stories',  fetchStories],
    ['replies',  fetchReplies],
    ['products', fetchProducts],
    ['settings', fetchSettings],
    ['reviews',  fetchReviews],
  ];

  const failed = [];
  await Promise.all(jobs.map(async ([name, fn]) => {
    try { await fn(); } catch (e) { failed.push(name); }
  }));

  // Only complain if something people actually need didn't load.
  const essential = failed.filter(n => n === 'stories' || n === 'products');
  if (essential.length){
    transient.loadError = "Couldn't reach the server just now \u2014 check your connection and reload.";
  } else {
    transient.loadError = '';
  }

  openDeepLink();
  render();
}

async function onAdminLogin(){
  nav.adminUnlocked = true;
  try {
    await Promise.all([
      fetchStories().catch(()=>{}), fetchReplies().catch(()=>{}), fetchLeads().catch(()=>{}),
      fetchReviews().catch(()=>{}), fetchHelp().catch(()=>{}), fetchGiftCards().catch(()=>{}), fetchDiscounts().catch(()=>{}),
    ]);
  } catch (e) {
    transient.loadError = "Logged in, but couldn't load admin data — try reloading.";
  }
  render();
}

// ---- Admin login/recovery handling ----
// Netlify's login widget auto-detects recovery/invite links in the URL and
// shows its own "set a new password" box — we don't need to (and shouldn't)
// force it open ourselves; doing that risked showing a second, wrong box
// on top of it.
//
// The real bug: verifying a recovery link can itself create a session
// before someone has actually finished setting a password, and refreshing
// the same link re-processes the same token every time. So instead of
// trusting 'init' or 'login' the instant they fire, we wait until the
// widget's box actually closes, THEN decide whether there's a genuine,
// completed login — and we strip the token out of the address bar so a
// refresh can't replay this.
const hasAuthToken = /recovery_token=|invite_token=|confirmation_token=/.test(window.location.hash);
let awaitingAuthFlow = hasAuthToken;

function clearAuthTokenFromUrl(){
  if (window.history && window.history.replaceState){
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
  }
}

async function doAdminLogin(){
  const input = document.getElementById('adminPwInput');
  const errEl = document.getElementById('adminPwError');
  const value = input.value;
  if (!value){ errEl.textContent = 'Enter the password.'; return; }
  errEl.textContent = 'Checking…';
  try {
    const res = await fetch(API + '/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': value },
    });
    if (res.ok){
      adminPassword = value;
      await onAdminLogin();
    } else {
      const data = await res.json().catch(() => ({}));
      errEl.textContent = data.error || 'That password is not correct.';
    }
  } catch (e) {
    errEl.textContent = "Couldn't reach the server — check your connection.";
  }
}

boot();
