<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bling Happiness</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3d1e3a">
<meta name="apple-mobile-web-app-title" content="Bling Happiness">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Site UI: Cormorant Garamond (delicate, high-contrast, beautiful italic)
     with Jost (light geometric sans) for buttons and labels. Fraunces +
     Instrument Sans are still loaded because the story-card and gift-card
     canvas generators draw with them — changing those would change every card
     she posts, so they are left alone deliberately. */
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,700;9..144,1,400&family=Instrument+Sans:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
  .bh-root{ --ink:#241521; --plum:#3d1e3a; --plum2:#6b3560; --plum3:#8a4877; --blush:#f0c4cf; --blushp:#fbf1ef; --gold:#c9a15a; --goldl:#e4c989; --line:#ead9dc; --grey:#6b5a67; --ok:#5c7a5e; --risk:#a13d4c;
    /* Swap the whole site's typography by changing these two lines. */
    --f-display:'Cormorant Garamond', Georgia, serif;
    --f-ui:'Jost', -apple-system, sans-serif;
    /* Story text people actually sit and read. Jost is a geometric display
       sans and gets tiring over paragraphs; Inter is built for screen reading
       and has a taller x-height. */
    --f-read:'Inter', -apple-system, 'Helvetica Neue', sans-serif;
    font-family:var(--f-ui); color:var(--ink); background:var(--blushp); min-height:100vh;
    font-weight:300; -webkit-font-smoothing:antialiased; }
  /* Family and weight only. This rule must NOT set font-size: it outranks the
     individual heading classes, so a size here silently flattens every heading
     on the site to one size. Cormorant's small x-height is compensated for on
     the individual headings below instead. */
  .bh-root .bh-serif, .bh-root h1, .bh-root h2, .bh-root h3{
    font-family:var(--f-display); font-weight:600; letter-spacing:.005em; }
  .bh-root .bh-rail-head h3, .bh-root .bh-serif:not([style*="font-size"]):not([class*="title"]){
    font-size:1.42rem; }
  .bh-root button, .bh-root input, .bh-root select, .bh-root textarea{ font-family:var(--f-ui); }
  /* Jost is geometric and reads better with a little air in small caps labels. */
  .bh-root .bh-label, .bh-root .bh-kicker{ letter-spacing:.09em; }
  .bh-root *{ box-sizing:border-box; }
  .bh-serif{ font-family:var(--f-display); }
/* hero, rail and badges */
  .bh-hero2{ position:relative; min-height:420px; display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; color:#fff; }
  .bh-hero2-bg{ position:absolute; inset:0; background:linear-gradient(160deg,#2b1524 0%,#5e2a4c 55%,#8a4877 100%); }
  .bh-hero2-mark{ position:absolute; right:-20px; bottom:-16px; height:230px; opacity:.13; z-index:1; }
  .bh-hero2-inner{ position:relative; z-index:2; padding:52px 26px; max-width:520px; }
  .bh-kicker{ font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; color:var(--goldl); margin-bottom:14px; }
  .bh-hero2-title{ font-weight:500; font-size:clamp(2.2rem,9vw,3.1rem); margin:0; letter-spacing:.02em; }
  .bh-hero2-sub{ font-size:.9rem; color:#efe2ea; margin:14px auto 0; max-width:32ch; line-height:1.55; }
  .bh-hero2-ctas{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .bh-hero2-cta{ background:#fffdf9; color:var(--ink); border:none; font-family:var(--f-ui); font-weight:600; font-size:.86rem; padding:13px 26px; cursor:pointer; letter-spacing:.02em; }
  .bh-hero2-cta.ghost{ background:transparent; border:1.4px solid rgba(255,255,255,.7); color:#fff; }

  .bh-rail-wrap{ padding:26px 0 6px; }
  .bh-rail-head{ display:flex; align-items:baseline; justify-content:space-between; padding:0 20px 12px; max-width:900px; margin:0 auto; }
  .bh-rail-head h3{ font-weight:500; color:var(--plum); font-size:1.12rem; margin:0; }
  .bh-rail{ display:flex; gap:11px; overflow-x:auto; padding:0 20px 8px; scrollbar-width:none; max-width:900px; margin:0 auto; }
  .bh-rail::-webkit-scrollbar{ display:none; }
  .bh-railcard{ flex:0 0 176px; height:245px; position:relative; overflow:hidden; cursor:pointer; border-radius:3px; }
  .bh-railcard img{ width:100%; height:100%; object-fit:cover; display:block; }
  .bh-railcard-fill{ width:100%; height:100%; background:linear-gradient(150deg,#8f5f72,#d9aab4); }
  .bh-railcard-fill.story{ background:linear-gradient(150deg,#341b30,#7d4c63); }
  .bh-railcard-fill.mf1{ background:linear-gradient(150deg,#8f5f72,#d9aab4); }
  .bh-railcard-fill.mf2{ background:linear-gradient(150deg,#4a1f33,#8a4877); }
  .bh-railcard-fill.mf3{ background:linear-gradient(150deg,#b08b6a,#e7cdb2); }
  .bh-railcard-fill.mf4{ background:linear-gradient(150deg,#5b2740,#a4607c); }
  .bh-railcard-fill.mf5{ background:linear-gradient(150deg,#6b3560,#c79aa8); }
  .bh-railcard-fill.mf6{ background:linear-gradient(150deg,#3d1e3a,#7d4c63); }
  .bh-railcard-fill.sf1{ background:linear-gradient(150deg,#341b30,#6b3560); }
  .bh-railcard-fill.sf2{ background:linear-gradient(150deg,#4a2545,#8a4877); }
  .bh-railcard-fill.sf3{ background:linear-gradient(150deg,#2b1524,#5e2a4c); }

  .bh-catstrip{ padding:18px 0 4px; }
  .bh-catstrip-inner{ display:flex; gap:8px; overflow-x:auto; padding:0 20px 6px; scrollbar-width:none; max-width:900px; margin:0 auto; }
  .bh-catstrip-inner::-webkit-scrollbar{ display:none; }
  .bh-catchip{ flex:0 0 auto; background:#fff; border:1px solid var(--line); border-radius:20px; padding:9px 15px;
    font-family:var(--f-ui); font-size:.82rem; font-weight:600; color:var(--plum); cursor:pointer; white-space:nowrap; }
  .bh-catchip b{ color:var(--gold); margin-left:4px; }
  .bh-railveil{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(20,8,16,.8) 6%, rgba(20,8,16,.04) 62%); }
  .bh-raillbl{ position:absolute; left:0; right:0; bottom:0; padding:13px; color:#fff; z-index:2; }
  .bh-raillbl .t{ font-family:var(--f-display); font-size:.94rem; font-weight:500; line-height:1.2; }
  .bh-raillbl .s{ font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; opacity:.85; margin-top:5px; }
  .bh-railpill{ position:absolute; top:9px; left:9px; z-index:3; font-size:.57rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; padding:4px 8px; border-radius:20px; }
  .bh-railpill.shop{ background:var(--goldl); color:var(--ink); }
  .bh-railpill.order{ background:#fdf3e3; color:#a6752f; }
  .bh-railpill.story{ background:rgba(255,255,255,.92); color:var(--plum); }

  .bh-badges{ display:grid; grid-template-columns:1fr 1fr; gap:22px 12px; padding:30px 22px 36px; background:#fffdf9; margin-top:26px; }
  .bh-badge{ text-align:center; }
  .bh-badge svg{ width:29px; height:29px; stroke:var(--plum); fill:none; stroke-width:1.3; margin-bottom:8px; }
  .bh-badge .t{ font-weight:700; font-size:.8rem; color:var(--plum); }
  .bh-badge .s{ font-size:.71rem; color:var(--grey); margin-top:3px; line-height:1.4; }
  @media (min-width:700px){ .bh-badges{ grid-template-columns:repeat(4,1fr); max-width:900px; margin:26px auto 0; } }

/* announcement bar + header */
  .bh-announce{ background:var(--ink); color:var(--goldl); text-align:center; font-family:var(--f-display); font-weight:500; font-size:.78rem; padding:9px 12px; letter-spacing:.02em; }
  .bh-hdr{ background:var(--plum); display:flex; align-items:center; justify-content:space-between; padding:13px 16px; position:sticky; top:0; z-index:40; }
  .bh-burger{ background:none; border:none; display:flex; flex-direction:column; gap:4px; cursor:pointer; padding:6px; }
  .bh-burger i{ display:block; width:21px; height:1.7px; background:#fffdf9; }
  .bh-brand{ background:none; border:none; display:flex; align-items:center; gap:8px; cursor:pointer; color:#fffdf9; font-family:var(--f-display); font-weight:500; font-size:1.02rem; letter-spacing:.02em; }
  .bh-brand-mark{ height:24px; width:auto; opacity:.95; }
  .bh-brand .dot{ color:var(--gold); }
  .bh-cartbtn{ background:none; border:none; cursor:pointer; position:relative; padding:6px; }
  .bh-cartbtn svg{ width:20px; height:20px; stroke:#fffdf9; fill:none; stroke-width:1.6; }
  .bh-cart-dot{ position:absolute; top:0; right:0; background:var(--gold); color:var(--ink); font-size:.6rem; font-weight:800; border-radius:20px; padding:1px 5px; }

/* slide-out menu */
  @media (hover:hover){
    .bh-folder:hover{ box-shadow:0 10px 24px rgba(61,30,58,.1); }
    .bh-shop-card:hover{ box-shadow:0 8px 20px rgba(61,30,58,.12); }
    .bh-railcard:hover{ opacity:.94; }
  }

  .bh-menu{ position:fixed; top:0; left:0; right:0; bottom:0; width:100vw; height:100dvh; height:100vh;
    background:var(--plum); z-index:100; padding:22px 22px 30px; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; box-sizing:border-box; }
  body.bh-menu-open{ overflow:hidden; }
  html, body{ overflow-x:hidden; max-width:100%; }
  .bh-menu-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .bh-menu-x{ background:none; border:none; color:#fffdf9; font-size:1.25rem; cursor:pointer; }
  .bh-menu-brand{ font-family:var(--f-display); color:#fffdf9; font-size:1.02rem; }
  .bh-menu-brand .dot{ color:var(--gold); }
  .bh-menu-list{ list-style:none; margin:0; padding:0; }
  .bh-menu-list li{ display:flex; align-items:center; justify-content:space-between; padding:15px 2px; color:#fffdf9; font-size:1.05rem; border-bottom:1px solid rgba(255,255,255,.09); cursor:pointer; }
  .bh-menu-list li.sub{ padding-left:16px; font-size:.92rem; color:rgba(255,253,249,.72); }
  .bh-menu-list li span{ opacity:.5; transition:transform .18s; display:inline-block; }
  .bh-menu-list li span.open{ transform:rotate(90deg); opacity:.9; }
  .bh-menu-foot{ margin-top:24px; color:rgba(255,255,255,.55); font-size:.82rem; cursor:pointer; }

/* gift card preview */
  .bh-giftpreview{ display:flex; justify-content:center; margin-bottom:20px; }
  .bh-gc{ position:relative; width:100%; max-width:340px; aspect-ratio:1.586; border-radius:12px; overflow:hidden;
    background:linear-gradient(135deg,var(--plum),var(--plum3)); box-shadow:0 10px 26px rgba(61,30,58,.28); }
  .bh-gc::after{ content:''; position:absolute; inset:9px; border:1px solid rgba(228,201,137,.4); border-radius:7px; }
  .bh-gc-label{ position:absolute; top:22px; left:24px; color:var(--goldl); font-size:.6rem; font-weight:800; letter-spacing:.24em; text-transform:uppercase; z-index:2; }
  .bh-gc-brand{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:500; color:#fffdf9; font-size:1.9rem; z-index:2; }
  .bh-gc-amt{ position:absolute; left:24px; bottom:34px; font-family:var(--f-display); font-weight:600; color:var(--goldl); font-size:1.5rem; z-index:2; }
  .bh-gc-for{ position:absolute; left:24px; bottom:18px; color:rgba(255,253,249,.8); font-size:.72rem; z-index:2; }
  .bh-gc-mark{ position:absolute; right:16px; bottom:14px; height:74px; opacity:.16; z-index:1; }

/* reviews */
  .bh-stars{ color:var(--gold); letter-spacing:.08em; }
  .bh-review{ border-top:1px solid var(--line); padding:13px 0; }
  .bh-review .who{ font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--gold); }
  .bh-review .txt{ font-size:.88rem; margin-top:5px; }
  .bh-rate-pick{ display:flex; gap:5px; margin-bottom:12px; }
  .bh-rate-pick button{ background:none; border:none; font-size:1.5rem; color:var(--line); cursor:pointer; padding:0; line-height:1; }
  .bh-rate-pick button.on{ color:var(--gold); }

  .bh-nav{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; flex-wrap:wrap; gap:10px; }
  .bh-logo{ font-family:var(--f-display); font-weight:600; font-size:1.15rem; color:var(--plum); cursor:pointer; background:none; border:none; display:flex; align-items:center; gap:9px; padding:0; }
  .bh-logo-mark{ height:30px; width:auto; display:block; }
  .bh-logo .dot{ color:var(--gold); }
  .bh-navlinks{ display:flex; gap:10px; flex-wrap:wrap; }
  .bh-navlinks button{ background:none; border:none; font-weight:600; font-size:.85rem; color:var(--plum); opacity:.75; cursor:pointer; padding:8px 12px; border-radius:8px; }
  .bh-navlinks button:hover{ opacity:1; background:#fff; }
  .bh-navlinks button.on{ opacity:1; background:#fff; }
  .bh-hero{ display:none; }
  .bh-hero > *{ position:relative; z-index:2; }
  .bh-hero-mark{ position:absolute; right:14px; bottom:8px; height:104px; width:auto; opacity:.16; z-index:1; pointer-events:none; }
  @media (max-width:600px){
    .bh-hero-mark{ height:78px; right:10px; bottom:8px; opacity:.14; }
  }
  .bh-hero h1{ font-size:clamp(1.5rem,4vw,2.1rem); font-weight:500; max-width:min(20ch, calc(100% - 86px)); }
  .bh-hero p{ color:#e9d9e4; font-size:.92rem; max-width:min(48ch, calc(100% - 86px)); margin-top:8px; }
  .bh-wrap{ max-width:900px; margin:0 auto; padding:20px 24px 70px; }
  .bh-folder-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px; margin-top:4px; }
  .bh-folder{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .bh-folder{ transition:box-shadow .15s; }
  .bh-folder .count{ font-family:var(--f-display); font-size:1.7rem; color:var(--gold); font-weight:600; }
  .bh-folder .name{ font-weight:700; color:var(--plum); font-size:.92rem; margin-top:2px; }
  .bh-tile{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px; cursor:pointer; }
  .bh-tile:hover{ border-color:var(--gold); }
  .bh-tile p{ font-family:var(--f-read); font-size:.93rem; line-height:1.55; margin:0 0 8px; }
  .bh-tile .sub{ font-size:.75rem; color:var(--grey); }
  .bh-storyhero{ background:linear-gradient(155deg,var(--plum),var(--plum2)); color:#fff; border-radius:18px; padding:28px; }
  .bh-storyhero .mark{ font-family:var(--f-display); font-size:2.2rem; color:var(--gold); line-height:1; }
  .bh-storyhero p{ font-family:var(--f-read); font-size:1.06rem; line-height:1.65;
    letter-spacing:.002em; margin:6px 0 16px; }
  .bh-storyhero .tag{ font-size:.72rem; letter-spacing:.06em; color:var(--goldl); font-weight:700; }
  .bh-btn{ background:linear-gradient(135deg,var(--goldl),var(--gold)); color:var(--ink); font-weight:700; padding:11px 20px; border-radius:9px; font-size:.88rem; border:none; cursor:pointer; }
  .bh-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .bh-btn-outline{ background:#fff; border:1.5px solid var(--plum); color:var(--plum); font-weight:700; padding:10px 18px; border-radius:9px; font-size:.85rem; cursor:pointer; }
  .bh-btn-ghost{ background:none; border:none; color:var(--plum); font-weight:600; font-size:.85rem; cursor:pointer; display:flex; align-items:center; gap:6px; padding:0; }
  .bh-input, .bh-textarea, .bh-select{ width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:9px; font-family:var(--f-ui); font-size:.88rem; background:#fff; }
  .bh-textarea{ min-height:110px; resize:vertical; }
  .bh-label{ display:block; font-weight:700; font-size:.82rem; color:var(--plum); margin-bottom:6px; }
  .bh-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; }
  .bh-reply{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin-bottom:8px; font-family:var(--f-read); font-size:.9rem; line-height:1.6; }
  .bh-reply .rt{ display:block; font-size:.62rem; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin-bottom:4px; }
  .bh-qrow{ display:flex; align-items:flex-start; gap:12px; padding:13px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; flex-wrap:wrap; }
  .bh-qrow .txt{ flex:1; font-family:var(--f-read); font-size:.88rem; line-height:1.6; min-width:180px; }
  .bh-qrow .catpill{ font-size:.65rem; font-weight:700; text-transform:uppercase; background:var(--blushp); color:var(--plum); padding:3px 8px; border-radius:20px; margin-right:6px; }
  .bh-qrow .actions{ display:flex; gap:6px; }
  .bh-qrow .actions button{ padding:6px 12px; font-size:.72rem; font-weight:700; border-radius:7px; border:none; cursor:pointer; }
  .bh-approve{ background:var(--ok); color:#fff; }
  .bh-reject{ background:#fff; color:var(--risk); border:1px solid var(--risk) !important; }
  /* Nine tabs do not fit across a phone. Without wrapping, the last ones
     (Help, Settings) sit off the right edge with no way to reach them. */
  .bh-tabs{ display:flex; flex-wrap:wrap; gap:6px; background:var(--blushp); padding:5px;
    border-radius:10px; width:100%; box-sizing:border-box; margin-bottom:18px; }
  .bh-tab{ padding:9px 14px; font-size:.78rem; font-weight:700; border-radius:8px; border:none; background:none; cursor:pointer; color:var(--grey); white-space:nowrap; }
  .bh-tab.on{ background:#fff; color:var(--plum); }
  /* ---- Dashboard ---------------------------------------------------------
     Three deliberately different treatments so hierarchy comes from structure:
     one loud focus panel, a quiet hairline action list, then paired stat
     columns. Not twelve identical cards. */
  .bh-dash-greet{ display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; margin:0 0 14px; flex-wrap:wrap; }
  .bh-dash-greet h2{ font-family:var(--f-display); font-weight:600; font-size:1.5rem;
    color:var(--plum); margin:0; }
  .bh-dash-greet .when{ font-size:.78rem; color:var(--grey); }

  .bh-focus{ background:linear-gradient(155deg,var(--plum),var(--plum2));
    color:#fffdf9; border-radius:16px; padding:24px 22px; margin-bottom:20px; }
  .bh-focus .n{ font-family:var(--f-display); font-weight:600; font-size:4.2rem;
    line-height:.9; color:var(--goldl); display:block; }
  .bh-focus .what{ font-size:1rem; margin:8px 0 2px; }
  .bh-focus .sub{ font-size:.82rem; color:#e6d4e0; margin:0 0 18px; }
  .bh-focus .bh-btn{ background:#fffdf9; color:var(--plum); }
  .bh-focus.calm{ background:linear-gradient(155deg,#33532f,#5c7a5e); }
  .bh-focus.calm .n{ color:#e8f2e2; }

  .bh-spark{ display:flex; align-items:flex-end; gap:5px; height:44px; margin-top:20px; }
  .bh-spark div{ flex:1; background:rgba(255,253,249,.28); border-radius:2px 2px 0 0; min-height:2px; }
  .bh-spark div.today{ background:var(--goldl); }
  .bh-spark-lbl{ display:flex; justify-content:space-between; font-size:.68rem;
    color:#e6d4e0; margin-top:6px; }

  .bh-todo{ background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:4px 16px; margin-bottom:20px; }
  .bh-todo-row{ display:flex; align-items:center; gap:12px; width:100%; background:none;
    border:none; border-bottom:1px solid var(--line); padding:15px 0; cursor:pointer;
    font-family:var(--f-ui); font-size:.92rem; color:var(--ink); text-align:left; }
  .bh-todo-row:last-child{ border-bottom:none; }
  .bh-todo-row .cnt{ font-family:var(--f-display); font-weight:600; font-size:1.35rem;
    color:var(--plum); min-width:34px; }
  .bh-todo-row .cnt.warn{ color:var(--risk); }
  .bh-todo-row .go{ margin-left:auto; color:var(--grey); font-size:1.1rem; }
  .bh-todo-clear{ padding:22px 0; text-align:center; color:var(--grey); font-size:.88rem; }

  .bh-statcols{ display:grid; grid-template-columns:1fr; gap:18px; margin-bottom:20px; }
  @media (min-width:620px){ .bh-statcols{ grid-template-columns:1fr 1fr; } }
  .bh-statgrp h3{ font-family:var(--f-display); font-weight:600; font-size:1.15rem;
    color:var(--plum); margin:0 0 4px; }
  .bh-statgrp .lede{ font-size:.75rem; color:var(--grey); margin:0 0 10px; }
  .bh-statrow{ display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:11px 0; border-bottom:1px solid var(--line); font-size:.86rem; color:var(--grey); }
  .bh-statrow:last-child{ border-bottom:none; }
  .bh-statrow b{ font-family:var(--f-display); font-size:1.15rem; font-weight:600; color:var(--ink); }
  .bh-statrow b.muted{ color:var(--grey); font-weight:400; }
  .bh-statrow b.good{ color:var(--ok); }
  .bh-statrow b.warn{ color:var(--risk); }

  /* Room for the on-screen keyboard. In-app browsers (Instagram, Facebook)
     often do not shrink the page when the keyboard opens, so a box near the
     bottom ends up underneath it with nothing left to scroll. --kb-inset is
     set from the visual viewport at runtime; the 0px default means this costs
     nothing when no keyboard is showing. */
  /* Two layers, because in-app browsers cannot be relied on to report the
     keyboard. kb-open adds a big slab of empty space unconditionally while a
     field is focused, which guarantees there is somewhere to scroll to even if

  .bh-root{ padding-bottom:var(--kb-inset, 0px); transition:padding-bottom .18s ease-out; }

<script>

let settings = Object.assign({}, DEFAULT_SETTINGS);

function setting(key){
  const v = settings[key];

}
function shippingCost(){

}

// Fills {name}, {items}, {total} etc. into a message template.
function fillTemplate(tpl, vars){
  return String(tpl).replace(/\{(\w+)\}/g, (m, key) =>
    vars[key] !== undefined && vars[key] !== null ? String(vars[key]) : ''
  );
}

// Shop departments are editable in Settings. This is only the starting list.
const DEFAULT_SHOP_CATEGORIES = [

// Swatch colours shown when adding a product and when filtering.
const COLOURS = [
  { name: 'Black',      hex: '#1c1c1c' },
  { name: 'White',      hex: '#ffffff' },
  { name: 'Ivory',      hex: '#f6f0e2' },

  { name: 'Green',      hex: '#3f6b46' },

// Card colour themes — all drawn from the brand palette.
const CARD_THEMES = {
  plum:      { label: 'Plum (default)', from: '#3d1e3a', to: '#8a4877', accent: '#e4c989', text: '#fdf6f9' },
  midnight:  { label: 'Midnight',       from: '#1a1226', to: '#3d2a55', accent: '#d9b877', text: '#f4eef8' },
  burgundy:  { label: 'Burgundy',       from: '#3a0f1c', to: '#7c2338', accent: '#e8c48a', text: '#fdf2f2' },
  blush:     { label: 'Blush',          from: '#7a4257', to: '#d99bab', accent: '#5c2438', text: '#fffaf9' },
  champagne: { label: 'Champagne',      from: '#5c4a2e', to: '#b99a5e', accent: '#3a2c16', text: '#fffdf6' },
  ink:       { label: 'Ink',            from: '#171717', to: '#3d3d3d', accent: '#c9a15a', text: '#faf7f2' },
};

function cardTheme(){
  // A choice made on the Post tab wins for that picture; otherwise the
  // default from Settings is used.
  const key = transient.cardTheme || setting('cardTheme');
  return CARD_THEMES[key] || CARD_THEMES.plum;
}

const VOUCHER_STEP = 100;
const VOUCHER_MIN = 300;
const VOUCHER_MAX = 20000;

function voucherAmounts(){
  const out = [];
  for (let v = VOUCHER_MIN; v <= VOUCHER_MAX; v += VOUCHER_STEP) out.push(v);
  return out;
}

function reviewsFor(productId){
  return reviews.filter(r => r.product_id === productId && r.status === 'approved');
}
function averageRating(productId){
  const list = reviewsFor(productId);
  if (!list.length) return 0;
  return list.reduce((n, r) => n + (parseInt(r.rating,10) || 0), 0) / list.length;
}
function stars(n, size){
  const full = Math.round(n);
  return `<span class="bh-stars" style="font-size:${size || '.85rem'}">${'\u2605'.repeat(full)}${'\u2606'.repeat(5-full)}</span>`;
}

function productColours(p){
  try {
    const raw = typeof p.colours === 'string' ? JSON.parse(p.colours || '[]') : (p.colours || []);
    return Array.isArray(raw) ? raw : [];
  } catch (e) { return []; }
}
function colourHex(name){
  const c = COLOURS.find(x => x.name === name);
  return c ? c.hex : '#cccccc';
}
// Shrinks a photo before it's stored. Phone photos are several megabytes;
// a shop doesn't need that, and sending full-size photos is what makes a
// catalogue slow to load.
function resizeImage(file, maxSize, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('That file is not a picture'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize){
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else if (height > maxSize){
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Pictures come from their own address so the browser caches them.
const MAX_PICTURES = 4;

// How many pictures a product has. Products saved before multi-picture
// support have no image_count, so they count as one.
function pictureCount(p){
  if (!p || !p.has_image) return 0;
  const n = parseInt(p.image_count, 10);
  return isNaN(n) || n < 1 ? 1 : Math.min(n, MAX_PICTURES);
}

// The dots follow the scroll position; no state is stored, so the gallery
// cannot fall out of step with what is on screen.
function onGalleryScroll(track, n){
  const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  const dots = document.querySelectorAll('.bh-gal-dots button');
  dots.forEach((d, k) => d.className = (k === Math.min(i, n - 1)) ? 'on' : '');
}
function goGallery(i){
  const track = document.getElementById('galTrack');
  if (track) track.scrollTo({ left: track.clientWidth * i, behavior: 'smooth' });
}

function productImageUrl(p, size, index){
  if (!p || !p.has_image) return '';
  // Pictures are cached by the browser for a year. When a product's photo is
  // replaced the id stays the same, so the version is what tells the browser
  // it is looking at a different file.
  const v = p.image_version ? `&v=${encodeURIComponent(p.image_version)}` : '';
  const i = index ? `&i=${index}` : '';
  return `${API}/image?id=${encodeURIComponent(p.id)}&size=${size || 'thumb'}${i}${v}`;
}

function isVoucher(p){ return p && p.product_type === 'voucher'; }

const SIZE_PRESETS = {
  clothing: { label: 'Clothing (XS–XXL)', options: ['XS','S','M','L','XL','XXL'] },
  bra: { label: 'Bra sizes', options: (function(){
      const bands = [30,32,34,36,38,40,42,44];
      const cups = ['A','B','C','D','DD','E','F','G'];
      const out = [];
      bands.forEach(b => cups.forEach(cp => out.push(b + cp)));
      return out;
    })() },
  freesize: { label: 'Free size (one size)', options: ['Free size'] },
};

// Story categories are editable in Settings. This is only the starting list.
const DEFAULT_CATEGORIES = ['Relationships', 'Intimacy', 'Health', 'Beauty', 'Faith', "Men's Health"];

function categories(){
  try {
    const raw = settings.categories;
    const list = raw ? JSON.parse(raw) : null;
    if (Array.isArray(list) && list.length) return list;
  } catch (e) {}
  return DEFAULT_CATEGORIES;
}

function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words){
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

// The card body is set in Inter: a screen typeface with a tall x-height and
// even strokes, which survives light-on-dark rendering and Instagram's
// re-compression far better than a high-contrast serif. Fraunces stays for the
// brand furniture — the quote mark, the tag, the logo — so the card still looks
// like Bling Happiness.
const CARD_BODY_FONT = '"Inter", "Helvetica Neue", Arial, sans-serif';
const CARD_BRAND_FONT = 'Fraunces, Georgia, serif';

// Body text is never drawn smaller than this on a 1080px-wide card. A Story is
// shown at roughly 400px on a phone, so 42px here lands at about 15px on screen;
// the old floor of 26px landed near 10px, which is below the level anyone should
// be asked to read.
const CARD_MIN_BODY = 42;
const CARD_LEAD = 1.45;   // was 1.32 — too tight for long text

async function loadCanvasFonts(){
  try {
    await Promise.all([
      document.fonts.load('700 100px Fraunces'),
      document.fonts.load('italic 400 60px Fraunces'),
      document.fonts.load('700 30px "Instrument Sans"'),
      document.fonts.load('500 60px "Inter"'),
      document.fonts.load('600 60px "Inter"'),
    ]);
  } catch (e) { /* falls back to system fonts if this fails */ }
}

// True once the card body font is genuinely available. Canvas silently falls
// back to a system font, so a card drawn on a slow connection can come out in
// the wrong face with nothing to show for it.
function cardFontReady(){
  try { return document.fonts.check('500 60px "Inter"'); } catch (e) { return true; }
}

// Load the logo mark once, reuse for every card.
let _markImg = null;
function loadMark(){
  if (_markImg) return Promise.resolve(_markImg);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { _markImg = img; resolve(img); };
    img.onerror = () => resolve(null); // card still renders without it
    img.src = '/mark.png';
  });
}

// Subtle logo watermark, bottom-right.
async function drawWatermark(ctx, w, h){
  const img = await loadMark();
  if (!img) return;
  const targetH = Math.round(h * 0.075);
  const targetW = Math.round(img.width * (targetH / img.height));
  const margin = 70;
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.drawImage(img, w - targetW - margin, h - targetH - margin, targetW, targetH);
  ctx.restore();
}

async function drawStoryCard(canvas, rawStoryText, tagText){
  // Masked here, at the point of drawing, so every caller gets it.
  const storyText = maskText(rawStoryText, 'cards');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const T = cardTheme();
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, T.from);
  grad.addColorStop(1, T.to);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 90;
  const contentWidth = w - marginX * 2;
  ctx.textBaseline = 'alphabetic';

  const quoteY = 480;
  const topLimit = quoteY + 60;    // below the big quote mark
  const bottomLimit = h - 230;     // above the tag and logo
  const available = bottomLimit - topLimit;

  // Shrink the text until it fits between the quote mark and the footer,
  // so a long story never runs off the card.
  function measure(size){
    ctx.font = `500 ${size}px ${CARD_BODY_FONT}`;
    const lines = wrapCanvasText(ctx, storyText, contentWidth);
    return { lines, lead: size * CARD_LEAD, total: lines.length * (size * CARD_LEAD) };
  }

  let size = 62;
  let plan = measure(size);
  while (plan.total > available && size > CARD_MIN_BODY){
    size -= 2;
    plan = measure(size);
  }

  ctx.fillStyle = T.accent;
  ctx.font = `700 200px ${CARD_BRAND_FONT}`;
  ctx.fillText('\u201C', marginX - 10, quoteY);

  ctx.fillStyle = T.text;
  ctx.font = `500 ${size}px ${CARD_BODY_FONT}`;

  // Sit the block in the middle of the space available, but never above it.
  let startY = topLimit + (available - plan.total) / 2 + plan.lead * 0.8;
  if (startY < topLimit + plan.lead) startY = topLimit + plan.lead;

  plan.lines.forEach((line, i) => ctx.fillText(line, marginX, startY + i * plan.lead));

  const tagY = h - 140;
  ctx.strokeStyle = T.accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, tagY);
  ctx.lineTo(marginX + 34, tagY);
  ctx.stroke();

  ctx.fillStyle = T.accent;
  ctx.font = "700 26px 'Instrument Sans', sans-serif";
  const tag = (tagText || setting('storyCardTag') || '').toUpperCase().split('').join(' ');
  ctx.fillText(tag, marginX + 48, tagY + 9);

  await drawWatermark(ctx, w, h);
}

async function drawCompileCard(canvas, rawReplyTexts, tagText, rawStoryText, storyPseudonym){
  const replyTexts = (rawReplyTexts || []).map(t => maskText(t, 'cards'));
  const storyText = maskText(rawStoryText, 'cards');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const T = cardTheme();
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, T.from);
  grad.addColorStop(1, T.to);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 80;
  const contentWidth = w - marginX * 2;
  ctx.textBaseline = 'alphabetic';

  const headingY = 210;
  const topOfBody = 430;
  const bottomLimit = h - 190;   // leave room for the tag and the logo
  const available = bottomLimit - topOfBody;

  // Work out how much room everything needs at a given size, then shrink
  // until it fits. This is what stops a long story or lots of replies
  // running off the bottom of the card.
  function layout(scale){
    const storySize = 46 * scale;
    const replySize = 42 * scale;
    const storyLead = storySize * CARD_LEAD;
    const replyLead = replySize * CARD_LEAD;
    const gapAfterStory = 54 * scale;
    const gapBetween = 40 * scale;

    const blocks = [];
    let total = 0;

    if (storyText){
      ctx.font = `500 ${storySize}px ${CARD_BODY_FONT}`;
      const lines = wrapCanvasText(ctx, storyText, contentWidth - 30);
      blocks.push({ kind: 'story', lines, size: storySize, lead: storyLead });
      total += lines.length * storyLead + gapAfterStory;
    }

    ctx.font = `400 ${replySize}px ${CARD_BODY_FONT}`;
    replyTexts.forEach((t, i) => {
      const lines = wrapCanvasText(ctx, t, contentWidth - 50);
      blocks.push({ kind: 'reply', lines, size: replySize, lead: replyLead });
      total += lines.length * replyLead + (i < replyTexts.length - 1 ? gapBetween : 0);
    });

    return { blocks, total, gapAfterStory, gapBetween, storySize, replySize };
  }

  let scale = 1;
  let plan = layout(scale);
  // Shrink in small steps, but never past the point where the reply text drops
  // below the readable floor. Beyond that, trim the story instead — the admin
  // offers a shorter version for exactly this reason.
  const minScale = CARD_MIN_BODY / 42;
  while (plan.total > available && scale > minScale){
    scale -= 0.04;
    plan = layout(scale);
  }

  // Heading
  ctx.fillStyle = T.accent;
  ctx.font = `700 64px ${CARD_BRAND_FONT}`;
  ctx.fillText('Here\u2019s what', marginX, headingY);
  ctx.fillText('you said', marginX, headingY + 75);

  ctx.strokeStyle = T.accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, headingY + 120);
  ctx.lineTo(marginX + 60, headingY + 120);
  ctx.stroke();

  let y = topOfBody;

  plan.blocks.forEach((block, idx) => {
    if (block.kind === 'story'){
      // The original story, in gold.
      ctx.fillStyle = T.accent;
      ctx.font = `700 ${Math.round(block.size * 1.15)}px ${CARD_BRAND_FONT}`;
      ctx.fillText('\u201C', marginX, y);
      y += block.lead * 0.55;

      ctx.fillStyle = T.accent;
      ctx.font = `500 ${block.size}px ${CARD_BODY_FONT}`;
      let lastLine = '', lastY = y;
      block.lines.forEach(line => {
        ctx.fillText(line, marginX + 30, y);
        lastLine = line; lastY = y;
        y += block.lead;
      });

      // Credit the original poster, if they chose a pseudonym: smaller gold
      // text sitting just after the last line of the quote. If it will not fit
      // on that line it drops onto its own line rather than running off the edge.
      if (storyPseudonym){
        const credit = '\u2014 ' + storyPseudonym;
        const small = Math.round(block.size * 0.62);
        ctx.font = `500 ${block.size}px ${CARD_BODY_FONT}`;
        const lastW = ctx.measureText(lastLine).width;
        ctx.font = `500 ${small}px ${CARD_BODY_FONT}`;
        ctx.fillStyle = T.accent + 'cc';
        const x = marginX + 30 + lastW + small * 0.7;
        if (x + ctx.measureText(credit).width <= marginX + contentWidth){
          ctx.fillText(credit, x, lastY);
        } else {
          ctx.fillText(credit, marginX + 30, y);
          y += block.lead * 0.75;
        }
      }
      y += plan.gapAfterStory;
    } else {
      // Replies, in the lighter cream.
      ctx.fillStyle = T.accent + 'cc';
      ctx.font = `700 ${Math.round(block.size * 1.05)}px ${CARD_BRAND_FONT}`;
      ctx.fillText('\u2014', marginX, y);

      ctx.fillStyle = T.text;
      ctx.font = `400 ${block.size}px ${CARD_BODY_FONT}`;
      block.lines.forEach(line => { ctx.fillText(line, marginX + 50, y); y += block.lead; });
      if (idx < plan.blocks.length - 1) y += plan.gapBetween;
    }
  });

  ctx.fillStyle = T.accent;
  ctx.font = "700 24px 'Instrument Sans', sans-serif";
  const rtag = (tagText || setting('storyCardTag') || '').toUpperCase().split('').join(' ');
  ctx.fillText(rtag, marginX, h - 90);

  await drawWatermark(ctx, w, h);
}

function downloadCanvas(canvas, filename){
  return new Promise((resolve) => {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      resolve();
    }, 'image/jpeg', 0.92);
  });
}

function basketOf(order){
  let basket = [];
  try {
    const parsed = typeof order.items === 'string' ? JSON.parse(order.items || 'null') : order.items;
    if (Array.isArray(parsed)) basket = parsed;
  } catch (e) {}
  if (!basket.length){
    basket = [{ qty: 1, name: order.item, size: order.size || '', price: order.price }];
  }
  return basket;
}

function orderTotal(order){
  return order.total || basketOf(order)
    .reduce((n, i) => n + (parseFloat(i.price) || 0) * (i.qty || 1), 0).toFixed(0);
}

// Shared renderer for all three document types.
// kind: 'order' | 'receipt' | 'delivery'
async function drawDocCard(canvas, order, kind){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const T = cardTheme();
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, T.from);
  grad.addColorStop(1, T.to);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 80;
  const contentWidth = w - marginX * 2;
  ctx.textBaseline = 'alphabetic';

  const titles = { order: 'Order confirmed', receipt: 'Receipt', delivery: 'Delivery note' };
  ctx.fillStyle = T.accent;
  ctx.font = "700 58px Fraunces, Georgia, serif";
  ctx.fillText(titles[kind] || 'Order', marginX, 220);

  ctx.strokeStyle = T.accent;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(marginX, 260); ctx.lineTo(marginX + 60, 260); ctx.stroke();

  // date
  ctx.fillStyle = T.text + 'a6';
  ctx.font = "400 26px 'Instrument Sans', sans-serif";
  const when = order.created_at ? new Date(order.created_at) : new Date();
  ctx.fillText(when.toLocaleDateString('en-ZA', { day:'numeric', month:'long', year:'numeric' }), marginX, 300);

  let y = 390;
  const basket = basketOf(order);

  // Shrink the item list if there are a lot of items, so a big order
  // still fits on one card.
  const itemRoom = (h - 420) - 460;   // space before the totals and footer
  function measureItems(sz){
    ctx.font = `400 ${sz}px ${CARD_BODY_FONT}`;
    let total = 0;
    const rows = basket.map(i => {
      const label = `${i.qty} x ${i.name}${i.size ? ' (' + i.size + ')' : ''}`;
      const lines = wrapCanvasText(ctx, label, contentWidth - 220);
      total += lines.length * (sz * 1.28) + 10;
      return { lines, i };
    });
    return { rows, total, lead: sz * 1.28 };
  }
  let itemSize = 36;
  let items = measureItems(itemSize);
  while (items.total > itemRoom && itemSize > 20){
    itemSize -= 2;
    items = measureItems(itemSize);
  }

  ctx.fillStyle = T.accent;
  ctx.font = "700 26px 'Instrument Sans', sans-serif";
  ctx.fillText('ITEMS', marginX, y);
  y += 50;

  items.rows.forEach(({ lines, i }) => {
    const amount = 'R' + ((parseFloat(i.price) || 0) * (i.qty || 1)).toFixed(0);
    ctx.fillStyle = T.text;
    ctx.font = `400 ${itemSize}px ${CARD_BODY_FONT}`;
    lines.forEach((line, idx) => {
      ctx.fillText(line, marginX, y);
      if (idx === 0 && kind !== 'delivery'){
        ctx.textAlign = 'right';
        ctx.fillText(amount, w - marginX, y);
        ctx.textAlign = 'left';
      }
      y += items.lead;
    });
    y += 10;
  });

  // totals (not shown on a delivery note — that's a packing document)
  if (kind !== 'delivery'){
    y += 6;
    ctx.strokeStyle = T.accent + '73';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(marginX, y); ctx.lineTo(w - marginX, y); ctx.stroke();
    y += 52;
    ctx.fillStyle = T.accent;
    ctx.font = "700 34px 'Instrument Sans', sans-serif";
    ctx.fillText(kind === 'receipt' ? 'PAID' : 'TOTAL', marginX, y);
    ctx.textAlign = 'right';
    ctx.fillText('R' + orderTotal(order), w - marginX, y);
    ctx.textAlign = 'left';
    y += 30;
  }

  const deliveryMethod = order.delivery_method || order.deliveryMethod || 'Collection';
  const rows = [['For', order.buyer], ['Delivery', deliveryMethod]];
  if (kind === 'delivery' && deliveryMethod === 'Shipping' && order.address){
    rows.push(['Address', order.address]);
  }
  if (kind !== 'delivery' && order.phone) rows.push(['Contact', order.phone]);

  rows.filter(r => r[1]).forEach(([label, value]) => {
    y += 34;
    ctx.fillStyle = T.accent;
    ctx.font = "700 26px 'Instrument Sans', sans-serif";
    ctx.fillText(label.toUpperCase(), marginX, y);
    y += 44;
    ctx.fillStyle = T.text;
    ctx.font = `400 40px ${CARD_BODY_FONT}`;
    wrapCanvasText(ctx, String(value), contentWidth).forEach(line => { ctx.fillText(line, marginX, y); y += 48; });
  });

  // footer note per document type
  y += 40;
  ctx.font = "700 24px 'Instrument Sans', sans-serif";
  ctx.fillStyle = T.accent;
  if (kind === 'order'){
    wrapCanvasText(ctx, 'PAYMENT: ' + setting('bankDetails'), contentWidth).forEach(line => { ctx.fillText(line, marginX, y); y += 32; });
  } else if (kind === 'receipt'){
    ctx.fillText('PAYMENT RECEIVED — THANK YOU', marginX, y);
  } else {
    // Wording depends on whether it has actually gone out yet, not just
    // on the delivery method.
    let deliveryNote;
    if (order.status === 'Sent'){
      deliveryNote = deliveryMethod === 'Shipping' ? 'PACKED AND ON ITS WAY' : 'COLLECTED';
    } else {
      deliveryNote = deliveryMethod === 'Shipping' ? 'PACKED AND READY TO SHIP' : 'READY FOR COLLECTION';
    }
    ctx.fillText(deliveryNote, marginX, y);
  }

  ctx.fillStyle = T.accent;
  ctx.font = "700 22px 'Instrument Sans', sans-serif";
  ctx.fillText('B L I N G   H A P P I N E S S', marginX, h - 80);

  await drawWatermark(ctx, w, h);
}

async function drawOrderCard(canvas, order){ return drawDocCard(canvas, order, 'order'); }

// WhatsApp needs a full international number. Customers type local SA
// numbers (082..., 071...), so convert them: drop the leading 0 and put
// 27 in front. Numbers already in international form are left alone.
// Minimal PDF writer — no external library needed.
// Produces a real, valid PDF with selectable text using the fonts that
// every PDF reader has built in (Helvetica), so nothing is embedded and
// nothing is downloaded.
function createPDF(){
  const objects = [];   // each entry is a string body
  const pages = [];
  let current = [];     // content stream operators for the page being built

  const PT = 2.834645669; // mm -> points
  const PAGE_W = 210, PAGE_H = 297; // A4 in mm

  function esc(s){
    return String(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  }
  const mmX = (x) => (x * PT).toFixed(2);
  const mmY = (y) => ((PAGE_H - y) * PT).toFixed(2);

  const api = {
    setColor(r, g, b){
      current.push(`${(r/255).toFixed(3)} ${(g/255).toFixed(3)} ${(b/255).toFixed(3)} rg`);
      return api;
    },
    setStroke(r, g, b){
      current.push(`${(r/255).toFixed(3)} ${(g/255).toFixed(3)} ${(b/255).toFixed(3)} RG`);
      return api;
    },
    text(str, x, y, opts){
      opts = opts || {};
      const size = opts.size || 10;
      const font = opts.bold ? '/F2' : '/F1';
      let tx = x;
      if (opts.align === 'right' || opts.align === 'center'){
        const width = api.textWidth(str, size, opts.bold);
        tx = opts.align === 'right' ? x - width : x - width / 2;
      }
      current.push(`BT ${font} ${size} Tf ${mmX(tx)} ${mmY(y)} Td (${esc(str)}) Tj ET`);
      return api;
    },
    // Approximate width in mm. Helvetica averages ~0.5 em, bold ~0.55.
    textWidth(str, size, bold){
      const factor = bold ? 0.55 : 0.5;
      return (String(str).length * size * factor) / PT;
    },
    // Wrap text to a max width (mm), returns an array of lines.
    wrap(str, maxWidthMm, size, bold){
      const words = String(str).split(/\s+/);
      const lines = [];
      let line = '';
      words.forEach(word => {
        const test = line ? line + ' ' + word : word;
        if (api.textWidth(test, size, bold) > maxWidthMm && line){
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      return lines;
    },
    rect(x, y, w, h, fill){
      current.push(`${mmX(x)} ${mmY(y + h)} ${(w * PT).toFixed(2)} ${(h * PT).toFixed(2)} re ${fill ? 'f' : 'S'}`);
      return api;
    },
    line(x1, y1, x2, y2, width){
      current.push(`${((width || 0.3) * PT).toFixed(2)} w ${mmX(x1)} ${mmY(y1)} m ${mmX(x2)} ${mmY(y2)} l S`);
      return api;
    },
    endPage(){
      pages.push(current.join('\n'));
      current = [];
      return api;
    },
    build(){
      if (current.length) api.endPage();

      const fontObjs = [
        '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
        '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
      ];

      // Object numbering: 1 catalog, 2 pages, then per page (page + content), then fonts
      const pageCount = pages.length;
      const firstPageObj = 3;
      const fontStart = firstPageObj + pageCount * 2;

      const kids = [];
      for (let i = 0; i < pageCount; i++) kids.push(`${firstPageObj + i * 2} 0 R`);

      objects[1] = `<< /Type /Catalog /Pages 2 0 R >>`;
      objects[2] = `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pageCount} >>`;

      pages.forEach((content, i) => {
        const pageObj = firstPageObj + i * 2;
        const contentObj = pageObj + 1;
        objects[pageObj] =
          `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] ` +
          `/Resources << /Font << /F1 ${fontStart} 0 R /F2 ${fontStart + 1} 0 R >> >> ` +
          `/Contents ${contentObj} 0 R >>`;
        objects[contentObj] = `<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
      });

      objects[fontStart] = fontObjs[0];
      objects[fontStart + 1] = fontObjs[1];

      // Assemble
      let out = '%PDF-1.4\n';
      const offsets = [];
      for (let i = 1; i < objects.length; i++){
        if (objects[i] === undefined) continue;
        offsets[i] = out.length;
        out += `${i} 0 obj\n${objects[i]}\nendobj\n`;
      }
      const xrefPos = out.length;
      const maxObj = objects.length;
      out += `xref\n0 ${maxObj}\n0000000000 65535 f \n`;
      for (let i = 1; i < maxObj; i++){
        const off = offsets[i] === undefined ? 0 : offsets[i];
        out += String(off).padStart(10, '0') + ' 00000 n \n';
      }
      out += `trailer\n<< /Size ${maxObj} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
      return out;
    },
    save(filename){
      const pdf = api.build();
      const bytes = new Uint8Array(pdf.length);
      for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },
  };

  api.PAGE_W = PAGE_W;
  api.PAGE_H = PAGE_H;
  return api;
}

// Proper structured PDF for an order, receipt or delivery note.
async function makeOrderPDF(order, kind){
  const doc = createPDF();
  const W = doc.PAGE_W, H = doc.PAGE_H;
  const M = 18;
  const PLUM = hexToRgb(T.from), GOLD = hexToRgb(T.accent), GREY = [107, 90, 103], INK = [30, 20, 28];
  const titles = { order: 'ORDER CONFIRMATION', receipt: 'RECEIPT', delivery: 'DELIVERY NOTE' };

  // Header band
  doc.setColor(...PLUM).rect(0, 0, W, 40, true);
  doc.setColor(255, 255, 255).text('BLING HAPPINESS', M, 18, { size: 18, bold: true });
  doc.setColor(...GOLD).text('EMBRACE YOUR CONFIDENCE', M, 25, { size: 8 });
  doc.setColor(255, 255, 255).text(titles[kind] || 'ORDER', W - M, 18, { size: 11, bold: true, align: 'right' });
  const when = order.created_at ? new Date(order.created_at) : new Date();
  doc.text(when.toLocaleDateString('en-ZA', { day: 'numeric', month: 'long', year: 'numeric' }), W - M, 25, { size: 8, align: 'right' });

  let y = 56;
  const deliveryMethod = order.delivery_method || order.deliveryMethod || 'Collection';

  // Customer / delivery blocks
  doc.setColor(...GREY);
  doc.text('CUSTOMER', M, y, { size: 7.5, bold: true });
  doc.text(deliveryMethod === 'Shipping' ? 'SHIPPING TO' : 'COLLECTION FROM', W / 2, y, { size: 7.5, bold: true });
  y += 6;
  doc.setColor(...INK);
  doc.text(String(order.buyer || ''), M, y, { size: 10 });
  if (order.phone) doc.text(String(order.phone), M, y + 5, { size: 10 });

  const rightLines = deliveryMethod === 'Shipping'
    ? doc.wrap(String(order.address || '(address to confirm)'), W / 2 - M - 4, 10, false)
    : ['Ormonde Close, Upavon Road', 'House 33, Ormonde'];
  rightLines.forEach((l, i) => doc.text(l, W / 2, y + i * 5, { size: 10 }));
  y += Math.max(14, rightLines.length * 5 + 8);

  // Items table
  doc.setStroke(...GOLD).line(M, y, W - M, y, 0.5);
  y += 6;
  doc.setColor(...GREY);
  doc.text('ITEM', M, y, { size: 7.5, bold: true });
  doc.text('SIZE', W - M - 60, y, { size: 7.5, bold: true });
  doc.text('QTY', W - M - 32, y, { size: 7.5, bold: true, align: 'right' });
  if (kind !== 'delivery') doc.text('AMOUNT', W - M, y, { size: 7.5, bold: true, align: 'right' });
  y += 3;
  doc.setStroke(215, 205, 210).line(M, y, W - M, y, 0.2);
  y += 7;

  doc.setColor(...INK);
  basketOf(order).forEach(i => {
    const nameLines = doc.wrap(String(i.name || ''), W - M - 95, 10, false);
    nameLines.forEach((l, idx) => doc.text(l, M, y + idx * 5, { size: 10 }));
    doc.text(String(i.size || '-'), W - M - 60, y, { size: 10 });
    doc.text(String(i.qty || 1), W - M - 32, y, { size: 10, align: 'right' });
    if (kind !== 'delivery'){
      doc.text('R' + ((parseFloat(i.price) || 0) * (i.qty || 1)).toFixed(2), W - M, y, { size: 10, align: 'right' });
    }
    y += Math.max(7, nameLines.length * 5 + 2);
  });

  // Totals
  if (kind !== 'delivery'){
    y += 3;
    doc.setStroke(215, 205, 210).line(W / 2, y, W - M, y, 0.2);
    y += 7;
    const ship = parseFloat(order.shipping || 0);
    if (order.subtotal){
      doc.setColor(...GREY).text('Subtotal', W - M - 38, y, { size: 10, align: 'right' });
      doc.setColor(...INK).text('R' + parseFloat(order.subtotal).toFixed(2), W - M, y, { size: 10, align: 'right' });
      y += 6;
      doc.setColor(...GREY).text(ship > 0 ? 'Shipping' : 'Collection', W - M - 38, y, { size: 10, align: 'right' });
      doc.setColor(...INK).text(ship > 0 ? 'R' + ship.toFixed(2) : 'Free', W - M, y, { size: 10, align: 'right' });
      y += 8;
    }
    doc.setColor(...PLUM);
    doc.text(kind === 'receipt' ? 'PAID' : 'TOTAL', W - M - 38, y, { size: 12, bold: true, align: 'right' });
    doc.text('R' + parseFloat(orderTotal(order)).toFixed(2), W - M, y, { size: 12, bold: true, align: 'right' });
    y += 16;
  } else {
    // Delivery notes skip the totals block, so add the spacing here instead
    y += 14;
  }

  // Footer block per document type
  if (kind === 'order'){
    doc.setColor(...PLUM).text('PAYMENT \u2014 EFT', M, y, { size: 9, bold: true }); y += 6;
    doc.setColor(...INK);
    setting('bankDetails').split(' \u00b7 ').forEach(part => { doc.text(part, M, y, { size: 10 }); y += 5; });
    y += 3;
    doc.setColor(...GREY).text("We'll confirm your order as soon as the payment reflects.", M, y, { size: 9 });
  } else if (kind === 'receipt'){
    doc.setColor(...PLUM).text('PAYMENT RECEIVED \u2014 THANK YOU', M, y, { size: 10, bold: true }); y += 7;
    doc.setColor(...GREY).text("We'll let you know as soon as your order is ready.", M, y, { size: 9 });
  } else if (deliveryMethod === 'Collection'){
    doc.setColor(...PLUM).text('COLLECTION DETAILS', M, y, { size: 9, bold: true }); y += 7;
    doc.setColor(...INK);
    // Uses whatever is saved in Settings, line for line.
    String(setting('collectionDetails')).split('\n').forEach(raw => {
      const line = raw.replace(/\*/g, '').trim();
      if (!line){ y += 3; return; }
      const bold = /^(collection times|address)/i.test(line) || /gate/i.test(line);
      doc.wrap(line, W - M * 2, 9.5, bold).forEach(l => {
        doc.text(l, M, y, { size: 9.5, bold: bold });
        y += 5;
      });
    });
  } else {
    doc.setColor(...PLUM).text(order.status === 'Sent' ? 'ON ITS WAY' : 'PACKED AND READY TO SHIP', M, y, { size: 10, bold: true }); y += 7;
    doc.setColor(...GREY).text('You will receive a notification when your order is dispatched.', M, y, { size: 9 });
  }

  // Footer bar
  doc.setStroke(...GOLD).line(M, H - 20, W - M, H - 20, 0.4);
  doc.setColor(...GREY);
  doc.text('Bling Happiness', M, H - 14, { size: 8 });
  doc.text('Thank you for your support', W - M, H - 14, { size: 8, align: 'right' });

  doc.save('bling-happiness-' + kind + '.pdf');
}

function hexToRgb(hex){
  const h = String(hex).replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

// A gift card, drawn at credit-card proportions.
async function drawGiftCard(canvas, card){
  const ctx = canvas.getContext('2d');
  // Standard card ratio (85.6 x 54mm), rendered large enough to look crisp.
  canvas.width = 1620; canvas.height = 1020;
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const T = cardTheme();
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, T.from);
  grad.addColorStop(1, T.to);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Thin inner keyline
  ctx.strokeStyle = T.accent + '66';
  ctx.lineWidth = 2;
  ctx.strokeRect(38, 38, w - 76, h - 76);

  ctx.textBaseline = 'alphabetic';

  // GIFT CARD label
  ctx.fillStyle = T.accent;
  ctx.font = "700 30px 'Instrument Sans', sans-serif";
  ctx.fillText('G I F T   C A R D', 92, 130);

  // BLING. centred
  ctx.fillStyle = T.text;
  ctx.font = "500 132px Fraunces, Georgia, serif";
  ctx.textAlign = 'center';
  ctx.fillText('BLING.', w / 2, h / 2 + 26);
  ctx.textAlign = 'left';

  // Value, bottom left
  ctx.fillStyle = T.accent;
  ctx.font = "700 76px Fraunces, Georgia, serif";
  ctx.fillText('R' + card.amount, 92, h - 110);

  // Recipient, bottom left under the value
  if (card.recipient){
    ctx.fillStyle = T.text + 'cc';
    ctx.font = "400 30px 'Instrument Sans', sans-serif";
    ctx.fillText('For ' + card.recipient, 92, h - 68);
  }

  // Code, bottom right
  if (card.code){
    ctx.fillStyle = T.accent + 'cc';
    ctx.font = "600 30px 'Instrument Sans', sans-serif";
    ctx.textAlign = 'right';
    ctx.fillText(card.code, w - 92, h - 68);
    ctx.textAlign = 'left';
  }

  // Logo mark, quietly bottom-right
  const img = await loadMark();
  if (img){
    const targetH = 190;
    const targetW = Math.round(img.width * (targetH / img.height));
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.drawImage(img, w - targetW - 90, h - targetH - 150, targetW, targetH);
    ctx.restore();
  }
}

function cleanPhoneForWhatsApp(phone){
  let n = (phone || '').replace(/[^0-9+]/g, '');

  if (n.startsWith('+')) n = n.slice(1);          // +27... -> 27...
  if (n.startsWith('0027')) n = n.slice(2);       // 0027... -> 27...
  if (n.startsWith('27') && n.length >= 11) return n;  // already international

  if (n.startsWith('0')) return '27' + n.slice(1);     // 082... -> 2782...
  if (n.length === 9) return '27' + n;                 // 82...  -> 2782...

  return n; // anything else (already has another country code) passes through
}

// Three message types, matched to the three documents.
// kind: 'order' | 'receipt' | 'delivery'  (defaults to the lead's status)
function buildLeadMessage(lead, kind){
  const list = leadItemList(lead);
  const total = lead.total || lead.price || '';
  const deliveryMethod = lead.delivery_method || lead.deliveryMethod || 'Collection';

  if (!kind){
    if (lead.status === 'Paid') kind = 'receipt';
    else if (lead.status === 'Ready' || lead.status === 'Sent') kind = 'delivery';
    else kind = 'order';
  }

  const ship = parseFloat(lead.shipping || 0);
  const totals = ship > 0
    ? `\n\nSubtotal: R${lead.subtotal || ''}\nShipping: R${ship.toFixed(0)}\nTotal: R${total}`
    : (total ? `\n\nTotal: R${total}` : '');

  const vars = {
    name: lead.buyer || '',
    items: list,
    total: total,
    subtotal: lead.subtotal || '',
    shipping: ship ? ship.toFixed(0) : '0',
    totals: totals,
    address: lead.address || '(address to confirm)',
    bank: setting('bankDetails'),
    collection: setting('collectionDetails'),
  };

  let tpl;
  if (kind === 'reminder') tpl = setting('reminderMessage');
  else if (kind === 'update') tpl = setting('updateMessage');
  else if (kind === 'receipt') tpl = setting('receiptMessage');
  else if (kind === 'delivery') tpl = deliveryMethod === 'Shipping' ? setting('shippingMessage') : setting('collectionMessage');
  else tpl = setting('orderMessage');

  return fillTemplate(tpl, vars);
}

function authHeader(){

async function apiFetch(path, options = {}){
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}), ...authHeader() };
  const res = await fetch(API + path, { ...options, headers });
  if (!res.ok){
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || 'Something went wrong talking to the server.');
  }
  return res.status === 204 ? null : res.json();
}

function freeShippingOver(){

function shippingFor(method){
  if (method !== 'Shipping') return 0;
  const threshold = freeShippingOver();

  saveCart();
}
function changeQty(idx, delta){

  cart[idx].qty += delta;
  if (cart[idx].qty < 1) cart.splice(idx, 1);

}

// Shared by story and product links. Three fallbacks, because phone browsers
// block the clipboard in ways that vary and fail silently.
async function copyLink(url, btn){
  const field = btn && btn.parentElement ? btn.parentElement.querySelector('.bh-linkfield') : null;
  const flash = (msg) => {
    if (!btn) return;
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = msg;
    setTimeout(() => { btn.textContent = btn.dataset.label || 'Copy'; }, 1800);
  };

  // 1. The modern clipboard API. Needs HTTPS, which the live site has.
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(url);
      flash('Copied!');
      return;
    }
  } catch (e) { /* fall through */ }

  // 2. Older browsers: select the visible field and copy the selection.
  try {
    if (field){
      field.focus();
      field.select();
      field.setSelectionRange(0, url.length);
      if (document.execCommand('copy')){ flash('Copied!'); return; }
    }
  } catch (e) { /* fall through */ }

  // 3. Nothing worked — leave the link selected so it can be copied by hand.
  // The link stays on screen either way, so this is never a dead end.
  if (field){ field.focus(); field.select(); }
  flash('Select & copy');
}

function openDeepLink(){
  const params = new URLSearchParams(window.location.search);

  const itemId = params.get('item');
  if (itemId){
    const product = products.find(p => p.id === itemId);
    if (product){
      nav.view = 'shop';
      transient.viewingProductId = product.id;
      return true;
    }
    // The product has been removed since the link was shared. Send them to the
    // shop rather than a dead page.
    nav.view = 'shop';
    transient.loadError = "That item isn't available any more \u2014 here's the rest of the shop.";
    return true;
  }

  const id = params.get('story');
  if (!id) return false;
  const story = stories.find(s => s.id === id && s.status === 'approved');
  if (!story) return false;
  nav.activeStoryId = story.id;
  nav.activeFolder = story.category;
  nav.view = 'story';
  return true;
}

// ---- On-screen keyboard ----
// Reserve space the height of the keyboard and lift the focused field into
// view. Without this, the reply box on a story page sits under the keyboard in
// the Instagram in-app browser and cannot be scrolled to at all.
(function(){
  const root = document.documentElement;
  // Read this lazily rather than caching it — some in-app webviews attach
  // visualViewport after the page script has already run.
  const vp = () => window.visualViewport;

  function applyInset(){
    const vv = vp();
    if (!vv) return;
    // How much of the window the keyboard is covering.
    const inset = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    root.style.setProperty('--kb-inset', (inset > 80 ? inset : 0) + 'px');
  }

  function liftIntoView(el){
    if (!el || !el.getBoundingClientRect) return;
    const vv = vp();
    const visibleBottom = vv ? vv.height + vv.offsetTop : window.innerHeight;
    const box = el.getBoundingClientRect();
    // Only scroll if it is actually hidden or crowded against the keyboard.
    if (box.bottom > visibleBottom - 16 || box.top < 0){
      try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      catch (e) { el.scrollIntoView(); }
    }
  }

  let bound = false;
  function bindViewport(){
    const vv = vp();
    if (bound || !vv || !vv.addEventListener) return;
    vv.addEventListener('resize', applyInset);
    vv.addEventListener('scroll', applyInset);
    bound = true;
  }
  bindViewport();
  // Try again shortly in case the webview attaches it late.
  setTimeout(bindViewport, 500);
  setTimeout(bindViewport, 2000);

  // Scroll the field to the top of the screen rather than the centre. With the
  // spacer below it there is always room, and it does not depend on knowing how
  // tall the keyboard is.
  function lift(el){
    if (!el || !el.getBoundingClientRect) return;
    try { el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    catch (e) { el.scrollIntoView(true); }
  }

  document.addEventListener('focusin', function(e){
    const el = e.target;
    if (!el || !/^(TEXTAREA|INPUT|SELECT)$/.test(el.tagName)) return;
    bindViewport();
    document.body.classList.add('kb-open');
    applyInset();
    // Keep nudging while the keyboard animates in — a single attempt lands
    // before the layout has settled and is silently undone.
    [60, 200, 400, 700].forEach(function(ms){
      setTimeout(function(){
        if (document.activeElement !== el) return;
        applyInset();
        lift(el);
      }, ms);
    });
  });

  document.addEventListener('focusout', function(){
    setTimeout(function(){
      const a = document.activeElement;
      // Moving between two fields should not collapse the space and jump the page.
      if (a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) return;
      document.body.classList.remove('kb-open');
      applyInset();
    }, 200);
  });
})();

// ---- Masking words on shared cards ----
// Two separate lists, because they are two different problems.
//
// STRONG is swearing. EXPLICIT is mostly anatomical or sexual language, which
// is not offensive on a page built for women to talk frankly — but it does get
// Instagram posts throttled or removed. So by default both are masked on the
// picture cards, and the website itself is left exactly as written.
//
// Masking keeps the first letter and the length, so the meaning survives:
// "fuck" becomes "f***", "vagina" becomes "v*****".
const DEFAULT_MASK_STRONG = [
  'fuck','fucking','fucked','fucker','motherfucker','shit','shitty','bullshit',
  'cunt','bitch','bastard','asshole','arsehole','wanker','dickhead','prick',
  'slut','whore','twat','bollocks',
];
const DEFAULT_MASK_EXPLICIT = [
  'sex','sexual','sexually','vagina','vaginal','penis','dick','cock','pussy',
  'tits','titties','boobs','clit','clitoris','orgasm','orgasms','masturbate',
  'masturbating','horny','nipples','anal','blowjob','cum','erection','foreplay',
];

function maskList(key, fallback){
  try {
    const raw = setting(key);
    if (raw){
      const list = raw.split(',').map(w => w.trim().toLowerCase()).filter(Boolean);
      if (list.length) return list;
    }
  } catch (e) {}
  return fallback;
}

function maskingOn(where){
  // 'cards' defaults on, 'site' defaults off.
  const v = setting(where === 'site' ? 'maskOnSite' : 'maskOnCards');
  if (v === 'off') return false;
  if (v === 'on') return true;
  return where !== 'site';
}

function escapeRegex(w){ return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

let _maskRe = null;
let _maskReKey = '';
function maskRegex(){
  const words = maskList('maskWordsStrong', DEFAULT_MASK_STRONG)
    .concat(maskList('maskWordsExplicit', DEFAULT_MASK_EXPLICIT));
  const key = words.join('|');
  if (_maskRe && _maskReKey === key) return _maskRe;
  // Longest first so "fucking" is matched before "fuck".
  const sorted = words.slice().sort((a, b) => b.length - a.length).map(escapeRegex);
  // Word boundaries matter: without them "analysis" and "Essex" get mangled.
  _maskRe = new RegExp('\\b(' + sorted.join('|') + ')\\b', 'gi');
  _maskReKey = key;
  return _maskRe;
}

function maskWord(word){
  if (word.length <= 1) return word;
  return word[0] + '*'.repeat(word.length - 1);
}

// Returns the text with matched words masked. Safe on empty input.
function maskText(text, where){
  const str = String(text == null ? '' : text);
  if (!str || !maskingOn(where || 'cards')) return str;
  return str.replace(maskRegex(), (m) => maskWord(m));
}

// What would be masked, so she can see it before posting.
function maskedWordsIn(text){
  const found = String(text || '').match(maskRegex());
  if (!found) return [];
  return [...new Set(found.map(w => w.toLowerCase()))];
}

function togglePseudonym(selectId, wrapId){
  const sel = document.getElementById(selectId);
  const wrap = document.getElementById(wrapId);
  if (sel && wrap) wrap.style.display = sel.value === 'pseudonym' ? 'block' : 'none';
}

function readPseudonym(selectId, inputId){
  const sel = document.getElementById(selectId);
  const inp = document.getElementById(inputId);
  if (!sel || sel.value !== 'pseudonym') return '';
  return inp ? inp.value.trim().slice(0, 24) : '';
}

async function submitStory(){
  const text = document.getElementById('submitStoryText').value.trim();
  const category = document.getElementById('submitCategory').value;
  if (!text) return;
  try {
    const pseudonym = readPseudonym('submitAnonMode','submitPseudonym');
    await apiFetch('/stories', { method: 'POST', body: JSON.stringify({ text, category, pseudonym }) });
    transient.submitSent = true;
    transient.loadError = '';
  } catch (e) {
    transient.loadError = failureText(e, "Couldn't submit that");
  }
  render();
}

          ${!isVoucher(product) && sizeInfo.all.length > 1 ? `

            <label class="bh-label">Size</label>

          <p id="detailError" style="color:var(--risk);font-size:.8rem;min-height:1.1em;margin:0 0 6px"></p>
          <button class="bh-btn" style="width:100%" onclick="addToCartFromDetail('${product.id}')">Add to basket →</button>

          <div style="margin-top:26px;border-top:1px solid var(--line);padding-top:18px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap">
              <h3 class="bh-serif" style="font-size:1.02rem;color:var(--plum);margin:0">Reviews</h3>
              ${reviewsFor(product.id).length ? `<span style="font-size:.8rem;color:var(--grey)">${stars(averageRating(product.id))} ${averageRating(product.id).toFixed(1)} · ${reviewsFor(product.id).length}</span>` : ''}
            </div>

            ${reviewsFor(product.id).length === 0 ? `<p style="font-size:.85rem;color:var(--grey);margin:10px 0 0">No reviews yet — be the first.</p>` : ''}
            ${reviewsFor(product.id).map(r => `
              <div class="bh-review">
                <span class="bh-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span>
                <span class="who" style="margin-left:8px">${escapeHtml(authorLabel(r))}</span>
                <div class="txt">${escapeHtml(r.text)}</div>
              </div>`).join('')}

            ${transient.reviewSent ? `
              <p style="font-size:.85rem;color:var(--ok);margin-top:14px">Thank you — your review will appear once it's been read.</p>
            ` : `
              <div style="margin-top:18px">
                <label class="bh-label">Leave a review</label>
                <div class="bh-rate-pick">
                  ${[1,2,3,4,5].map(n => `<button class="${(transient.reviewRating||5) >= n ? 'on' : ''}" onclick="setReviewRating(${n})">★</button>`).join('')}
                </div>
                <textarea id="reviewText" class="bh-textarea" style="min-height:74px;margin-bottom:10px" placeholder="How was it?"></textarea>
                <label class="bh-label">How should this appear?</label>
                <select id="reviewAnonMode" class="bh-select" style="margin-bottom:10px" onchange="togglePseudonym('reviewAnonMode','reviewPseudoWrap')">
                  <option value="anon">Stay anonymous</option>
                  <option value="pseudonym">Use a pseudonym</option>
                </select>
                <div id="reviewPseudoWrap" style="display:none;margin-bottom:10px">
                  <input id="reviewPseudonym" class="bh-input" maxlength="24" placeholder="Your pseudonym, e.g. Sunflower">
                  <p class="bh-warn">Please don't use your real name — whatever you type here will be visible to everyone.</p>
                </div>
                <p id="reviewError" style="color:var(--risk);font-size:.8rem;min-height:1.1em;margin:0 0 6px"></p>
                <button class="bh-btn-outline" onclick="submitReview('${product.id}')">Send review</button>
              </div>`}
          </div>
        </div>
      </div>`;
  }

  // 4. THE SHOP
  const cols = coloursInShop();
  const sizes = sizesInShop();
  const filtering = anyFilterActive();
  const seeAll = transient.shopSeeAll;

  const productCard = (p) => `
    <div class="bh-railcard" onclick="viewProduct('${p.id}')">
      ${p.has_image ? `<img src="${productImageUrl(p,'thumb')}" alt="" loading="lazy">` : `<div class="bh-railcard-fill"></div>`}
      ${isMadeToOrder(p, (productSizes(p)[0] || '')) && p.stock_status === 'made_to_order' ? `<span class="bh-railpill order">To order</span>` : ''}
      <div class="bh-railveil"></div>
      <div class="bh-raillbl">
        <div class="t">${escapeHtml(p.name)}</div>
        <div class="s">${isVoucher(p) ? 'Gift card' : 'R' + escapeHtml(p.price)}${reviewsFor(p.id).length ? ' \u00b7 ' + averageRating(p.id).toFixed(1) + '\u2605' : ''}</div>

  const shownCount = visibleProducts(filterScope()).length;
  const nActive = activeFilterCount();
  const controls = `
    <div class="bh-filterbar">
      <button class="bh-filterbtn" onclick="openFilters()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 7h13M19 7h2M3 17h5M11 17h10"/>
          <circle cx="17.5" cy="7" r="2.2"/><circle cx="9.5" cy="17" r="2.2"/>
        </svg>
        <span>Filter and sort</span>

      </button>
      <span class="bh-filtercount">${shownCount} product${shownCount === 1 ? '' : 's'}</span>
