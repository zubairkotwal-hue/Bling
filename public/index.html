<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bling Happiness — App</title>
<style>

  .bh-root{ --ink:#241521; --plum:#3d1e3a; --plum2:#6b3560; --plum3:#8a4877; --blush:#f0c4cf; --blushp:#fbf1ef; --gold:#c9a15a; --goldl:#e4c989; --line:#ead9dc; --grey:#6b5a67; --ok:#5c7a5e; --risk:#a13d4c;

<script>
const CATEGORIES = ['Relationships', 'Intimacy', 'Friendships', 'Family', 'Work & Money', 'Self & Growth'];
function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words){
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

async function loadCanvasFonts(){
  try {
    await document.fonts.load('700 100px Fraunces');
    await document.fonts.load('italic 400 60px Fraunces');
    await document.fonts.load('700 30px "Instrument Sans"');
  } catch (e) { /* falls back to system fonts if this fails */ }
}

async function drawStoryCard(canvas, storyText){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#3d1e3a');
  grad.addColorStop(0.55, '#6b3560');
  grad.addColorStop(1, '#8a4877');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 90;
  const contentWidth = w - marginX * 2;

  ctx.fillStyle = '#c9a15a';
  ctx.font = "700 200px Fraunces, Georgia, serif";
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('\u201C', marginX - 10, 480);

  ctx.fillStyle = '#fdf6f9';
  ctx.font = "italic 400 62px Fraunces, Georgia, serif";
  const lineHeight = 82;
  const lines = wrapCanvasText(ctx, storyText, contentWidth);
  const startY = h / 2 - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((line, i) => ctx.fillText(line, marginX, startY + i * lineHeight));

  const tagY = h - 140;
  ctx.strokeStyle = '#e4c989';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, tagY);
  ctx.lineTo(marginX + 34, tagY);
  ctx.stroke();

  ctx.fillStyle = '#e4c989';
  ctx.font = "700 26px 'Instrument Sans', sans-serif";
  ctx.fillText('S H A R E D   A N O N Y M O U S L Y', marginX + 48, tagY + 9);
}

async function drawCompileCard(canvas, replyTexts){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#3d1e3a');
  grad.addColorStop(1, '#8a4877');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 80;
  const contentWidth = w - marginX * 2;

  ctx.fillStyle = '#c9a15a';
  ctx.font = "700 64px Fraunces, Georgia, serif";
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Here\u2019s what', marginX, 210);
  ctx.fillText('you said', marginX, 285);

  ctx.strokeStyle = '#e4c989';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, 330);
  ctx.lineTo(marginX + 60, 330);
  ctx.stroke();

  let y = 430;
  const lineHeight = 54;
  replyTexts.forEach((reply) => {
    ctx.fillStyle = '#e4c989';
    ctx.font = "700 46px Fraunces, Georgia, serif";
    ctx.fillText('\u201C', marginX, y);
    y += 10;

    ctx.fillStyle = '#fdf6f9';
    ctx.font = "italic 400 38px Fraunces, Georgia, serif";
    const lines = wrapCanvasText(ctx, reply, contentWidth - 20);
    lines.forEach((line) => { y += lineHeight; ctx.fillText(line, marginX + 20, y); });
    y += 70;
  });

  ctx.fillStyle = '#e4c989';
  ctx.font = "700 24px 'Instrument Sans', sans-serif";
  ctx.fillText('R E P L I E S   F R O M   T H E   C O M M U N I T Y', marginX, h - 90);
}

function downloadCanvas(canvas, filename){
  return new Promise((resolve) => {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      resolve();
    }, 'image/jpeg', 0.92);
  });
}

async function drawOrderCard(canvas, order){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#3d1e3a');
  grad.addColorStop(1, '#8a4877');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 80;
  const contentWidth = w - marginX * 2;
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#c9a15a';
  ctx.font = "700 58px Fraunces, Georgia, serif";
  ctx.fillText('Order confirmed', marginX, 220);

  ctx.strokeStyle = '#e4c989';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, 260);
  ctx.lineTo(marginX + 60, 260);
  ctx.stroke();

  const rows = [
    ['Item', order.item],
    ['Price', 'R' + order.price],
    ['For', order.buyer],
    ['Delivery', order.deliveryMethod || 'Collection'],
  ];

  let y = 360;
  rows.forEach(([label, value]) => {
    ctx.fillStyle = '#e4c989';
    ctx.font = "700 26px 'Instrument Sans', sans-serif";
    ctx.fillText(label.toUpperCase(), marginX, y);
    y += 44;
    ctx.fillStyle = '#fdf6f9';
    ctx.font = "italic 400 40px Fraunces, Georgia, serif";
    const lines = wrapCanvasText(ctx, String(value || '—'), contentWidth);
    lines.forEach(line => { ctx.fillText(line, marginX, y); y += 48; });
    y += 30;
  });

  ctx.fillStyle = '#e4c989';
  ctx.font = "700 24px 'Instrument Sans', sans-serif";
  const bankLines = wrapCanvasText(ctx, 'PAYMENT: ' + BANK_DETAILS, contentWidth);
  bankLines.forEach(line => { ctx.fillText(line, marginX, y); y += 32; });

  ctx.fillStyle = '#e4c989';
  ctx.font = "700 22px 'Instrument Sans', sans-serif";
  ctx.fillText('B L I N G   H A P P I N E S S', marginX, h - 80);
}

function cleanPhoneForWhatsApp(phone){
  return (phone || '').replace(/[^0-9]/g, '');
}

function buildWhatsAppLink(phone, message){
  const clean = cleanPhoneForWhatsApp(phone);
  return `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
}

function buildLeadMessage(lead){
  if (lead.status === 'Ready'){
    return `Hi ${lead.buyer}! Your order (${lead.item}) is ready for ${lead.deliveryMethod === 'Shipping' ? 'shipping' : 'collection'}.`;
  }
  if (lead.status === 'Sent'){
    return `Hi ${lead.buyer}! Your order (${lead.item}) is on its way. Thanks so much for your order!`;
  }
  if (lead.status === 'Paid'){
    return `Hi ${lead.buyer}! We've received your payment for ${lead.item} — we'll let you know as soon as it's ready.`;
  }
  // Enquired / default: initial order confirmation
  return `Hi ${lead.buyer}, thanks for your order! ${lead.item}${lead.price ? ' — R' + lead.price : ''}. Please pay via EFT: ${BANK_DETAILS}. We'll confirm once payment reflects.`;
}

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let idCounter = 1;
function newId(){ idCounter += 1; return Date.now() + '-' + idCounter; }

const API = '/.netlify/functions';

async function authHeader(){
  const user = netlifyIdentity.currentUser();
  if (!user) return {};
  try {
    const token = await user.jwt();
    return { Authorization: 'Bearer ' + token };
  } catch (e) {
    return {};
  }
}

async function apiFetch(path, options = {}){
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}), ...(await authHeader()) };
  const res = await fetch(API + path, { ...options, headers });
  if (!res.ok){
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || 'Something went wrong talking to the server.');
  }
  return res.status === 204 ? null : res.json();
}

async function fetchStories(){ stories = await apiFetch('/stories'); }
async function fetchReplies(){ replies = await apiFetch('/replies'); }
async function fetchProducts(){ products = await apiFetch('/products'); }
async function fetchLeads(){ leads = await apiFetch('/leads'); }

// ---- State ----
let stories = [];
let replies = [];
let products = [];
let leads = [];
let nav = { view: 'home', activeFolder: null, activeStoryId: null, adminUnlocked: false, adminTab: 'queue' };
let transient = {
  submitSent: false,
  orderingProductId: null,
  orderSent: false,
  shopImageData: null,
  compileStoryId: '',
  compileChecked: {},
  postDownloadStatus: '',
  compileStatus: '',
  leadDownloadStatus: '',
  loadError: '',
};

const LEAD_STATUSES = ['Enquired', 'Paid', 'Ready', 'Sent'];

// ---- Navigation ----
function goHome(){ nav.view = 'home'; nav.activeFolder = null; nav.activeStoryId = null; render(); }
function goSubmit(){ nav.view = 'submit'; transient.submitSent = false; render(); }
function goShop(){ nav.view = 'shop'; transient.orderingProductId = null; transient.orderSent = false; render(); }
async function goAdmin(){
  nav.view = 'admin';
  render();
  if (!nav.adminUnlocked){
    netlifyIdentity.open('login');
    return;
  }
  // Already logged in — refresh admin data every time this panel is opened,
  // so anything submitted elsewhere in the meantime (a new story, a new
  // reply) actually shows up instead of showing what was last loaded.
  try {
    await Promise.all([fetchStories(), fetchReplies(), fetchLeads()]);
    transient.loadError = '';
  } catch (e) {
    transient.loadError = "Couldn't refresh admin data — showing what was last loaded.";
  }
  render();
}
function adminLogout(){ netlifyIdentity.logout(); }
function openFolder(cat){ nav.activeFolder = cat; nav.view = 'folder'; render(); }
function openStory(id){ nav.activeStoryId = id; nav.view = 'story'; render(); }

// ---- Root render ----
function render(){
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="bh-root">
      <nav class="bh-nav">
        <button class="bh-logo" onclick="goHome()">Bling <span class="dot">•</span> Happiness</button>
        <div class="bh-navlinks">
          <button class="${['home','folder','story'].includes(nav.view) ? 'on' : ''}" onclick="goHome()">Library</button>
          <button class="${nav.view === 'submit' ? 'on' : ''}" onclick="goSubmit()">Share your story</button>
          <button class="${nav.view === 'shop' ? 'on' : ''}" onclick="goShop()">Shop</button>
          <button class="${nav.view === 'admin' ? 'on' : ''}" onclick="goAdmin()">🔒 Admin</button>
        </div>
      </nav>
      ${transient.loadError ? `
        <div style="max-width:900px;margin:14px auto 0;padding:0 24px;">
          <div style="background:var(--riskbg,#fbeaec);border:1px solid #e3b8bf;color:var(--risk);border-radius:10px;padding:12px 16px;font-size:.85rem;font-weight:600;">
            ${escapeHtml(transient.loadError)}
          </div>
        </div>
      ` : ''}
      ${nav.view === 'home' ? renderHome() : `<div class="bh-wrap">${renderCurrentView()}</div>`}
      <canvas id="exportCanvas" width="1080" height="1920" style="display:none"></canvas>
    </div>
  `;
}

function renderCurrentView(){
  switch (nav.view){
    case 'folder': return renderFolder();
    case 'story': return renderStory();
    case 'submit': return renderSubmit();
    case 'shop': return renderShop();
    case 'admin': return renderAdmin();
    default: return '';
  }
}

// ---- Home / folders ----
function renderHome(){
  const approved = stories.filter(s => s.status === 'approved');
  const folders = CATEGORIES.map(cat => ({ cat, count: approved.filter(s => s.category === cat).length }));
  return `
    <div class="bh-hero">
      <h1 class="bh-serif">Every story deserves somewhere safe to land.</h1>
      <p>Browse by what you're going through, or share your own — completely anonymously.</p>
    </div>
    <div class="bh-wrap" style="padding:0 0 0">
      <div class="bh-folder-grid">
        ${folders.map(f => `
          <div class="bh-folder" onclick="openFolder('${escapeHtml(f.cat)}')">
            <div class="count">${f.count}</div>
            <div class="name">${escapeHtml(f.cat)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ---- Folder ----
function renderFolder(){
  const items = stories.filter(s => s.status === 'approved' && s.category === nav.activeFolder);
  return `
    <button class="bh-btn-ghost" onclick="goHome()" style="margin-bottom:14px">← All folders</button>
    <h2 class="bh-serif" style="font-size:1.3rem;color:var(--plum);margin-bottom:16px">${escapeHtml(nav.activeFolder)}</h2>
    ${items.length === 0 ? `<p class="bh-empty">No approved stories in this folder yet.</p>` : ''}
    ${items.map(s => {
      const count = replies.filter(r => r.storyId === s.id && r.status === 'approved').length;
      const snippet = s.text.length > 120 ? s.text.slice(0, 120) + '…' : s.text;
      return `
        <div class="bh-tile" onclick="openStory('${s.id}')">
          <p>"${escapeHtml(snippet)}"</p>
          <div class="sub">${count} ${count === 1 ? 'reply' : 'replies'}</div>
        </div>
      `;
    }).join('')}
  `;
}

// ---- Story + replies ----
function renderStory(){
  const story = stories.find(s => s.id === nav.activeStoryId);
  if (!story) return `<div class="bh-empty">Story not found.</div>`;
  const storyReplies = replies.filter(r => r.storyId === story.id && r.status === 'approved');
  return `
    <button class="bh-btn-ghost" onclick="openFolder('${escapeHtml(story.category)}')" style="margin-bottom:14px">← Back to ${escapeHtml(story.category)}</button>
    <div class="bh-storyhero">
      <div class="mark">&ldquo;</div>
      <p>${escapeHtml(story.text)}</p>
      <div class="tag">${escapeHtml(story.category)} · ${storyReplies.length} ${storyReplies.length === 1 ? 'reply' : 'replies'}</div>
    </div>
    <div style="margin-top:26px">
      <h2 class="bh-serif" style="font-size:1.05rem;color:var(--plum);margin-bottom:12px">Replies</h2>
      ${storyReplies.length === 0 ? `<p class="bh-empty">No replies yet — be the first to respond.</p>` : ''}
      ${storyReplies.map(r => `<div class="bh-reply"><span class="rt">Anonymous</span>${escapeHtml(r.text)}</div>`).join('')}
    </div>
    <div class="bh-card" style="margin-top:20px;background:var(--blushp);border:none">
      <label class="bh-label">Add your reply</label>
      <textarea id="replyTextInput" class="bh-textarea" style="min-height:80px;margin-bottom:10px" placeholder="Type your reply…"></textarea>
      <button class="bh-btn" onclick="submitReply()">Post reply anonymously →</button>
      <p id="replyStatus" style="font-size:.78rem;color:var(--ok);margin-top:8px"></p>
    </div>
  `;
}

async function submitReply(){
  const el = document.getElementById('replyTextInput');
  const text = el.value.trim();
  if (!text) return;
  const story = stories.find(s => s.id === nav.activeStoryId);
  const statusEl = document.getElementById('replyStatus');
  statusEl.textContent = 'Sending…';
  try {
    await apiFetch('/replies', { method: 'POST', body: JSON.stringify({ storyId: story.id, text }) });
    el.value = '';
    statusEl.textContent = "Sent — it'll appear here once it's been read and approved.";
  } catch (e) {
    statusEl.textContent = "Couldn't send that — please try again.";
  }
}

// ---- Submit a story ----
function renderSubmit(){

    return `
      <div class="bh-card" style="text-align:center;padding:40px 24px">
        <div class="bh-serif" style="font-size:2.2rem;color:var(--gold)">✓</div>
        <h2 class="bh-serif" style="font-size:1.2rem;color:var(--plum);margin:10px 0">Thank you for trusting us with this.</h2>
        <p style="font-size:.88rem;color:var(--grey);max-width:40ch;margin:0 auto 16px">It'll be read within a day or two. Nothing about you is ever attached to it.</p>

  return `

async function submitStory(){

  const category = document.getElementById('submitCategory').value;

// ---- Shop front (public) ----
function renderShop(){
  if (transient.orderingProductId){
    const product = products.find(p => p.id === transient.orderingProductId);
    if (!product){ transient.orderingProductId = null; return renderShop(); }

    if (transient.orderSent){
      return `
        <div class="bh-card" style="text-align:center;padding:40px 24px">
          <div class="bh-serif" style="font-size:2.2rem;color:var(--gold)">✓</div>
          <h2 class="bh-serif" style="font-size:1.2rem;color:var(--plum);margin:10px 0">Order placed.</h2>

          <button class="bh-btn-outline" onclick="goShop()">Back to Bling Happiness</button>
        </div>
      `;
    }

    return `
      <div class="bh-card">
        <button class="bh-btn-ghost" onclick="cancelOrder()" style="margin-bottom:16px">← Back to shop</button>

        <label class="bh-label">WhatsApp number</label>

        <label class="bh-label">Collection or shipping?</label>
        <div class="bh-radio-row">

          <label><input type="radio" name="deliveryMethod" value="Shipping" onchange="toggleShippingField()"> Shipping</label>
        </div>
        <div id="shippingAddressWrap" style="display:none">
          <label class="bh-label">Shipping address</label>
          <textarea id="orderAddress" class="bh-textarea" style="min-height:70px;margin-bottom:14px" placeholder="Where should we send it?"></textarea>
        </div>
        <p class="bh-note">Payment is by EFT — we'll send banking details and confirm your order over WhatsApp.</p>
        <button class="bh-btn" onclick="submitOrder()" style="margin-top:14px">Place order →</button>

    `;
  }

  return `
    <h2 class="bh-serif" style="font-size:1.3rem;color:var(--plum);margin-bottom:4px">Shop</h2>
    <p style="font-size:.85rem;color:var(--grey);margin-bottom:6px">Kept separate from the stories above, on purpose.</p>
    ${products.length === 0 ? `<p class="bh-empty">Nothing in the shop yet — check back soon.</p>` : ''}
    <div class="bh-shop-grid">
      ${products.map(p => `
        <div class="bh-shop-card" onclick="startOrder('${p.id}')">
          ${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : `<div style="aspect-ratio:1;background:var(--blushp)"></div>`}
          <div class="body">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="price">R${escapeHtml(p.price)}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function toggleShippingField(){
  const method = document.querySelector('input[name=deliveryMethod]:checked').value;
  document.getElementById('shippingAddressWrap').style.display = method === 'Shipping' ? 'block' : 'none';
}
function startOrder(id){ transient.orderingProductId = id; transient.orderSent = false; render(); }
function cancelOrder(){ transient.orderingProductId = null; render(); }

async function submitOrder(){
  const buyer = document.getElementById('orderBuyer').value.trim();
  const phone = document.getElementById('orderPhone').value.trim();
  const deliveryMethod = document.querySelector('input[name=deliveryMethod]:checked').value;
  const address = deliveryMethod === 'Shipping' ? document.getElementById('orderAddress').value.trim() : '';
  if (!buyer || !phone) return;
  const product = products.find(p => p.id === transient.orderingProductId);
  try {
    await apiFetch('/leads', {
      method: 'POST',
      body: JSON.stringify({ buyer, phone, item: product.name, price: product.price, deliveryMethod, address }),
    });
    transient.orderSent = true;
    transient.loadError = '';
  } catch (e) {
    transient.loadError = "Couldn't place that order — please try again in a moment.";
  }
  render();
}

  const pendingStories = stories.filter(s => s.status === 'pending');

  return `
    <div class="bh-card" style="margin-bottom:16px;background:var(--blushp);border:none">
      <p style="font-size:.85rem;color:var(--grey);margin:0">Approving a story automatically files it into its folder below — no separate filing step. Same for replies: approve, and it appears on the story's page right away.</p>
    </div>
    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:10px">New stories (${pendingStories.length})</h3>
    ${pendingStories.length === 0 ? `<p class="bh-empty">Nothing waiting right now.</p>` : ''}
    ${pendingStories.map(s => `
      <div class="bh-qrow">
        <span class="txt"><span class="catpill">Will file into: ${escapeHtml(s.category)}</span><br>${escapeHtml(s.text)}</span>
        <span class="actions">
          <button class="bh-approve" onclick="approveStory('${s.id}')">✓ Approve</button>
          <button class="bh-reject" onclick="rejectStory('${s.id}')">✕ Reject</button>

      </div>
    `).join('')}

    ${pendingReplies.length === 0 ? `<p class="bh-empty">Nothing waiting right now.</p>` : ''}
    ${pendingReplies.map(r => {
      const parent = stories.find(s => s.id === r.storyId);
      const parentSnip = parent ? (parent.text.slice(0, 40) + '…') : 'a story';
      return `
        <div class="bh-qrow">

}

async function approveStory(id){ await apiFetch('/stories', { method: 'PATCH', body: JSON.stringify({ id, status: 'approved' }) }); await fetchStories(); render(); }
async function rejectStory(id){ await apiFetch('/stories', { method: 'PATCH', body: JSON.stringify({ id, status: 'rejected' }) }); await fetchStories(); render(); }
async function approveReply(id){ await apiFetch('/replies', { method: 'PATCH', body: JSON.stringify({ id, status: 'approved' }) }); await fetchReplies(); render(); }
async function rejectReply(id){ await apiFetch('/replies', { method: 'PATCH', body: JSON.stringify({ id, status: 'rejected' }) }); await fetchReplies(); render(); }

function renderShopManager(){
  return `

            <div class="price">R${escapeHtml(p.price)}</div>

function handleShopFile(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { transient.shopImageData = reader.result; render(); };
  reader.readAsDataURL(file);
}

async function addProduct(){
  const name = document.getElementById('shopName').value.trim();
  const price = document.getElementById('shopPrice').value;
  if (!name || !price) return;
  await apiFetch('/products', { method: 'POST', body: JSON.stringify({ name, price, image: transient.shopImageData }) });
  transient.shopImageData = null;
  await fetchProducts();
  render();
}
async function removeProduct(id){ await apiFetch('/products', { method: 'DELETE', body: JSON.stringify({ id }) }); await fetchProducts(); render(); }

async function addLead(){
  const buyer = document.getElementById('leadBuyer').value.trim();
  const item = document.getElementById('leadItem').value.trim();
  const phone = document.getElementById('leadPhone').value.trim();
  const price = document.getElementById('leadPrice').value.trim();
  if (!buyer || !item) return;
  await apiFetch('/leads', { method: 'POST', body: JSON.stringify({ buyer, item, phone, price, deliveryMethod: 'Collection' }) });
  await fetchLeads();
  render();
}
async function cycleLeadStatus(id){
  const lead = leads.find(l => l.id === id);
  const next = LEAD_STATUSES[(LEAD_STATUSES.indexOf(lead.status) + 1) % LEAD_STATUSES.length];
  await apiFetch('/leads', { method: 'PATCH', body: JSON.stringify({ id, status: next }) });
  await fetchLeads();
  render();
}
async function removeLead(id){ await apiFetch('/leads', { method: 'DELETE', body: JSON.stringify({ id }) }); await fetchLeads(); render(); }

function sendLeadWhatsApp(id){
  const lead = leads.find(l => l.id === id);
  if (!lead.phone){ alert('No WhatsApp number saved for this lead — add one to send a message.'); return; }
  const message = buildLeadMessage(lead);
  window.open(buildWhatsAppLink(lead.phone, message), '_blank');
}

async function downloadLeadCard(id){
  const lead = leads.find(l => l.id === id);
  transient.leadDownloadStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawOrderCard(canvas, lead);
  await downloadCanvas(canvas, 'bling-happiness-order.jpg');
  transient.leadDownloadStatus = 'Downloaded — attach it in WhatsApp before sending.';
  render();
}

        <button class="bh-btn" onclick="createRoundupCard()">Create round-up card →</button>
      ` : ''}
      <p style="font-size:.78rem;margin-top:8px;color:${transient.compileStatus.startsWith('Pick') ? 'var(--risk)' : 'var(--ok)'}">${escapeHtml(transient.compileStatus)}</p>
    </div>
  `;
}

function setCompileStory(id){ transient.compileStoryId = id; transient.compileChecked = {}; transient.compileStatus = ''; render(); }
function toggleCompileCheck(id){ transient.compileChecked[id] = !transient.compileChecked[id]; render(); }

async function downloadStoryCard(id){
  const story = stories.find(s => s.id === id);
  transient.postDownloadStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawStoryCard(canvas, story.text);
  await downloadCanvas(canvas, 'bling-happiness-story.jpg');
  await apiFetch('/stories', { method: 'PATCH', body: JSON.stringify({ id, posted: true }) });
  await fetchStories();
  transient.postDownloadStatus = 'Downloaded — ready to post to Stories.';
  render();
}

async function createRoundupCard(){
  const compileReplies = replies.filter(r => r.storyId === transient.compileStoryId && r.status === 'approved');
  const chosen = compileReplies.filter(r => transient.compileChecked[r.id]).map(r => r.text);
  if (chosen.length === 0){
    transient.compileStatus = 'Pick at least one reply to include.';
    render();
    return;
  }
  transient.compileStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawCompileCard(canvas, chosen);
  await downloadCanvas(canvas, 'bling-happiness-roundup.jpg');
  transient.compileStatus = 'Downloaded — ready to post back to Stories.';
  render();
}

// ---- Boot ----
async function boot(){
  render(); // show the loading state immediately
  try {
    await Promise.all([fetchStories(), fetchReplies(), fetchProducts()]);
  } catch (e) {
    transient.loadError = "Couldn't reach the server just now — check your connection and reload.";
  }
  render();
}

async function onAdminLogin(){
  nav.adminUnlocked = true;
  try {
    await Promise.all([fetchStories(), fetchReplies(), fetchLeads()]);
  } catch (e) {
    transient.loadError = "Logged in, but couldn't load admin data — try reloading.";
  }
  render();
}

netlifyIdentity.on('init', user => { if (user) onAdminLogin(); });
netlifyIdentity.on('login', () => { netlifyIdentity.close(); onAdminLogin(); });
netlifyIdentity.on('logout', () => { nav.adminUnlocked = false; goHome(); });
netlifyIdentity.init();
  if (/recovery_token=|invite_token=|confirmation_token=/.test(window.location.hash)) {
  setTimeout(function(){ netlifyIdentity.open(); }, 300);
}

boot();
</script>
