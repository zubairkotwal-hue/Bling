  .bh-statuspill{ font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:5px 11px; border-radius:20px; background:var(--blushp); color:var(--plum); border:1px solid var(--line); cursor:pointer; }

  <div style="max-width:420px;margin:80px auto;padding:0 24px;text-align:center;font-family:sans-serif;color:#3d1e3a;">
    <p style="font-weight:700;">Loading Bling Happiness…</p>
    <p style="font-size:.9rem;color:#6b5a67;">If this message doesn't disappear, this viewer may be blocking JavaScript. Try opening this file directly in Chrome or Safari instead of a quick preview or an in-app browser (e.g. inside WhatsApp).</p>

  <div style="max-width:420px;margin:80px auto;padding:0 24px;text-align:center;font-family:sans-serif;color:#3d1e3a;">

<script>
const SIZE_PRESETS = {
  clothing: { label: 'Clothing (XS–XXL)', options: ['XS','S','M','L','XL','XXL'] },
  bra: { label: 'Bra sizes', options: (function(){
      const bands = [30,32,34,36,38,40,42,44];
      const cups = ['A','B','C','D','DD','E','F','G'];
      const out = [];
      bands.forEach(b => cups.forEach(cp => out.push(b + cp)));
      return out;
    })() },
  freesize: { label: 'Free size (one size)', options: ['Free size'] },
};

const CATEGORIES = ['Relationships', 'Intimacy', 'Friendships', 'Family', 'Work & Money', 'Self & Growth'];

// Shown to customers on order confirmations (both the picture and the
// WhatsApp message). REPLACE THIS with the real banking details before
// taking real orders.
const BANK_DETAILS = 'Bling Happiness · FNB/RMB · Acc 62727946181 · Branch 250655 · Reference: your full name';
function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words){
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

async function loadCanvasFonts(){
  try {
    await document.fonts.load('700 100px Fraunces');
    await document.fonts.load('italic 400 60px Fraunces');
    await document.fonts.load('700 30px "Instrument Sans"');
  } catch (e) { /* falls back to system fonts if this fails */ }
}

// Load the logo mark once, reuse for every card.
let _markImg = null;
function loadMark(){
  if (_markImg) return Promise.resolve(_markImg);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { _markImg = img; resolve(img); };
    img.onerror = () => resolve(null); // card still renders without it
    img.src = '/mark.png';
  });
}

// Subtle logo watermark, bottom-right.
async function drawWatermark(ctx, w, h){
  const img = await loadMark();
  if (!img) return;
  const targetH = Math.round(h * 0.075);
  const targetW = Math.round(img.width * (targetH / img.height));
  const margin = 70;
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.drawImage(img, w - targetW - margin, h - targetH - margin, targetW, targetH);
  ctx.restore();
}

async function drawStoryCard(canvas, storyText){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#3d1e3a');
  grad.addColorStop(0.55, '#6b3560');
  grad.addColorStop(1, '#8a4877');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 90;
  const contentWidth = w - marginX * 2;

  ctx.fillStyle = '#c9a15a';
  ctx.font = "700 200px Fraunces, Georgia, serif";
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('\u201C', marginX - 10, 480);

  ctx.fillStyle = '#fdf6f9';
  ctx.font = "italic 400 62px Fraunces, Georgia, serif";
  const lineHeight = 82;
  const lines = wrapCanvasText(ctx, storyText, contentWidth);
  const startY = h / 2 - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((line, i) => ctx.fillText(line, marginX, startY + i * lineHeight));

  const tagY = h - 140;
  ctx.strokeStyle = '#e4c989';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, tagY);
  ctx.lineTo(marginX + 34, tagY);
  ctx.stroke();

  ctx.fillStyle = '#e4c989';
  ctx.font = "700 26px 'Instrument Sans', sans-serif";
  ctx.fillText('S H A R E D   A N O N Y M O U S L Y', marginX + 48, tagY + 9);

  await drawWatermark(ctx, w, h);
}

async function drawCompileCard(canvas, replyTexts){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#3d1e3a');
  grad.addColorStop(1, '#8a4877');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 80;
  const contentWidth = w - marginX * 2;

  ctx.fillStyle = '#c9a15a';
  ctx.font = "700 64px Fraunces, Georgia, serif";
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Here\u2019s what', marginX, 210);
  ctx.fillText('you said', marginX, 285);

  ctx.strokeStyle = '#e4c989';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, 330);
  ctx.lineTo(marginX + 60, 330);
  ctx.stroke();

  let y = 430;
  const lineHeight = 54;
  replyTexts.forEach((reply) => {
    ctx.fillStyle = '#e4c989';
    ctx.font = "700 46px Fraunces, Georgia, serif";
    ctx.fillText('\u201C', marginX, y);
    y += 10;

    ctx.fillStyle = '#fdf6f9';
    ctx.font = "italic 400 38px Fraunces, Georgia, serif";
    const lines = wrapCanvasText(ctx, reply, contentWidth - 20);
    lines.forEach((line) => { y += lineHeight; ctx.fillText(line, marginX + 20, y); });
    y += 70;
  });

  ctx.fillStyle = '#e4c989';
  ctx.font = "700 24px 'Instrument Sans', sans-serif";
  ctx.fillText('R E P L I E S   F R O M   T H E   C O M M U N I T Y', marginX, h - 90);

  await drawWatermark(ctx, w, h);
}

function downloadCanvas(canvas, filename){
  return new Promise((resolve) => {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      resolve();
    }, 'image/jpeg', 0.92);
  });
}

async function drawOrderCard(canvas, order){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#3d1e3a');
  grad.addColorStop(1, '#8a4877');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 80;
  const contentWidth = w - marginX * 2;
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#c9a15a';
  ctx.font = "700 58px Fraunces, Georgia, serif";
  ctx.fillText('Order confirmed', marginX, 220);

  ctx.strokeStyle = '#e4c989';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, 260);
  ctx.lineTo(marginX + 60, 260);
  ctx.stroke();

  let y = 360;

  ctx.fillStyle = '#e4c989';
  ctx.font = "700 26px 'Instrument Sans', sans-serif";
  ctx.fillText('ITEMS', marginX, y);
  y += 50;

  let basket = [];
  try {
    const parsed = typeof order.items === 'string' ? JSON.parse(order.items || 'null') : order.items;
    if (Array.isArray(parsed)) basket = parsed;
  } catch (e) {}
  if (!basket.length){
    basket = [{ qty: 1, name: order.item, size: order.size || '', price: order.price }];
  }

  basket.forEach(i => {
    const label = `${i.qty} x ${i.name}${i.size ? ' (' + i.size + ')' : ''}`;
    const amount = 'R' + ((parseFloat(i.price) || 0) * (i.qty || 1)).toFixed(0);
    ctx.fillStyle = '#fdf6f9';
    ctx.font = "italic 400 36px Fraunces, Georgia, serif";
    const lines = wrapCanvasText(ctx, label, contentWidth - 220);
    lines.forEach((line, idx) => {
      ctx.fillText(line, marginX, y);
      if (idx === 0){
        ctx.textAlign = 'right';
        ctx.fillText(amount, w - marginX, y);
        ctx.textAlign = 'left';
      }
      y += 46;
    });
    y += 10;
  });

  const grandTotal = order.total || basket.reduce((n, i) => n + (parseFloat(i.price)||0) * (i.qty||1), 0).toFixed(0);
  y += 6;
  ctx.strokeStyle = 'rgba(228,201,137,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(marginX, y); ctx.lineTo(w - marginX, y); ctx.stroke();
  y += 52;
  ctx.fillStyle = '#e4c989';
  ctx.font = "700 34px 'Instrument Sans', sans-serif";
  ctx.fillText('TOTAL', marginX, y);
  ctx.textAlign = 'right';
  ctx.fillText('R' + grandTotal, w - marginX, y);
  ctx.textAlign = 'left';
  y += 40;

  [['For', order.buyer], ['Delivery', order.delivery_method || order.deliveryMethod || 'Collection']]
    .filter(r => r[1]).forEach(([label, value]) => {
      y += 34;
      ctx.fillStyle = '#e4c989';
      ctx.font = "700 26px 'Instrument Sans', sans-serif";
      ctx.fillText(label.toUpperCase(), marginX, y);
      y += 44;
      ctx.fillStyle = '#fdf6f9';
      ctx.font = "italic 400 40px Fraunces, Georgia, serif";
      wrapCanvasText(ctx, String(value), contentWidth).forEach(line => { ctx.fillText(line, marginX, y); y += 48; });
    });

  ctx.fillStyle = '#e4c989';
  ctx.font = "700 24px 'Instrument Sans', sans-serif";
  const bankLines = wrapCanvasText(ctx, 'PAYMENT: ' + BANK_DETAILS, contentWidth);
  bankLines.forEach(line => { ctx.fillText(line, marginX, y); y += 32; });

  ctx.fillStyle = '#e4c989';
  ctx.font = "700 22px 'Instrument Sans', sans-serif";
  ctx.fillText('B L I N G   H A P P I N E S S', marginX, h - 80);

  await drawWatermark(ctx, w, h);
}

function cleanPhoneForWhatsApp(phone){
  return (phone || '').replace(/[^0-9]/g, '');
}

function buildWhatsAppLink(phone, message){
  const clean = cleanPhoneForWhatsApp(phone);
  return `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
}

function leadItemList(lead){
  try {
    const items = typeof lead.items === 'string' ? JSON.parse(lead.items || 'null') : lead.items;
    if (Array.isArray(items) && items.length){
      return items.map(i => `${i.qty} x ${i.name}${i.size ? ' (' + i.size + ')' : ''} — R${((parseFloat(i.price)||0) * i.qty).toFixed(0)}`).join('\n');
    }
  } catch (e) {}
  return `${lead.item}${lead.size ? ' (' + lead.size + ')' : ''}${lead.price ? ' — R' + lead.price : ''}`;
}

function buildLeadMessage(lead){
  if (lead.status === 'Ready'){
    return `Hi ${lead.buyer}! Your order (${lead.item}) is ready for ${lead.deliveryMethod === 'Shipping' ? 'shipping' : 'collection'}.`;
  }
  if (lead.status === 'Sent'){
    return `Hi ${lead.buyer}! Your order (${lead.item}) is on its way. Thanks so much for your order!`;
  }
  if (lead.status === 'Paid'){
    return `Hi ${lead.buyer}! We've received your payment for ${lead.item} — we'll let you know as soon as it's ready.`;
  }
  // Enquired / default: initial order confirmation
  const list = leadItemList(lead);
  const total = lead.total ? `\n\nTotal: R${lead.total}` : '';
  return `Hi ${lead.buyer}, thanks for your order!\n\n${list}${total}\n\nPlease pay via EFT:\n${BANK_DETAILS}\n\nWe'll confirm once payment reflects.`;
}

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let idCounter = 1;

const API = '/.netlify/functions';

// Admin password, held only in memory for this browser tab.
// Every request re-sends it and the SERVER re-checks it, so nothing is
// trusted to the browser alone.
let adminPassword = '';

function authHeader(){
  return adminPassword ? { 'X-Admin-Password': adminPassword } : {};
}

async function apiFetch(path, options = {}){
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}), ...authHeader() };
  const res = await fetch(API + path, { ...options, headers });
  if (!res.ok){
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || 'Something went wrong talking to the server.');
  }
  return res.status === 204 ? null : res.json();
}

let cart = (function(){
  try { return JSON.parse(localStorage.getItem('bh_cart') || '[]'); }
  catch (e) { return []; }
})();

function saveCart(){
  try { localStorage.setItem('bh_cart', JSON.stringify(cart)); } catch (e) {}
}
function cartCount(){ return cart.reduce((n, i) => n + i.qty, 0); }
function cartTotal(){ return cart.reduce((n, i) => n + (parseFloat(i.price) || 0) * i.qty, 0); }

function addToCart(productId, size){
  const p = products.find(x => x.id === productId);
  if (!p) return;
  const existing = cart.find(i => i.productId === productId && i.size === (size || ''));
  if (existing) existing.qty += 1;
  else cart.push({ productId, name: p.name, price: p.price, size: size || '', qty: 1 });
  saveCart();
}
function changeQty(idx, delta){
  if (!cart[idx]) return;
  cart[idx].qty += delta;
  if (cart[idx].qty < 1) cart.splice(idx, 1);
  saveCart();
  render();
}
function removeFromCart(idx){ cart.splice(idx, 1); saveCart(); render(); }
function clearCart(){ cart = []; saveCart(); }

function productSizes(p){
  try {
    const raw = typeof p.sizes === 'string' ? JSON.parse(p.sizes || '[]') : (p.sizes || []);
    return Array.isArray(raw) ? raw : [];
  } catch (e) { return []; }
}

  transient.chosenSize = s;

function addToCartFromDetail(productId){
  const product = products.find(p => p.id === productId);
  const sizes = productSizes(product);
  const err = document.getElementById('detailError');
  if (sizes.length > 1 && !transient.chosenSize){
    if (err) err.textContent = 'Please choose a size first.';
    return;

  const size = transient.chosenSize || (sizes.length === 1 ? sizes[0] : '');
  addToCart(productId, size);
  transient.chosenSize = '';
  viewCart();

async function submitOrder(){
  const buyer = document.getElementById('orderBuyer').value.trim();
  const phone = document.getElementById('orderPhone').value.trim();
  const deliveryMethod = document.querySelector('input[name=deliveryMethod]:checked').value;
  const address = deliveryMethod === 'Shipping' ? document.getElementById('orderAddress').value.trim() : '';
  const errEl = document.getElementById('orderError');

  if (!buyer || !phone){ errEl.textContent = 'Please add your name and WhatsApp number.'; return; }
  if (deliveryMethod === 'Shipping' && !address){ errEl.textContent = 'Please add a shipping address.'; return; }
  if (cart.length === 0){ errEl.textContent = 'Your basket is empty.'; return; }

  errEl.textContent = 'Sending…';
  try {
    await apiFetch('/leads', {
      method: 'POST',
      body: JSON.stringify({
        buyer, phone, deliveryMethod, address,
        items: cart,
        total: cartTotal().toFixed(0),
      }),
    });
    clearCart();
    transient.orderSent = true;
    transient.loadError = '';
  } catch (e) {
    errEl.textContent = "Couldn't place that order — please try again in a moment.";
    return;
  }
  render();
}

      <button class="bh-tab ${nav.adminTab === 'shop' ? 'on' : ''}" onclick="setAdminTab('shop')">Shop</button>
      <button class="bh-tab ${nav.adminTab === 'leads' ? 'on' : ''}" onclick="setAdminTab('leads')">Leads</button>
    </div>
    ${nav.adminTab === 'queue' ? renderReviewQueue() : ''}
    ${nav.adminTab === 'post' ? renderPostManager() : ''}
    ${nav.adminTab === 'shop' ? renderShopManager() : ''}
    ${nav.adminTab === 'leads' ? renderLeadsManager() : ''}
  `;
}

function setAdminTab(tab){ nav.adminTab = tab; render(); }

// ---- Admin: review queue ----
function renderReviewQueue(){
  const pendingStories = stories.filter(s => s.status === 'pending');
  const pendingReplies = replies.filter(r => r.status === 'pending');
  return `
    <div class="bh-card" style="margin-bottom:16px;background:var(--blushp);border:none">
      <p style="font-size:.85rem;color:var(--grey);margin:0">Approving a story automatically files it into its folder below — no separate filing step. Same for replies: approve, and it appears on the story's page right away.</p>
    </div>
    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:10px">New stories (${pendingStories.length})</h3>
    ${pendingStories.length === 0 ? `<p class="bh-empty">Nothing waiting right now.</p>` : ''}
    ${pendingStories.map(s => `
      <div class="bh-qrow">
        <span class="txt"><span class="catpill">Will file into: ${escapeHtml(s.category)}</span><br>${escapeHtml(s.text)}</span>
        <span class="actions">
          <button class="bh-approve" onclick="approveStory('${s.id}')">✓ Approve</button>
          <button class="bh-reject" onclick="rejectStory('${s.id}')">✕ Reject</button>
        </span>
      </div>
    `).join('')}
    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin:24px 0 10px">Replies (${pendingReplies.length})</h3>
    ${pendingReplies.length === 0 ? `<p class="bh-empty">Nothing waiting right now.</p>` : ''}
    ${pendingReplies.map(r => {
      const parent = stories.find(s => s.id === r.storyId);
      const parentSnip = parent ? (parent.text.slice(0, 40) + '…') : 'a story';
      return `
        <div class="bh-qrow">
          <span class="txt"><span class="catpill">Reply</span> to "${escapeHtml(parentSnip)}"<br>${escapeHtml(r.text)}</span>
          <span class="actions">
            <button class="bh-approve" onclick="approveReply('${r.id}')">✓ Approve</button>
            <button class="bh-reject" onclick="rejectReply('${r.id}')">✕ Reject</button>
          </span>
        </div>
      `;
    }).join('')}
  `;
}

async function approveStory(id){ await apiFetch('/stories', { method: 'PATCH', body: JSON.stringify({ id, status: 'approved' }) }); await fetchStories(); render(); }
async function rejectStory(id){ await apiFetch('/stories', { method: 'PATCH', body: JSON.stringify({ id, status: 'rejected' }) }); await fetchStories(); render(); }
async function approveReply(id){ await apiFetch('/replies', { method: 'PATCH', body: JSON.stringify({ id, status: 'approved' }) }); await fetchReplies(); render(); }
async function rejectReply(id){ await apiFetch('/replies', { method: 'PATCH', body: JSON.stringify({ id, status: 'rejected' }) }); await fetchReplies(); render(); }

// ---- Admin: shop manager ----
function renderShopManager(){
  return `
    <div class="bh-card" style="margin-bottom:20px">
      <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:14px">Add a product</h3>
      <div class="bh-grid2">
        <div>
          <label class="bh-label">Picture</label>
          <input type="file" accept="image/*" class="bh-input" style="margin-bottom:12px" onchange="handleShopFile(event)">
          ${transient.shopImageData ? `<img src="${transient.shopImageData}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;margin-bottom:12px">` : ''}
          <label class="bh-label">Name</label>
          <input id="shopName" class="bh-input" placeholder="e.g. Item name" style="margin-bottom:12px">
          <label class="bh-label">Price (R)</label>
          <input id="shopPrice" type="number" class="bh-input" placeholder="0.00" style="margin-bottom:12px">

          <label class="bh-label">Description (optional)</label>
          <textarea id="shopDesc" class="bh-textarea" style="min-height:60px;margin-bottom:12px" placeholder="Any extra detail shown on the product page…"></textarea>

          <label class="bh-label">Size type</label>
          <select id="shopSizeType" class="bh-select" style="margin-bottom:12px" onchange="changeSizeType(this.value)">
            ${Object.keys(SIZE_PRESETS).map(k => `<option value="${k}" ${transient.sizeType === k ? 'selected' : ''}>${SIZE_PRESETS[k].label}</option>`).join('')}
          </select>

          <label class="bh-label">Which sizes are available?</label>
          <p style="font-size:.75rem;color:var(--grey);margin:-2px 0 8px">Tap the ones she has in stock.</p>
          <div class="bh-size-grid" id="shopSizeGrid" style="margin-bottom:14px">
            ${SIZE_PRESETS[transient.sizeType].options.map(s =>
              `<button class="bh-size-opt ${transient.selectedSizes.includes(s) ? 'on' : ''}" onclick="toggleSize('${escapeHtml(s)}', this)">${escapeHtml(s)}</button>`
            ).join('')}
          </div>

          <button class="bh-btn" onclick="addProduct()">+ Add product</button>
        </div>
        <div>
          <p class="bh-note" style="margin-top:0">Pictures are stored directly with the product for this first version — simple to build and fine at this scale. If the catalogue grows large, moving images to dedicated image hosting keeps things fast; worth revisiting later, not a blocker now.</p>
        </div>
      </div>
    </div>
    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:12px">Current products (${products.length})</h3>
    ${products.length === 0 ? `<p class="bh-empty">No products added yet.</p>` : ''}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px">
      ${products.map(p => `
        <div class="bh-product">
          ${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : `<div style="aspect-ratio:1;background:var(--blushp)"></div>`}
          <div class="body">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="price">R${escapeHtml(p.price)}</div>
            ${productSizes(p).length ? `<div class="bh-shop-sizes">${productSizes(p).map(escapeHtml).join(', ')}</div>` : ''}
            <button class="bh-btn-ghost" style="color:var(--risk);margin-top:8px;font-size:.75rem" onclick="removeProduct('${p.id}')">🗑 Remove</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function handleShopFile(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { transient.shopImageData = reader.result; render(); };
  reader.readAsDataURL(file);
}

function changeSizeType(type){
  transient.sizeType = type;
  // free size selects itself automatically — there is only one option
  transient.selectedSizes = type === 'freesize' ? ['Free size'] : [];
  // Rebuild only the size grid so typed fields aren't lost.
  const grid = document.getElementById('shopSizeGrid');
  if (grid){
    grid.innerHTML = SIZE_PRESETS[type].options.map(s =>
      `<button class="bh-size-opt ${transient.selectedSizes.includes(s) ? 'on' : ''}" onclick="toggleSize('${escapeHtml(s)}', this)">${escapeHtml(s)}</button>`
    ).join('');
  }
}

function toggleSize(s, btn){
  const i = transient.selectedSizes.indexOf(s);
  if (i === -1) transient.selectedSizes.push(s);
  else transient.selectedSizes.splice(i, 1);
  // Update only this button — a full re-render would wipe whatever has
  // already been typed into the name/price/description fields.
  if (btn) btn.classList.toggle('on', i === -1);
}

async function addProduct(){
  const name = document.getElementById('shopName').value.trim();
  const price = document.getElementById('shopPrice').value;
  const description = document.getElementById('shopDesc').value.trim();
  if (!name || !price){
    transient.loadError = 'Give the product a name and a price before adding it.';
    render();
    return;
  }
  if (transient.selectedSizes.length === 0){
    transient.loadError = 'Pick at least one available size.';
    render();
    return;
  }
  transient.loadError = '';
  await apiFetch('/products', {
    method: 'POST',
    body: JSON.stringify({
      name, price, image: transient.shopImageData,
      description,
      sizeType: transient.sizeType,
      sizes: transient.selectedSizes,
    }),
  });
  transient.shopImageData = null;
  transient.selectedSizes = transient.sizeType === 'freesize' ? ['Free size'] : [];
  await fetchProducts();
  render();
}
async function removeProduct(id){ await apiFetch('/products', { method: 'DELETE', body: JSON.stringify({ id }) }); await fetchProducts(); render(); }

// ---- Admin: leads manager ----
function renderLeadsManager(){
  return `
    <div class="bh-card" style="margin-bottom:20px">
      <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:14px">Add a lead</h3>
      <div class="bh-grid2">
        <input id="leadBuyer" class="bh-input" placeholder="Buyer name" style="margin-bottom:12px">
        <input id="leadItem" class="bh-input" placeholder="Item they want" style="margin-bottom:12px">
        <input id="leadPhone" class="bh-input" placeholder="WhatsApp number (optional)" style="margin-bottom:12px">
        <input id="leadPrice" class="bh-input" placeholder="Price (optional)" style="margin-bottom:12px">
      </div>
      <button class="bh-btn" onclick="addLead()">+ Add lead</button>
    </div>
    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:12px">Tracking (${leads.length})</h3>
    ${leads.length === 0 ? `<p class="bh-empty">No leads yet — they'll show up here as they come in, including orders placed through the shop.</p>` : ''}
    ${leads.map(l => `
      <div class="bh-lead">
        <span class="who"><strong>${escapeHtml(l.buyer)}</strong>${l.total ? ` — R${escapeHtml(l.total)}` : (l.price ? ` — R${escapeHtml(l.price)}` : '')}
        <br><span style="font-size:.8rem;color:var(--ink)">${escapeHtml(leadItemList(l)).replace(/\n/g, '<br>')}</span>
        ${l.phone ? `<br><span style="font-size:.78rem;color:var(--grey)">${escapeHtml(l.phone)} · ${escapeHtml(l.delivery_method || l.deliveryMethod || 'Collection')}</span>` : ''}
        ${l.address ? `<br><span style="font-size:.75rem;color:var(--grey)">${escapeHtml(l.address)}</span>` : ''}</span>
        <span class="bh-statuspill" onclick="cycleLeadStatus('${l.id}')" title="Tap to move to the next status">${escapeHtml(l.status)}</span>
        ${l.phone ? `<button class="bh-wa-btn" style="padding:7px 14px;font-size:.75rem" onclick="sendLeadWhatsApp('${l.id}')">Send WhatsApp →</button>` : ''}
        ${l.item ? `<button class="bh-btn-ghost" style="font-size:.75rem" onclick="downloadLeadCard('${l.id}')">Download card</button>` : ''}
        <button class="bh-btn-ghost" style="color:var(--risk);font-size:.75rem" onclick="removeLead('${l.id}')">🗑</button>
      </div>
    `).join('')}
    <p style="font-size:.78rem;color:var(--ok);margin:4px 0 0">${escapeHtml(transient.leadDownloadStatus)}</p>
    <p class="bh-note">Tap a status pill to move it to the next stage: Enquired → Paid → Ready → Sent. "Send WhatsApp" opens a chat with that lead's number, pre-filled with the right message for their current status — you still tap send yourself, and attach the order picture if you've downloaded one.</p>
  `;
}

async function addLead(){
  const buyer = document.getElementById('leadBuyer').value.trim();
  const item = document.getElementById('leadItem').value.trim();
  const phone = document.getElementById('leadPhone').value.trim();
  const price = document.getElementById('leadPrice').value.trim();
  if (!buyer || !item) return;
  await apiFetch('/leads', { method: 'POST', body: JSON.stringify({ buyer, item, phone, price, deliveryMethod: 'Collection' }) });
  await fetchLeads();
  render();
}
async function cycleLeadStatus(id){
  const lead = leads.find(l => l.id === id);
  const next = LEAD_STATUSES[(LEAD_STATUSES.indexOf(lead.status) + 1) % LEAD_STATUSES.length];
  await apiFetch('/leads', { method: 'PATCH', body: JSON.stringify({ id, status: next }) });
  await fetchLeads();
  render();
}
async function removeLead(id){ await apiFetch('/leads', { method: 'DELETE', body: JSON.stringify({ id }) }); await fetchLeads(); render(); }

function sendLeadWhatsApp(id){
  const lead = leads.find(l => l.id === id);
  if (!lead.phone){ alert('No WhatsApp number saved for this lead — add one to send a message.'); return; }
  const message = buildLeadMessage(lead);
  window.open(buildWhatsAppLink(lead.phone, message), '_blank');
}

async function downloadLeadCard(id){
  const lead = leads.find(l => l.id === id);
  transient.leadDownloadStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawOrderCard(canvas, lead);
  await downloadCanvas(canvas, 'bling-happiness-order.jpg');
  transient.leadDownloadStatus = 'Downloaded — attach it in WhatsApp before sending.';
  render();
}

// ---- Admin: post manager ----
function renderPostManager(){
  const approvedStories = stories.filter(s => s.status === 'approved');
  const readyToPost = approvedStories.filter(s => !s.posted);
  const alreadyPosted = approvedStories.filter(s => s.posted);
  const compileStory = stories.find(s => s.id === transient.compileStoryId);
  const compileReplies = compileStory ? replies.filter(r => r.storyId === compileStory.id && r.status === 'approved') : [];

  return `
    <div class="bh-card" style="margin-bottom:20px">
      <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:10px">Ready to post (${readyToPost.length})</h3>
      <p style="font-size:.83rem;color:var(--grey);margin-bottom:14px">Approved stories, turned into a finished picture with one tap. Sized for Instagram Stories.</p>
      ${readyToPost.length === 0 ? `<p class="bh-empty">Nothing waiting to be posted right now.</p>` : ''}
      ${readyToPost.map(s => `
        <div class="bh-post-item">
          <span class="snip">"${escapeHtml(s.text.length > 90 ? s.text.slice(0, 90) + '…' : s.text)}"</span>
          <button class="bh-btn" onclick="downloadStoryCard('${s.id}')">Download as JPEG →</button>
        </div>
      `).join('')}
      <p style="font-size:.78rem;color:var(--ok);margin-top:8px">${escapeHtml(transient.postDownloadStatus)}</p>
      ${alreadyPosted.length > 0 ? `
        <h3 class="bh-serif" style="font-size:.95rem;color:var(--plum);margin:20px 0 10px">Already downloaded (${alreadyPosted.length})</h3>
        ${alreadyPosted.map(s => `
          <div class="bh-post-item" style="opacity:.6">
            <span class="snip">"${escapeHtml(s.text.length > 90 ? s.text.slice(0, 90) + '…' : s.text)}"</span>
            <span class="bh-postedtag">Downloaded ✓</span>
          </div>
        `).join('')}
      ` : ''}
    </div>
    <div class="bh-card">
      <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:6px">Compile replies into a repost</h3>
      <p style="font-size:.83rem;color:var(--grey);margin-bottom:14px">Pick a story, choose a few of its approved replies, and turn them into a "here's what people said" card.</p>
      <label class="bh-label">Story</label>
      <select class="bh-select" style="margin-bottom:16px" onchange="setCompileStory(this.value)">
        <option value="">Choose a story…</option>
        ${approvedStories.map(s => `<option value="${s.id}" ${transient.compileStoryId === s.id ? 'selected' : ''}>${escapeHtml(s.text.slice(0, 60))}${s.text.length > 60 ? '…' : ''}</option>`).join('')}
      </select>
      ${compileStory && compileReplies.length === 0 ? `<p class="bh-empty">This story has no approved replies yet.</p>` : ''}
      ${compileStory && compileReplies.length > 0 ? `
        <div style="margin-bottom:16px">
          ${compileReplies.map(r => `
            <label class="bh-checkrow">
              <input type="checkbox" style="margin-top:3px" ${transient.compileChecked[r.id] ? 'checked' : ''} onchange="toggleCompileCheck('${r.id}')">
              <span>${escapeHtml(r.text)}</span>
            </label>
          `).join('')}
        </div>
        <button class="bh-btn" onclick="createRoundupCard()">Create round-up card →</button>
      ` : ''}
      <p style="font-size:.78rem;margin-top:8px;color:${transient.compileStatus.startsWith('Pick') ? 'var(--risk)' : 'var(--ok)'}">${escapeHtml(transient.compileStatus)}</p>
    </div>
  `;
}

function setCompileStory(id){ transient.compileStoryId = id; transient.compileChecked = {}; transient.compileStatus = ''; render(); }
function toggleCompileCheck(id){ transient.compileChecked[id] = !transient.compileChecked[id]; render(); }

async function downloadStoryCard(id){
  const story = stories.find(s => s.id === id);
  transient.postDownloadStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawStoryCard(canvas, story.text);
  await downloadCanvas(canvas, 'bling-happiness-story.jpg');
  await apiFetch('/stories', { method: 'PATCH', body: JSON.stringify({ id, posted: true }) });
  await fetchStories();
  transient.postDownloadStatus = 'Downloaded — ready to post to Stories.';
  render();
}

async function createRoundupCard(){
  const compileReplies = replies.filter(r => r.storyId === transient.compileStoryId && r.status === 'approved');
  const chosen = compileReplies.filter(r => transient.compileChecked[r.id]).map(r => r.text);
  if (chosen.length === 0){
    transient.compileStatus = 'Pick at least one reply to include.';
    render();
    return;
  }
  transient.compileStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawCompileCard(canvas, chosen);
  await downloadCanvas(canvas, 'bling-happiness-roundup.jpg');
  transient.compileStatus = 'Downloaded — ready to post back to Stories.';
  render();
}

// ---- Boot ----
async function boot(){
  render(); // show the loading state immediately
  try {
    await Promise.all([fetchStories(), fetchReplies(), fetchProducts()]);
  } catch (e) {
    transient.loadError = "Couldn't reach the server just now — check your connection and reload.";
  }
  render();
}

async function onAdminLogin(){
  nav.adminUnlocked = true;
  try {
    await Promise.all([fetchStories(), fetchReplies(), fetchLeads()]);
  } catch (e) {
    transient.loadError = "Logged in, but couldn't load admin data — try reloading.";
  }
  render();
}

// ---- Admin login/recovery handling ----
// Netlify's login widget auto-detects recovery/invite links in the URL and
// shows its own "set a new password" box — we don't need to (and shouldn't)
// force it open ourselves; doing that risked showing a second, wrong box
// on top of it.
//
// The real bug: verifying a recovery link can itself create a session
// before someone has actually finished setting a password, and refreshing
// the same link re-processes the same token every time. So instead of
// trusting 'init' or 'login' the instant they fire, we wait until the
// widget's box actually closes, THEN decide whether there's a genuine,
// completed login — and we strip the token out of the address bar so a
// refresh can't replay this.
const hasAuthToken = /recovery_token=|invite_token=|confirmation_token=/.test(window.location.hash);
let awaitingAuthFlow = hasAuthToken;

function clearAuthTokenFromUrl(){
  if (window.history && window.history.replaceState){
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
  }
}

async function doAdminLogin(){
  const input = document.getElementById('adminPwInput');
  const errEl = document.getElementById('adminPwError');
  const value = input.value;
  if (!value){ errEl.textContent = 'Enter the password.'; return; }
  errEl.textContent = 'Checking…';
  try {
    const res = await fetch(API + '/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': value },
    });
    if (res.ok){
      adminPassword = value;
      await onAdminLogin();
    } else {
      const data = await res.json().catch(() => ({}));
      errEl.textContent = data.error || 'That password is not correct.';
    }
  } catch (e) {
    errEl.textContent = "Couldn't reach the server — check your connection.";
  }
}

boot();
</script>
