<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bling Happiness</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3d1e3a">
<meta name="apple-mobile-web-app-title" content="Bling Happiness">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
  .bh-root{ --ink:#241521; --plum:#3d1e3a; --plum2:#6b3560; --plum3:#8a4877; --blush:#f0c4cf; --blushp:#fbf1ef; --gold:#c9a15a; --goldl:#e4c989; --line:#ead9dc; --grey:#6b5a67; --ok:#5c7a5e; --risk:#a13d4c;
    font-family:'Instrument Sans',sans-serif; color:var(--ink); background:var(--blushp); min-height:100vh; }
  .bh-root *{ box-sizing:border-box; }
  .bh-serif{ font-family:'Fraunces',serif; }
/* hero, rail and badges */
  .bh-hero2{ position:relative; min-height:420px; display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; color:#fff; }
  .bh-hero2-bg{ position:absolute; inset:0; background:linear-gradient(160deg,#2b1524 0%,#5e2a4c 55%,#8a4877 100%); }
  .bh-hero2-mark{ position:absolute; right:-20px; bottom:-16px; height:230px; opacity:.13; z-index:1; }
  .bh-hero2-inner{ position:relative; z-index:2; padding:52px 26px; max-width:520px; }
  .bh-kicker{ font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; color:var(--goldl); margin-bottom:14px; }
  .bh-hero2-title{ font-weight:400; font-size:clamp(2.2rem,9vw,3.1rem); margin:0; letter-spacing:.02em; }
  .bh-hero2-sub{ font-size:.9rem; color:#efe2ea; margin:14px auto 0; max-width:32ch; line-height:1.55; }
  .bh-hero2-ctas{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .bh-hero2-cta{ background:#fffdf9; color:var(--ink); border:none; font-family:'Instrument Sans',sans-serif; font-weight:600; font-size:.86rem; padding:13px 26px; cursor:pointer; letter-spacing:.02em; }
  .bh-hero2-cta.ghost{ background:transparent; border:1.4px solid rgba(255,255,255,.7); color:#fff; }

  .bh-rail-wrap{ padding:26px 0 6px; }
  .bh-rail-head{ display:flex; align-items:baseline; justify-content:space-between; padding:0 20px 12px; max-width:900px; margin:0 auto; }
  .bh-rail-head h3{ font-weight:500; color:var(--plum); font-size:1.12rem; margin:0; }
  .bh-rail{ display:flex; gap:11px; overflow-x:auto; padding:0 20px 8px; scrollbar-width:none; max-width:900px; margin:0 auto; }
  .bh-rail::-webkit-scrollbar{ display:none; }
  .bh-railcard{ flex:0 0 176px; height:245px; position:relative; overflow:hidden; cursor:pointer; border-radius:3px; }
  .bh-railcard img{ width:100%; height:100%; object-fit:cover; display:block; }
  .bh-railcard-fill{ width:100%; height:100%; background:linear-gradient(150deg,#8f5f72,#d9aab4); }
  .bh-railcard-fill.story{ background:linear-gradient(150deg,#341b30,#7d4c63); }
  .bh-railcard-fill.mf1{ background:linear-gradient(150deg,#8f5f72,#d9aab4); }
  .bh-railcard-fill.mf2{ background:linear-gradient(150deg,#4a1f33,#8a4877); }
  .bh-railcard-fill.mf3{ background:linear-gradient(150deg,#b08b6a,#e7cdb2); }
  .bh-railcard-fill.mf4{ background:linear-gradient(150deg,#5b2740,#a4607c); }
  .bh-railcard-fill.mf5{ background:linear-gradient(150deg,#6b3560,#c79aa8); }
  .bh-railcard-fill.mf6{ background:linear-gradient(150deg,#3d1e3a,#7d4c63); }
  .bh-railcard-fill.sf1{ background:linear-gradient(150deg,#341b30,#6b3560); }
  .bh-railcard-fill.sf2{ background:linear-gradient(150deg,#4a2545,#8a4877); }
  .bh-railcard-fill.sf3{ background:linear-gradient(150deg,#2b1524,#5e2a4c); }

  .bh-catstrip{ padding:18px 0 4px; }
  .bh-catstrip-inner{ display:flex; gap:8px; overflow-x:auto; padding:0 20px 6px; scrollbar-width:none; max-width:900px; margin:0 auto; }
  .bh-catstrip-inner::-webkit-scrollbar{ display:none; }
  .bh-catchip{ flex:0 0 auto; background:#fff; border:1px solid var(--line); border-radius:20px; padding:9px 15px;
    font-family:'Instrument Sans',sans-serif; font-size:.82rem; font-weight:600; color:var(--plum); cursor:pointer; white-space:nowrap; }
  .bh-catchip b{ color:var(--gold); margin-left:4px; }
  .bh-railveil{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(20,8,16,.8) 6%, rgba(20,8,16,.04) 62%); }
  .bh-raillbl{ position:absolute; left:0; right:0; bottom:0; padding:13px; color:#fff; z-index:2; }
  .bh-raillbl .t{ font-family:'Fraunces',serif; font-size:.94rem; font-weight:500; line-height:1.2; }
  .bh-raillbl .s{ font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; opacity:.85; margin-top:5px; }
  .bh-railpill{ position:absolute; top:9px; left:9px; z-index:3; font-size:.57rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; padding:4px 8px; border-radius:20px; }
  .bh-railpill.shop{ background:var(--goldl); color:var(--ink); }
  .bh-railpill.order{ background:#fdf3e3; color:#a6752f; }
  .bh-railpill.story{ background:rgba(255,255,255,.92); color:var(--plum); }

  .bh-badges{ display:grid; grid-template-columns:1fr 1fr; gap:22px 12px; padding:30px 22px 36px; background:#fffdf9; margin-top:26px; }
  .bh-badge{ text-align:center; }
  .bh-badge svg{ width:29px; height:29px; stroke:var(--plum); fill:none; stroke-width:1.3; margin-bottom:8px; }
  .bh-badge .t{ font-weight:700; font-size:.8rem; color:var(--plum); }
  .bh-badge .s{ font-size:.71rem; color:var(--grey); margin-top:3px; line-height:1.4; }
  @media (min-width:700px){ .bh-badges{ grid-template-columns:repeat(4,1fr); max-width:900px; margin:26px auto 0; } }

/* announcement bar + header */
  .bh-announce{ background:var(--ink); color:var(--goldl); text-align:center; font-family:'Fraunces',serif; font-weight:500; font-size:.78rem; padding:9px 12px; letter-spacing:.02em; }
  .bh-hdr{ background:var(--plum); display:flex; align-items:center; justify-content:space-between; padding:13px 16px; position:sticky; top:0; z-index:40; }
  .bh-burger{ background:none; border:none; display:flex; flex-direction:column; gap:4px; cursor:pointer; padding:6px; }
  .bh-burger i{ display:block; width:21px; height:1.7px; background:#fffdf9; }
  .bh-brand{ background:none; border:none; display:flex; align-items:center; gap:8px; cursor:pointer; color:#fffdf9; font-family:'Fraunces',serif; font-weight:500; font-size:1.02rem; letter-spacing:.02em; }
  .bh-brand-mark{ height:24px; width:auto; opacity:.95; }
  .bh-brand .dot{ color:var(--gold); }
  .bh-cartbtn{ background:none; border:none; cursor:pointer; position:relative; padding:6px; }
  .bh-cartbtn svg{ width:20px; height:20px; stroke:#fffdf9; fill:none; stroke-width:1.6; }
  .bh-cart-dot{ position:absolute; top:0; right:0; background:var(--gold); color:var(--ink); font-size:.6rem; font-weight:800; border-radius:20px; padding:1px 5px; }

/* slide-out menu */
  @media (hover:hover){
    .bh-folder:hover{ box-shadow:0 10px 24px rgba(61,30,58,.1); }
    .bh-shop-card:hover{ box-shadow:0 8px 20px rgba(61,30,58,.12); }
    .bh-railcard:hover{ opacity:.94; }
  }

  .bh-menu{ position:fixed; top:0; left:0; right:0; bottom:0; width:100vw; height:100dvh; height:100vh;
    background:var(--plum); z-index:100; padding:22px 22px 30px; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; box-sizing:border-box; }
  body.bh-menu-open{ overflow:hidden; }
  html, body{ overflow-x:hidden; max-width:100%; }
  .bh-menu-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .bh-menu-x{ background:none; border:none; color:#fffdf9; font-size:1.25rem; cursor:pointer; }
  .bh-menu-brand{ font-family:'Fraunces',serif; color:#fffdf9; font-size:1.02rem; }
  .bh-menu-brand .dot{ color:var(--gold); }
  .bh-menu-list{ list-style:none; margin:0; padding:0; }
  .bh-menu-list li{ display:flex; align-items:center; justify-content:space-between; padding:15px 2px; color:#fffdf9; font-size:1.05rem; border-bottom:1px solid rgba(255,255,255,.09); cursor:pointer; }
  .bh-menu-list li.sub{ padding-left:16px; font-size:.92rem; color:rgba(255,253,249,.72); }
  .bh-menu-list li span{ opacity:.5; transition:transform .18s; display:inline-block; }
  .bh-menu-list li span.open{ transform:rotate(90deg); opacity:.9; }
  .bh-menu-foot{ margin-top:24px; color:rgba(255,255,255,.55); font-size:.82rem; cursor:pointer; }

/* gift card preview */
  .bh-giftpreview{ display:flex; justify-content:center; margin-bottom:20px; }
  .bh-gc{ position:relative; width:100%; max-width:340px; aspect-ratio:1.586; border-radius:12px; overflow:hidden;
    background:linear-gradient(135deg,var(--plum),var(--plum3)); box-shadow:0 10px 26px rgba(61,30,58,.28); }
  .bh-gc::after{ content:''; position:absolute; inset:9px; border:1px solid rgba(228,201,137,.4); border-radius:7px; }
  .bh-gc-label{ position:absolute; top:22px; left:24px; color:var(--goldl); font-size:.6rem; font-weight:800; letter-spacing:.24em; text-transform:uppercase; z-index:2; }
  .bh-gc-brand{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:500; color:#fffdf9; font-size:1.9rem; z-index:2; }
  .bh-gc-amt{ position:absolute; left:24px; bottom:34px; font-family:'Fraunces',serif; font-weight:600; color:var(--goldl); font-size:1.5rem; z-index:2; }
  .bh-gc-for{ position:absolute; left:24px; bottom:18px; color:rgba(255,253,249,.8); font-size:.72rem; z-index:2; }
  .bh-gc-mark{ position:absolute; right:16px; bottom:14px; height:74px; opacity:.16; z-index:1; }

/* reviews */
  .bh-stars{ color:var(--gold); letter-spacing:.08em; }
  .bh-review{ border-top:1px solid var(--line); padding:13px 0; }
  .bh-review .who{ font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--gold); }
  .bh-review .txt{ font-size:.88rem; margin-top:5px; }
  .bh-rate-pick{ display:flex; gap:5px; margin-bottom:12px; }
  .bh-rate-pick button{ background:none; border:none; font-size:1.5rem; color:var(--line); cursor:pointer; padding:0; line-height:1; }
  .bh-rate-pick button.on{ color:var(--gold); }

  .bh-nav{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; flex-wrap:wrap; gap:10px; }
  .bh-logo{ font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem; color:var(--plum); cursor:pointer; background:none; border:none; display:flex; align-items:center; gap:9px; padding:0; }
  .bh-logo-mark{ height:30px; width:auto; display:block; }
  .bh-logo .dot{ color:var(--gold); }
  .bh-navlinks{ display:flex; gap:10px; flex-wrap:wrap; }
  .bh-navlinks button{ background:none; border:none; font-weight:600; font-size:.85rem; color:var(--plum); opacity:.75; cursor:pointer; padding:8px 12px; border-radius:8px; }
  .bh-navlinks button:hover{ opacity:1; background:#fff; }
  .bh-navlinks button.on{ opacity:1; background:#fff; }
  .bh-hero{ display:none; }
  .bh-hero > *{ position:relative; z-index:2; }
  .bh-hero-mark{ position:absolute; right:14px; bottom:8px; height:104px; width:auto; opacity:.16; z-index:1; pointer-events:none; }
  @media (max-width:600px){
    .bh-hero-mark{ height:78px; right:10px; bottom:8px; opacity:.14; }
  }
  .bh-hero h1{ font-size:clamp(1.5rem,4vw,2.1rem); font-weight:500; max-width:min(20ch, calc(100% - 86px)); }
  .bh-hero p{ color:#e9d9e4; font-size:.92rem; max-width:min(48ch, calc(100% - 86px)); margin-top:8px; }
  .bh-wrap{ max-width:900px; margin:0 auto; padding:20px 24px 70px; }
  .bh-folder-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px; margin-top:4px; }
  .bh-folder{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .bh-folder{ transition:box-shadow .15s; }
  .bh-folder .count{ font-family:'Fraunces',serif; font-size:1.7rem; color:var(--gold); font-weight:600; }
  .bh-folder .name{ font-weight:700; color:var(--plum); font-size:.92rem; margin-top:2px; }
  .bh-tile{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px; cursor:pointer; }
  .bh-tile:hover{ border-color:var(--gold); }
  .bh-tile p{ font-family:'Fraunces',serif; font-style:italic; font-size:.95rem; margin:0 0 6px; }
  .bh-tile .sub{ font-size:.75rem; color:var(--grey); }
  .bh-storyhero{ background:linear-gradient(155deg,var(--plum),var(--plum2)); color:#fff; border-radius:18px; padding:28px; }
  .bh-storyhero .mark{ font-family:'Fraunces',serif; font-size:2.2rem; color:var(--gold); line-height:1; }
  .bh-storyhero p{ font-family:'Fraunces',serif; font-style:italic; font-size:1.1rem; line-height:1.5; margin:6px 0 14px; }
  .bh-storyhero .tag{ font-size:.72rem; letter-spacing:.06em; color:var(--goldl); font-weight:700; }
  .bh-btn{ background:linear-gradient(135deg,var(--goldl),var(--gold)); color:var(--ink); font-weight:700; padding:11px 20px; border-radius:9px; font-size:.88rem; border:none; cursor:pointer; }
  .bh-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .bh-btn-outline{ background:#fff; border:1.5px solid var(--plum); color:var(--plum); font-weight:700; padding:10px 18px; border-radius:9px; font-size:.85rem; cursor:pointer; }
  .bh-btn-ghost{ background:none; border:none; color:var(--plum); font-weight:600; font-size:.85rem; cursor:pointer; display:flex; align-items:center; gap:6px; padding:0; }
  .bh-input, .bh-textarea, .bh-select{ width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:9px; font-family:'Instrument Sans',sans-serif; font-size:.88rem; background:#fff; }
  .bh-textarea{ min-height:110px; resize:vertical; }
  .bh-label{ display:block; font-weight:700; font-size:.82rem; color:var(--plum); margin-bottom:6px; }
  .bh-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; }
  .bh-reply{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; font-size:.88rem; }
  .bh-reply .rt{ display:block; font-size:.62rem; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin-bottom:4px; }
  .bh-qrow{ display:flex; align-items:flex-start; gap:12px; padding:13px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; flex-wrap:wrap; }
  .bh-qrow .txt{ flex:1; font-size:.86rem; min-width:180px; }
  .bh-qrow .catpill{ font-size:.65rem; font-weight:700; text-transform:uppercase; background:var(--blushp); color:var(--plum); padding:3px 8px; border-radius:20px; margin-right:6px; }
  .bh-qrow .actions{ display:flex; gap:6px; }
  .bh-qrow .actions button{ padding:6px 12px; font-size:.72rem; font-weight:700; border-radius:7px; border:none; cursor:pointer; }
  .bh-approve{ background:var(--ok); color:#fff; }
  .bh-reject{ background:#fff; color:var(--risk); border:1px solid var(--risk) !important; }
  .bh-tabs{ display:flex; gap:6px; background:var(--blushp); padding:4px; border-radius:10px; width:fit-content; margin-bottom:18px; }
  .bh-tab{ padding:8px 16px; font-size:.8rem; font-weight:700; border-radius:8px; border:none; background:none; cursor:pointer; color:var(--grey); }
  .bh-tab.on{ background:#fff; color:var(--plum); }
  .bh-product{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .bh-product img{ width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--blushp); }
  .bh-product .body{ padding:10px 12px; }
  .bh-product .name{ font-weight:700; font-size:.85rem; }
  .bh-product .price{ font-size:.8rem; color:var(--grey); }
  .bh-empty{ text-align:center; padding:40px 20px; color:var(--grey); font-size:.88rem; }
  .bh-lockscreen{ max-width:360px; margin:60px auto; text-align:center; }
  .bh-lockscreen .ico{ width:48px; height:48px; border-radius:50%; background:var(--plum); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
.bh-warn{ font-size:.75rem; color:#a6552f; background:#fdf3e3; border:1px solid #ecd6a6; border-radius:8px; padding:9px 11px; margin:8px 0 0; }
  .bh-note{ font-size:.78rem; color:var(--grey); background:var(--blushp); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .bh-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:600px){ .bh-grid2{ grid-template-columns:1fr; } }
  .bh-lead{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; flex-wrap:wrap; background:#fff; }
  .bh-lead .who{ flex:1; font-size:.86rem; min-width:160px; }
  .bh-lead .who strong{ color:var(--plum); }
  .bh-statuspill{ font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:5px 11px; border-radius:20px; background:var(--blushp); color:var(--plum); border:1px solid var(--line); cursor:pointer; }
  .bh-post-item{ display:flex; align-items:center; gap:14px; padding:14px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; background:#fff; flex-wrap:wrap; }
  .bh-post-item .snip{ flex:1; font-family:'Fraunces',serif; font-style:italic; font-size:.9rem; min-width:180px; }
  .bh-postedtag{ font-size:.68rem; font-weight:700; color:var(--ok); text-transform:uppercase; }
  .bh-checkrow{ display:flex; align-items:flex-start; gap:10px; font-size:.86rem; padding:9px 0; border-bottom:1px solid var(--line); }
.bh-filters{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:16px; }
  .bh-filter-row{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:5px 0; }
  .bh-filter-label{ font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--grey); margin-right:3px; }
  .bh-chip{ background:var(--blushp); border:1px solid var(--line); color:var(--plum); font-size:.78rem; font-weight:700; padding:6px 13px; border-radius:20px; cursor:pointer; font-family:'Instrument Sans',sans-serif; }
  .bh-chip.sm{ font-size:.72rem; padding:5px 10px; }
  .bh-chip.on{ background:var(--plum); color:#fff; border-color:var(--plum); }
  .bh-swatch{ display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); color:var(--plum); font-size:.74rem; font-weight:700; padding:4px 11px 4px 5px; border-radius:20px; cursor:pointer; font-family:'Instrument Sans',sans-serif; }
  .bh-swatch span{ width:15px; height:15px; border-radius:50%; border:1px solid rgba(0,0,0,.15); display:block; }
  .bh-swatch.on{ background:var(--plum); color:#fff; border-color:var(--plum); }
  .bh-sort{ border:1px solid var(--line); border-radius:20px; padding:6px 11px; font-size:.78rem; font-family:'Instrument Sans',sans-serif; color:var(--plum); background:#fff; font-weight:600; }
  .bh-card-swatches{ display:flex; gap:4px; margin-top:5px; }
  .bh-card-swatches i{ width:11px; height:11px; border-radius:50%; border:1px solid rgba(0,0,0,.15); display:block; }
  .bh-shop-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px 12px; margin-top:18px; }
  @media (min-width:760px){ .bh-shop-grid{ grid-template-columns:repeat(4,1fr); gap:24px 16px; } }
  .bh-shop-card{ background:none; border:none; border-radius:0; cursor:pointer; }

  .bh-shop-card img{ width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:var(--blushp); border-radius:2px; }
  .bh-shop-card .noimg{ width:100%; aspect-ratio:3/4; background:linear-gradient(150deg,#e8d5da,#f6ebee); border-radius:2px; }
  .bh-shop-card .body{ padding:10px 2px 0; }
  .bh-shop-card .name{ font-family:'Fraunces',serif; font-weight:500; font-size:.95rem; color:var(--ink); line-height:1.25; }
  .bh-shop-card .price{ font-size:.86rem; color:var(--grey); font-weight:500; margin-top:5px; letter-spacing:.01em; }
  .bh-wa-btn{ background:#25d366; color:#fff; font-weight:700; padding:11px 20px; border-radius:9px; font-size:.86rem; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  .bh-radio-row{ display:flex; gap:16px; margin-bottom:16px; }
.bh-detail{ background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .bh-detail-img{ width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .bh-gallery{ display:flex; gap:8px; overflow-x:auto; padding:10px 14px 2px; scrollbar-width:none; }
  .bh-gallery::-webkit-scrollbar{ display:none; }

function reviewsFor(productId){

// Shrinks a photo before it's stored. Phone photos are several megabytes;
// a shop doesn't need that, and sending full-size photos is what makes a
// catalogue slow to load.
function resizeImage(file, maxSize, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('That file is not a picture'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize){
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else if (height > maxSize){
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Pictures come from their own address so the browser caches them.
function productImageUrl(p, size, n){
  if (!p || !p.has_image) return '';
  return `${API}/image?id=${encodeURIComponent(p.id)}&size=${size || 'thumb'}&n=${n || 0}`;
}
function imageCount(p){
  const n = parseInt(p && p.image_count, 10);
  return isNaN(n) || n < 1 ? (p && p.has_image ? 1 : 0) : n;
}

function isVoucher(p){ return p && p.product_type === 'voucher'; }

const SIZE_PRESETS = {

  bra: { label: 'Bra sizes', options: (function(){
      const bands = [30,32,34,36,38,40,42,44];

// Story categories are editable in Settings. This is only the starting list.
const DEFAULT_CATEGORIES = ['Relationships', 'Intimacy', 'Health', 'Beauty', 'Faith', "Men's Health"];

function categories(){

function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words){
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

async function loadCanvasFonts(){
  try {
    await document.fonts.load('700 100px Fraunces');
    await document.fonts.load('italic 400 60px Fraunces');
    await document.fonts.load('700 30px "Instrument Sans"');
  } catch (e) { /* falls back to system fonts if this fails */ }
}

// Load the logo mark once, reuse for every card.
let _markImg = null;
function loadMark(){
  if (_markImg) return Promise.resolve(_markImg);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { _markImg = img; resolve(img); };
    img.onerror = () => resolve(null); // card still renders without it
    img.src = '/mark.png';
  });
}

// Subtle logo watermark, bottom-right.
async function drawWatermark(ctx, w, h){
  const img = await loadMark();
  if (!img) return;
  const targetH = Math.round(h * 0.075);
  const targetW = Math.round(img.width * (targetH / img.height));
  const margin = 70;
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.drawImage(img, w - targetW - margin, h - targetH - margin, targetW, targetH);
  ctx.restore();
}

async function drawStoryCard(canvas, storyText, tagText){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const T = cardTheme();
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, T.from);
  grad.addColorStop(1, T.to);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 90;
  const contentWidth = w - marginX * 2;
  ctx.textBaseline = 'alphabetic';

  const quoteY = 480;
  const topLimit = quoteY + 60;    // below the big quote mark
  const bottomLimit = h - 230;     // above the tag and logo
  const available = bottomLimit - topLimit;

  // Shrink the text until it fits between the quote mark and the footer,
  // so a long story never runs off the card.
  function measure(size){
    ctx.font = `italic 400 ${size}px Fraunces, Georgia, serif`;
    const lines = wrapCanvasText(ctx, storyText, contentWidth);
    return { lines, lead: size * 1.32, total: lines.length * (size * 1.32) };
  }

  let size = 62;
  let plan = measure(size);
  while (plan.total > available && size > 26){
    size -= 2;
    plan = measure(size);
  }

  ctx.fillStyle = T.accent;
  ctx.font = "700 200px Fraunces, Georgia, serif";
  ctx.fillText('\u201C', marginX - 10, quoteY);

  ctx.fillStyle = T.text;
  ctx.font = `italic 400 ${size}px Fraunces, Georgia, serif`;

  // Sit the block in the middle of the space available, but never above it.
  let startY = topLimit + (available - plan.total) / 2 + plan.lead * 0.8;
  if (startY < topLimit + plan.lead) startY = topLimit + plan.lead;

  plan.lines.forEach((line, i) => ctx.fillText(line, marginX, startY + i * plan.lead));

  const tagY = h - 140;
  ctx.strokeStyle = T.accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, tagY);
  ctx.lineTo(marginX + 34, tagY);
  ctx.stroke();

  ctx.fillStyle = T.accent;
  ctx.font = "700 26px 'Instrument Sans', sans-serif";
  const tag = (tagText || setting('storyCardTag') || '').toUpperCase().split('').join(' ');
  ctx.fillText(tag, marginX + 48, tagY + 9);

  await drawWatermark(ctx, w, h);
}

async function drawCompileCard(canvas, replyTexts, tagText, storyText){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const T = cardTheme();
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, T.from);
  grad.addColorStop(1, T.to);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 80;
  const contentWidth = w - marginX * 2;
  ctx.textBaseline = 'alphabetic';

  const headingY = 210;
  const topOfBody = 430;
  const bottomLimit = h - 190;   // leave room for the tag and the logo
  const available = bottomLimit - topOfBody;

  // Work out how much room everything needs at a given size, then shrink
  // until it fits. This is what stops a long story or lots of replies
  // running off the bottom of the card.
  function layout(scale){
    const storySize = 44 * scale;
    const replySize = 36 * scale;
    const storyLead = storySize * 1.34;
    const replyLead = replySize * 1.34;
    const gapAfterStory = 54 * scale;
    const gapBetween = 40 * scale;

    const blocks = [];
    let total = 0;

    if (storyText){
      ctx.font = `italic 400 ${storySize}px Fraunces, Georgia, serif`;
      const lines = wrapCanvasText(ctx, storyText, contentWidth - 30);
      blocks.push({ kind: 'story', lines, size: storySize, lead: storyLead });
      total += lines.length * storyLead + gapAfterStory;
    }

    ctx.font = `italic 400 ${replySize}px Fraunces, Georgia, serif`;
    replyTexts.forEach((t, i) => {
      const lines = wrapCanvasText(ctx, t, contentWidth - 50);
      blocks.push({ kind: 'reply', lines, size: replySize, lead: replyLead });
      total += lines.length * replyLead + (i < replyTexts.length - 1 ? gapBetween : 0);
    });

    return { blocks, total, gapAfterStory, gapBetween, storySize, replySize };
  }

  let scale = 1;
  let plan = layout(scale);
  // Shrink in small steps rather than one guess, so it stays readable.
  while (plan.total > available && scale > 0.45){
    scale -= 0.04;
    plan = layout(scale);
  }

  // Heading
  ctx.fillStyle = T.accent;
  ctx.font = "700 64px Fraunces, Georgia, serif";
  ctx.fillText('Here\u2019s what', marginX, headingY);
  ctx.fillText('you said', marginX, headingY + 75);

  ctx.strokeStyle = T.accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(marginX, headingY + 120);
  ctx.lineTo(marginX + 60, headingY + 120);
  ctx.stroke();

  let y = topOfBody;

  plan.blocks.forEach((block, idx) => {
    if (block.kind === 'story'){
      // The original story, in gold.
      ctx.fillStyle = T.accent;
      ctx.font = `700 ${Math.round(block.size * 1.15)}px Fraunces, Georgia, serif`;
      ctx.fillText('\u201C', marginX, y);
      y += block.lead * 0.55;

      ctx.fillStyle = T.accent;
      ctx.font = `italic 400 ${block.size}px Fraunces, Georgia, serif`;
      block.lines.forEach(line => { ctx.fillText(line, marginX + 30, y); y += block.lead; });
      y += plan.gapAfterStory;
    } else {
      // Replies, in the lighter cream.
      ctx.fillStyle = T.accent + 'cc';
      ctx.font = `700 ${Math.round(block.size * 1.05)}px Fraunces, Georgia, serif`;
      ctx.fillText('\u2014', marginX, y);

      ctx.fillStyle = T.text;
      ctx.font = `italic 400 ${block.size}px Fraunces, Georgia, serif`;
      block.lines.forEach(line => { ctx.fillText(line, marginX + 50, y); y += block.lead; });
      if (idx < plan.blocks.length - 1) y += plan.gapBetween;
    }
  });

  ctx.fillStyle = T.accent;
  ctx.font = "700 24px 'Instrument Sans', sans-serif";
  const rtag = (tagText || setting('storyCardTag') || '').toUpperCase().split('').join(' ');
  ctx.fillText(rtag, marginX, h - 90);

  await drawWatermark(ctx, w, h);
}

function downloadCanvas(canvas, filename){
  return new Promise((resolve) => {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      resolve();
    }, 'image/jpeg', 0.92);
  });
}

function basketOf(order){
  let basket = [];
  try {
    const parsed = typeof order.items === 'string' ? JSON.parse(order.items || 'null') : order.items;
    if (Array.isArray(parsed)) basket = parsed;
  } catch (e) {}
  if (!basket.length){
    basket = [{ qty: 1, name: order.item, size: order.size || '', price: order.price }];
  }
  return basket;
}

function orderTotal(order){
  return order.total || basketOf(order)
    .reduce((n, i) => n + (parseFloat(i.price) || 0) * (i.qty || 1), 0).toFixed(0);
}

// Shared renderer for all three document types.
// kind: 'order' | 'receipt' | 'delivery'
async function drawDocCard(canvas, order, kind){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const T = cardTheme();
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, T.from);
  grad.addColorStop(1, T.to);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const marginX = 80;
  const contentWidth = w - marginX * 2;
  ctx.textBaseline = 'alphabetic';

  const titles = { order: 'Order confirmed', receipt: 'Receipt', delivery: 'Delivery note' };
  ctx.fillStyle = T.accent;
  ctx.font = "700 58px Fraunces, Georgia, serif";
  ctx.fillText(titles[kind] || 'Order', marginX, 220);

  ctx.strokeStyle = T.accent;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(marginX, 260); ctx.lineTo(marginX + 60, 260); ctx.stroke();

  // date
  ctx.fillStyle = T.text + 'a6';
  ctx.font = "400 26px 'Instrument Sans', sans-serif";
  const when = order.created_at ? new Date(order.created_at) : new Date();
  ctx.fillText(when.toLocaleDateString('en-ZA', { day:'numeric', month:'long', year:'numeric' }), marginX, 300);

  let y = 390;
  const basket = basketOf(order);

  // Shrink the item list if there are a lot of items, so a big order
  // still fits on one card.
  const itemRoom = (h - 420) - 460;   // space before the totals and footer
  function measureItems(sz){
    ctx.font = `italic 400 ${sz}px Fraunces, Georgia, serif`;
    let total = 0;
    const rows = basket.map(i => {
      const label = `${i.qty} x ${i.name}${i.size ? ' (' + i.size + ')' : ''}`;
      const lines = wrapCanvasText(ctx, label, contentWidth - 220);
      total += lines.length * (sz * 1.28) + 10;
      return { lines, i };
    });
    return { rows, total, lead: sz * 1.28 };
  }
  let itemSize = 36;
  let items = measureItems(itemSize);
  while (items.total > itemRoom && itemSize > 20){
    itemSize -= 2;
    items = measureItems(itemSize);
  }

  ctx.fillStyle = T.accent;
  ctx.font = "700 26px 'Instrument Sans', sans-serif";
  ctx.fillText('ITEMS', marginX, y);
  y += 50;

  items.rows.forEach(({ lines, i }) => {
    const amount = 'R' + ((parseFloat(i.price) || 0) * (i.qty || 1)).toFixed(0);
    ctx.fillStyle = T.text;
    ctx.font = `italic 400 ${itemSize}px Fraunces, Georgia, serif`;
    lines.forEach((line, idx) => {
      ctx.fillText(line, marginX, y);
      if (idx === 0 && kind !== 'delivery'){
        ctx.textAlign = 'right';
        ctx.fillText(amount, w - marginX, y);
        ctx.textAlign = 'left';
      }
      y += items.lead;
    });
    y += 10;
  });

  // totals (not shown on a delivery note — that's a packing document)
  if (kind !== 'delivery'){
    y += 6;
    ctx.strokeStyle = T.accent + '73';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(marginX, y); ctx.lineTo(w - marginX, y); ctx.stroke();
    y += 52;
    ctx.fillStyle = T.accent;
    ctx.font = "700 34px 'Instrument Sans', sans-serif";
    ctx.fillText(kind === 'receipt' ? 'PAID' : 'TOTAL', marginX, y);
    ctx.textAlign = 'right';
    ctx.fillText('R' + orderTotal(order), w - marginX, y);
    ctx.textAlign = 'left';
    y += 30;
  }

  const deliveryMethod = order.delivery_method || order.deliveryMethod || 'Collection';
  const rows = [['For', order.buyer], ['Delivery', deliveryMethod]];
  if (kind === 'delivery' && deliveryMethod === 'Shipping' && order.address){
    rows.push(['Address', order.address]);
  }
  if (kind !== 'delivery' && order.phone) rows.push(['Contact', order.phone]);

  rows.filter(r => r[1]).forEach(([label, value]) => {
    y += 34;
    ctx.fillStyle = T.accent;
    ctx.font = "700 26px 'Instrument Sans', sans-serif";
    ctx.fillText(label.toUpperCase(), marginX, y);
    y += 44;
    ctx.fillStyle = T.text;
    ctx.font = "italic 400 40px Fraunces, Georgia, serif";
    wrapCanvasText(ctx, String(value), contentWidth).forEach(line => { ctx.fillText(line, marginX, y); y += 48; });
  });

  // footer note per document type
  y += 40;
  ctx.font = "700 24px 'Instrument Sans', sans-serif";
  ctx.fillStyle = T.accent;
  if (kind === 'order'){
    wrapCanvasText(ctx, 'PAYMENT: ' + setting('bankDetails'), contentWidth).forEach(line => { ctx.fillText(line, marginX, y); y += 32; });
  } else if (kind === 'receipt'){
    ctx.fillText('PAYMENT RECEIVED — THANK YOU', marginX, y);
  } else {
    // Wording depends on whether it has actually gone out yet, not just
    // on the delivery method.
    let deliveryNote;
    if (order.status === 'Sent'){
      deliveryNote = deliveryMethod === 'Shipping' ? 'PACKED AND ON ITS WAY' : 'COLLECTED';
    } else {
      deliveryNote = deliveryMethod === 'Shipping' ? 'PACKED AND READY TO SHIP' : 'READY FOR COLLECTION';
    }
    ctx.fillText(deliveryNote, marginX, y);
  }

  ctx.fillStyle = T.accent;
  ctx.font = "700 22px 'Instrument Sans', sans-serif";
  ctx.fillText('B L I N G   H A P P I N E S S', marginX, h - 80);

  await drawWatermark(ctx, w, h);
}

// WhatsApp needs a full international number. Customers type local SA
// numbers (082..., 071...), so convert them: drop the leading 0 and put
// 27 in front. Numbers already in international form are left alone.
// Minimal PDF writer — no external library needed.
// Produces a real, valid PDF with selectable text using the fonts that
// every PDF reader has built in (Helvetica), so nothing is embedded and
// nothing is downloaded.
function createPDF(){
  const objects = [];   // each entry is a string body
  const pages = [];
  let current = [];     // content stream operators for the page being built

  const PT = 2.834645669; // mm -> points
  const PAGE_W = 210, PAGE_H = 297; // A4 in mm

  function esc(s){
    return String(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  }
  const mmX = (x) => (x * PT).toFixed(2);
  const mmY = (y) => ((PAGE_H - y) * PT).toFixed(2);

  const api = {
    setColor(r, g, b){
      current.push(`${(r/255).toFixed(3)} ${(g/255).toFixed(3)} ${(b/255).toFixed(3)} rg`);
      return api;
    },
    setStroke(r, g, b){
      current.push(`${(r/255).toFixed(3)} ${(g/255).toFixed(3)} ${(b/255).toFixed(3)} RG`);
      return api;
    },
    text(str, x, y, opts){
      opts = opts || {};
      const size = opts.size || 10;
      const font = opts.bold ? '/F2' : '/F1';
      let tx = x;
      if (opts.align === 'right' || opts.align === 'center'){
        const width = api.textWidth(str, size, opts.bold);
        tx = opts.align === 'right' ? x - width : x - width / 2;
      }
      current.push(`BT ${font} ${size} Tf ${mmX(tx)} ${mmY(y)} Td (${esc(str)}) Tj ET`);
      return api;
    },
    // Approximate width in mm. Helvetica averages ~0.5 em, bold ~0.55.
    textWidth(str, size, bold){
      const factor = bold ? 0.55 : 0.5;
      return (String(str).length * size * factor) / PT;
    },
    // Wrap text to a max width (mm), returns an array of lines.
    wrap(str, maxWidthMm, size, bold){
      const words = String(str).split(/\s+/);
      const lines = [];
      let line = '';
      words.forEach(word => {
        const test = line ? line + ' ' + word : word;
        if (api.textWidth(test, size, bold) > maxWidthMm && line){
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      return lines;
    },
    rect(x, y, w, h, fill){
      current.push(`${mmX(x)} ${mmY(y + h)} ${(w * PT).toFixed(2)} ${(h * PT).toFixed(2)} re ${fill ? 'f' : 'S'}`);
      return api;
    },
    line(x1, y1, x2, y2, width){
      current.push(`${((width || 0.3) * PT).toFixed(2)} w ${mmX(x1)} ${mmY(y1)} m ${mmX(x2)} ${mmY(y2)} l S`);
      return api;
    },
    endPage(){
      pages.push(current.join('\n'));
      current = [];
      return api;
    },
    build(){
      if (current.length) api.endPage();

      const fontObjs = [
        '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
        '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
      ];

      // Object numbering: 1 catalog, 2 pages, then per page (page + content), then fonts
      const pageCount = pages.length;
      const firstPageObj = 3;
      const fontStart = firstPageObj + pageCount * 2;

      const kids = [];
      for (let i = 0; i < pageCount; i++) kids.push(`${firstPageObj + i * 2} 0 R`);

      objects[1] = `<< /Type /Catalog /Pages 2 0 R >>`;
      objects[2] = `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pageCount} >>`;

      pages.forEach((content, i) => {
        const pageObj = firstPageObj + i * 2;
        const contentObj = pageObj + 1;
        objects[pageObj] =
          `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] ` +
          `/Resources << /Font << /F1 ${fontStart} 0 R /F2 ${fontStart + 1} 0 R >> >> ` +
          `/Contents ${contentObj} 0 R >>`;
        objects[contentObj] = `<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
      });

      objects[fontStart] = fontObjs[0];
      objects[fontStart + 1] = fontObjs[1];

      // Assemble
      let out = '%PDF-1.4\n';
      const offsets = [];
      for (let i = 1; i < objects.length; i++){
        if (objects[i] === undefined) continue;
        offsets[i] = out.length;
        out += `${i} 0 obj\n${objects[i]}\nendobj\n`;
      }
      const xrefPos = out.length;
      const maxObj = objects.length;
      out += `xref\n0 ${maxObj}\n0000000000 65535 f \n`;
      for (let i = 1; i < maxObj; i++){
        const off = offsets[i] === undefined ? 0 : offsets[i];
        out += String(off).padStart(10, '0') + ' 00000 n \n';
      }
      out += `trailer\n<< /Size ${maxObj} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
      return out;
    },
    save(filename){
      const pdf = api.build();
      const bytes = new Uint8Array(pdf.length);
      for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },
  };

  api.PAGE_W = PAGE_W;
  api.PAGE_H = PAGE_H;
  return api;
}

// Proper structured PDF for an order, receipt or delivery note.
async function makeOrderPDF(order, kind){
  const doc = createPDF();
  const W = doc.PAGE_W, H = doc.PAGE_H;
  const M = 18;
  const PLUM = hexToRgb(T.from), GOLD = hexToRgb(T.accent), GREY = [107, 90, 103], INK = [30, 20, 28];
  const titles = { order: 'ORDER CONFIRMATION', receipt: 'RECEIPT', delivery: 'DELIVERY NOTE' };

  // Header band
  doc.setColor(...PLUM).rect(0, 0, W, 40, true);
  doc.setColor(255, 255, 255).text('BLING HAPPINESS', M, 18, { size: 18, bold: true });
  doc.setColor(...GOLD).text('EMBRACE YOUR CONFIDENCE', M, 25, { size: 8 });
  doc.setColor(255, 255, 255).text(titles[kind] || 'ORDER', W - M, 18, { size: 11, bold: true, align: 'right' });
  const when = order.created_at ? new Date(order.created_at) : new Date();
  doc.text(when.toLocaleDateString('en-ZA', { day: 'numeric', month: 'long', year: 'numeric' }), W - M, 25, { size: 8, align: 'right' });

  let y = 56;
  const deliveryMethod = order.delivery_method || order.deliveryMethod || 'Collection';

  // Customer / delivery blocks
  doc.setColor(...GREY);
  doc.text('CUSTOMER', M, y, { size: 7.5, bold: true });
  doc.text(deliveryMethod === 'Shipping' ? 'SHIPPING TO' : 'COLLECTION FROM', W / 2, y, { size: 7.5, bold: true });
  y += 6;
  doc.setColor(...INK);
  doc.text(String(order.buyer || ''), M, y, { size: 10 });
  if (order.phone) doc.text(String(order.phone), M, y + 5, { size: 10 });

  const rightLines = deliveryMethod === 'Shipping'
    ? doc.wrap(String(order.address || '(address to confirm)'), W / 2 - M - 4, 10, false)
    : ['Ormonde Close, Upavon Road', 'House 33, Ormonde'];
  rightLines.forEach((l, i) => doc.text(l, W / 2, y + i * 5, { size: 10 }));
  y += Math.max(14, rightLines.length * 5 + 8);

  // Items table
  doc.setStroke(...GOLD).line(M, y, W - M, y, 0.5);
  y += 6;
  doc.setColor(...GREY);
  doc.text('ITEM', M, y, { size: 7.5, bold: true });
  doc.text('SIZE', W - M - 60, y, { size: 7.5, bold: true });
  doc.text('QTY', W - M - 32, y, { size: 7.5, bold: true, align: 'right' });
  if (kind !== 'delivery') doc.text('AMOUNT', W - M, y, { size: 7.5, bold: true, align: 'right' });
  y += 3;
  doc.setStroke(215, 205, 210).line(M, y, W - M, y, 0.2);
  y += 7;

  doc.setColor(...INK);
  basketOf(order).forEach(i => {
    const nameLines = doc.wrap(String(i.name || ''), W - M - 95, 10, false);
    nameLines.forEach((l, idx) => doc.text(l, M, y + idx * 5, { size: 10 }));
    doc.text(String(i.size || '-'), W - M - 60, y, { size: 10 });
    doc.text(String(i.qty || 1), W - M - 32, y, { size: 10, align: 'right' });
    if (kind !== 'delivery'){
      doc.text('R' + ((parseFloat(i.price) || 0) * (i.qty || 1)).toFixed(2), W - M, y, { size: 10, align: 'right' });
    }
    y += Math.max(7, nameLines.length * 5 + 2);
  });

  // Totals
  if (kind !== 'delivery'){
    y += 3;
    doc.setStroke(215, 205, 210).line(W / 2, y, W - M, y, 0.2);
    y += 7;
    const ship = parseFloat(order.shipping || 0);
    if (order.subtotal){
      doc.setColor(...GREY).text('Subtotal', W - M - 38, y, { size: 10, align: 'right' });
      doc.setColor(...INK).text('R' + parseFloat(order.subtotal).toFixed(2), W - M, y, { size: 10, align: 'right' });
      y += 6;
      doc.setColor(...GREY).text(ship > 0 ? 'Shipping' : 'Collection', W - M - 38, y, { size: 10, align: 'right' });
      doc.setColor(...INK).text(ship > 0 ? 'R' + ship.toFixed(2) : 'Free', W - M, y, { size: 10, align: 'right' });
      y += 8;
    }
    doc.setColor(...PLUM);
    doc.text(kind === 'receipt' ? 'PAID' : 'TOTAL', W - M - 38, y, { size: 12, bold: true, align: 'right' });
    doc.text('R' + parseFloat(orderTotal(order)).toFixed(2), W - M, y, { size: 12, bold: true, align: 'right' });
    y += 16;
  } else {
    // Delivery notes skip the totals block, so add the spacing here instead
    y += 14;
  }

  // Footer block per document type
  if (kind === 'order'){
    doc.setColor(...PLUM).text('PAYMENT \u2014 EFT', M, y, { size: 9, bold: true }); y += 6;
    doc.setColor(...INK);
    setting('bankDetails').split(' \u00b7 ').forEach(part => { doc.text(part, M, y, { size: 10 }); y += 5; });
    y += 3;
    doc.setColor(...GREY).text("We'll confirm your order as soon as the payment reflects.", M, y, { size: 9 });
  } else if (kind === 'receipt'){
    doc.setColor(...PLUM).text('PAYMENT RECEIVED \u2014 THANK YOU', M, y, { size: 10, bold: true }); y += 7;
    doc.setColor(...GREY).text("We'll let you know as soon as your order is ready.", M, y, { size: 9 });
  } else if (deliveryMethod === 'Collection'){
    doc.setColor(...PLUM).text('COLLECTION DETAILS', M, y, { size: 9, bold: true }); y += 7;
    doc.setColor(...INK);
    // Uses whatever is saved in Settings, line for line.
    String(setting('collectionDetails')).split('\n').forEach(raw => {
      const line = raw.replace(/\*/g, '').trim();
      if (!line){ y += 3; return; }
      const bold = /^(collection times|address)/i.test(line) || /gate/i.test(line);
      doc.wrap(line, W - M * 2, 9.5, bold).forEach(l => {
        doc.text(l, M, y, { size: 9.5, bold: bold });
        y += 5;
      });
    });
  } else {
    doc.setColor(...PLUM).text(order.status === 'Sent' ? 'ON ITS WAY' : 'PACKED AND READY TO SHIP', M, y, { size: 10, bold: true }); y += 7;
    doc.setColor(...GREY).text('You will receive a notification when your order is dispatched.', M, y, { size: 9 });
  }

  // Footer bar
  doc.setStroke(...GOLD).line(M, H - 20, W - M, H - 20, 0.4);
  doc.setColor(...GREY);
  doc.text('Bling Happiness', M, H - 14, { size: 8 });
  doc.text('Thank you for your support', W - M, H - 14, { size: 8, align: 'right' });

  doc.save('bling-happiness-' + kind + '.pdf');
}

function hexToRgb(hex){
  const h = String(hex).replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

// A gift card, drawn at credit-card proportions.
async function drawGiftCard(canvas, card){
  const ctx = canvas.getContext('2d');
  // Standard card ratio (85.6 x 54mm), rendered large enough to look crisp.
  canvas.width = 1620; canvas.height = 1020;
  const w = canvas.width, h = canvas.height;
  await loadCanvasFonts();

  const T = cardTheme();
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, T.from);
  grad.addColorStop(1, T.to);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Thin inner keyline
  ctx.strokeStyle = T.accent + '66';
  ctx.lineWidth = 2;
  ctx.strokeRect(38, 38, w - 76, h - 76);

  ctx.textBaseline = 'alphabetic';

  // GIFT CARD label
  ctx.fillStyle = T.accent;
  ctx.font = "700 30px 'Instrument Sans', sans-serif";
  ctx.fillText('G I F T   C A R D', 92, 130);

  // BLING. centred
  ctx.fillStyle = T.text;
  ctx.font = "500 132px Fraunces, Georgia, serif";
  ctx.textAlign = 'center';
  ctx.fillText('BLING.', w / 2, h / 2 + 26);
  ctx.textAlign = 'left';

  // Value, bottom left
  ctx.fillStyle = T.accent;
  ctx.font = "700 76px Fraunces, Georgia, serif";
  ctx.fillText('R' + card.amount, 92, h - 110);

  // Recipient, bottom left under the value
  if (card.recipient){
    ctx.fillStyle = T.text + 'cc';
    ctx.font = "400 30px 'Instrument Sans', sans-serif";
    ctx.fillText('For ' + card.recipient, 92, h - 68);
  }

  // Code, bottom right
  if (card.code){
    ctx.fillStyle = T.accent + 'cc';
    ctx.font = "600 30px 'Instrument Sans', sans-serif";
    ctx.textAlign = 'right';
    ctx.fillText(card.code, w - 92, h - 68);
    ctx.textAlign = 'left';
  }

  // Logo mark, quietly bottom-right
  const img = await loadMark();
  if (img){
    const targetH = 190;
    const targetW = Math.round(img.width * (targetH / img.height));
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.drawImage(img, w - targetW - 90, h - targetH - 150, targetW, targetH);
    ctx.restore();
  }
}

function cleanPhoneForWhatsApp(phone){
  let n = (phone || '').replace(/[^0-9+]/g, '');

  if (n.startsWith('+')) n = n.slice(1);          // +27... -> 27...
  if (n.startsWith('0027')) n = n.slice(2);       // 0027... -> 27...
  if (n.startsWith('27') && n.length >= 11) return n;  // already international

  if (n.startsWith('0')) return '27' + n.slice(1);     // 082... -> 2782...
  if (n.length === 9) return '27' + n;                 // 82...  -> 2782...

  return n; // anything else (already has another country code) passes through
}

function buildWhatsAppLink(phone, message){
  const clean = cleanPhoneForWhatsApp(phone);
  return `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
}

function leadItemList(lead){
  try {
    const items = typeof lead.items === 'string' ? JSON.parse(lead.items || 'null') : lead.items;
    if (Array.isArray(items) && items.length){
      return items.map(i => `${i.qty} x ${i.name}${i.size ? ' (' + i.size + ')' : ''}${i.toOrder ? ' [' + setting('leadTimeLabel') + ']' : ''} — R${((parseFloat(i.price)||0) * i.qty).toFixed(0)}`).join('\n');
    }
  } catch (e) {}
  return `${lead.item}${lead.size ? ' (' + lead.size + ')' : ''}${lead.price ? ' — R' + lead.price : ''}`;
}

// Three message types, matched to the three documents.
// kind: 'order' | 'receipt' | 'delivery'  (defaults to the lead's status)
function buildLeadMessage(lead, kind){
  const list = leadItemList(lead);
  const total = lead.total || lead.price || '';
  const deliveryMethod = lead.delivery_method || lead.deliveryMethod || 'Collection';

  if (!kind){
    if (lead.status === 'Paid') kind = 'receipt';
    else if (lead.status === 'Ready' || lead.status === 'Sent') kind = 'delivery';
    else kind = 'order';
  }

  const ship = parseFloat(lead.shipping || 0);
  const totals = ship > 0
    ? `\n\nSubtotal: R${lead.subtotal || ''}\nShipping: R${ship.toFixed(0)}\nTotal: R${total}`
    : (total ? `\n\nTotal: R${total}` : '');

  const vars = {
    name: lead.buyer || '',
    items: list,
    total: total,
    subtotal: lead.subtotal || '',
    shipping: ship ? ship.toFixed(0) : '0',
    totals: totals,
    address: lead.address || '(address to confirm)',
    bank: setting('bankDetails'),
    collection: setting('collectionDetails'),
  };

  let tpl;
  if (kind === 'receipt') tpl = setting('receiptMessage');
  else if (kind === 'delivery') tpl = deliveryMethod === 'Shipping' ? setting('shippingMessage') : setting('collectionMessage');
  else tpl = setting('orderMessage');

  return fillTemplate(tpl, vars);
}

function escapeHtml(str){

}

const API = '/.netlify/functions';

// Admin password, held only in memory for this browser tab.
// Every request re-sends it and the SERVER re-checks it, so nothing is
// trusted to the browser alone.
let adminPassword = '';

function authHeader(){
  return adminPassword ? { 'X-Admin-Password': adminPassword } : {};
}

async function apiFetch(path, options = {}){
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}), ...authHeader() };
  const res = await fetch(API + path, { ...options, headers });
  if (!res.ok){
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || 'Something went wrong talking to the server.');
  }
  return res.status === 204 ? null : res.json();
}

let cart = (function(){
  try { return JSON.parse(localStorage.getItem('bh_cart') || '[]'); }
  catch (e) { return []; }
})();

function saveCart(){
  try { localStorage.setItem('bh_cart', JSON.stringify(cart)); } catch (e) {}
}
function cartCount(){ return cart.reduce((n, i) => n + i.qty, 0); }
function cartSubtotal(){ return cart.reduce((n, i) => n + (parseFloat(i.price) || 0) * i.qty, 0); }
function freeShippingOver(){
  const n = parseFloat(setting('freeShippingOver'));
  return isNaN(n) ? 0 : n;
}
function shippingFor(method){
  if (method !== 'Shipping') return 0;
  const threshold = freeShippingOver();
  if (threshold > 0 && cartSubtotal() >= threshold) return 0;
  return shippingCost();
}
function cartTotal(method){ return Math.max(0, cartSubtotal() - (transient.discountAmount || 0)) + shippingFor(method || transient.deliveryMethod); }

function addToCart(productId, size, toOrder){
  const p = products.find(x => x.id === productId);
  if (!p) return;
  const existing = cart.find(i => i.productId === productId && i.size === (size || ''));
  if (existing) existing.qty += 1;
  else cart.push({ productId, name: p.name, price: p.price, size: size || '', qty: 1, toOrder: !!toOrder });
  saveCart();
}
function changeQty(idx, delta){
  if (!cart[idx]) return;
  cart[idx].qty += delta;
  if (cart[idx].qty < 1) cart.splice(idx, 1);
  saveCart();
  render();
}
function removeFromCart(idx){ cart.splice(idx, 1); saveCart(); render(); }
function clearCart(){ cart = []; saveCart(); }

function orderOnlySizes(p){
  try {
    const raw = typeof p.order_sizes === 'string' ? JSON.parse(p.order_sizes || '[]') : (p.order_sizes || []);
    return Array.isArray(raw) ? raw : [];
  } catch (e) { return []; }
}
// Everything a customer can pick: in stock first, then made-to-order.
function allSizesFor(p){
  const inStock = productSizes(p);
  const toOrder = orderOnlySizes(p).filter(s => !inStock.includes(s));
  return { inStock, toOrder, all: inStock.concat(toOrder) };
}
function isMadeToOrder(p, size){
  if (p.stock_status === 'made_to_order') return true;
  return !productSizes(p).includes(size);
}

function productSizes(p){
  try {
    const raw = typeof p.sizes === 'string' ? JSON.parse(p.sizes || '[]') : (p.sizes || []);
    return Array.isArray(raw) ? raw : [];
  } catch (e) { return []; }
}

// ---- Navigation ----
// Each story has its own web address, so a link can be attached to an
// Instagram Story and land someone straight on it.
function storyUrl(id){
  return `${window.location.origin}${window.location.pathname}?story=${encodeURIComponent(id)}`;
}

async function copyStoryLink(id, btn){
  const url = storyUrl(id);
  try {
    await navigator.clipboard.writeText(url);
    if (btn){ const t = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = t, 1800); }
  } catch (e) {
    // Some phone browsers block copying — show it so it can be copied by hand.
    window.prompt('Copy this link and paste it into the Instagram link sticker:', url);
  }
}

// If someone arrives on a story link, open that story straight away.

  const params = new URLSearchParams(window.location.search);

  nav.activeStoryId = story.id;

  return true;
}

function togglePseudonym(selectId, wrapId){
  const sel = document.getElementById(selectId);
  const wrap = document.getElementById(wrapId);
  if (sel && wrap) wrap.style.display = sel.value === 'pseudonym' ? 'block' : 'none';
}

function readPseudonym(selectId, inputId){
  const sel = document.getElementById(selectId);
  const inp = document.getElementById(inputId);
  if (!sel || sel.value !== 'pseudonym') return '';
  return inp ? inp.value.trim().slice(0, 24) : '';
}

async function submitStory(){
  const text = document.getElementById('submitStoryText').value.trim();
  const category = document.getElementById('submitCategory').value;
  if (!text) return;
  try {
    const pseudonym = readPseudonym('submitAnonMode','submitPseudonym');
    await apiFetch('/stories', { method: 'POST', body: JSON.stringify({ text, category, pseudonym }) });
    transient.submitSent = true;
    transient.loadError = '';
  } catch (e) {
    transient.loadError = "Couldn't submit that — please try again in a moment.";
  }
  render();
}

// How recently each product last sold, worked out from real orders.
let _soldCache = null;
function lastSoldAt(productId){
  if (!_soldCache){
    _soldCache = {};
    leads.forEach(l => {
      let items = [];
      try { items = typeof l.items === 'string' ? JSON.parse(l.items || '[]') : (l.items || []); } catch (e) {}
      const when = new Date(l.created_at || 0).getTime();
      (items || []).forEach(i => {
        if (!i.productId) return;
        if (!_soldCache[i.productId] || when > _soldCache[i.productId]) _soldCache[i.productId] = when;
      });
    });
  }
  return _soldCache[productId] || 0;
}
function clearSoldCache(){ _soldCache = null; }

function inStockCount(p){ return productSizes(p).length; }

function visibleProducts(list){
  let out = (list || products).slice();

  if (transient.filterCategory) out = out.filter(p => p.category === transient.filterCategory);
  if (transient.filterColour)   out = out.filter(p => productColours(p).includes(transient.filterColour));
  if (transient.filterSize)     out = out.filter(p => allSizesFor(p).all.includes(transient.filterSize));

  const num = v => parseFloat(v) || 0;
  const newest = (a,b) => new Date(b.created_at||0) - new Date(a.created_at||0);

  switch (transient.sortBy){
    case 'in_stock':
      out.sort((a,b) => (inStockCount(b) > 0) - (inStockCount(a) > 0) || newest(a,b));
      break;
    case 'size':
      out.sort((a,b) => String(a.size_type||'').localeCompare(String(b.size_type||''))
        || allSizesFor(b).all.length - allSizesFor(a).all.length || newest(a,b));
      break;
    case 'price_low':  out.sort((a,b) => num(a.price) - num(b.price)); break;
    case 'price_high': out.sort((a,b) => num(b.price) - num(a.price)); break;
    case 'newest':     out.sort(newest); break;
    default:
      // Recently sold first — what is actually moving.
      out.sort((a,b) => lastSoldAt(b.id) - lastSoldAt(a.id) || newest(a,b));
  }
  return out;
}

// Only offer sizes and colours that actually exist in the shop.
function sizesInShop(){
  const set = new Set();
  products.forEach(p => allSizesFor(p).all.forEach(s => set.add(s)));
  return Array.from(set);
}
function coloursInShop(){
  const set = new Set();
  products.forEach(p => productColours(p).forEach(x => set.add(x)));
  return Array.from(set);
}
function categoriesInShop(){
  return shopCategories().filter(cat => products.some(p => p.category === cat));
}

function setFilter(kind, value){
  transient['filter' + kind] = transient['filter' + kind] === value ? '' : value;
  render();
}
function setSort(v){ transient.sortBy = v; render(); }
function clearFilters(){
  transient.filterCategory = '';
  transient.filterColour = '';
  transient.filterSize = '';
  transient.shopSeeAll = '';
  render();
}

function showCategory(cat){
  transient.shopSeeAll = cat;
  transient.filterCategory = '';
  render();
}
function backToShop(){
  transient.shopSeeAll = '';
  clearFilters();
}

function viewProduct(id){
  transient.reviewSent = false;

  transient.galleryIndex = 0;

  nav.view = 'shop';

function viewCart(){
  transient.viewingCart = true;
  transient.viewingProductId = null;
  transient.checkingOut = false;

// Highlight the chosen size without re-rendering (which would lose scroll position)
function changeVoucher(dir){
  let v = (transient.voucherAmount || VOUCHER_MIN) + dir * VOUCHER_STEP;
  v = Math.max(VOUCHER_MIN, Math.min(VOUCHER_MAX, v));
  transient.voucherAmount = v;
  const el = document.getElementById('voucherAmount');
  if (el) el.textContent = 'R' + v;
}

function chooseSize(s, btn, toOrder){
  transient.chosenSize = s;
  const grid = document.getElementById('detailSizeGrid');
  if (grid) grid.querySelectorAll('.bh-size-opt').forEach(b => b.classList.toggle('on', b === btn));
  const note = document.getElementById('sizeNote');
  if (note){
    note.textContent = toOrder ? setting('leadTimeLabel') : 'In stock \u2014 ready now.';
    note.classList.toggle('is-leadtime', !!toOrder);
  }
  const err = document.getElementById('detailError');
  if (err) err.textContent = '';
}

function addToCartFromDetail(productId){
  const product = products.find(p => p.id === productId);
  const err = document.getElementById('detailError');

  if (isVoucher(product)){
    const amount = transient.voucherAmount || VOUCHER_MIN;
    cart.push({ productId, name: product.name, price: String(amount), size: '', qty: 1, toOrder: false, voucher: true });
    saveCart();
    transient.voucherAmount = VOUCHER_MIN;
    viewCart();
    return;
  }

  const sizeInfo = allSizesFor(product);
  if (sizeInfo.all.length > 1 && !transient.chosenSize){
    if (err) err.textContent = 'Please choose a size first.';
    return;
  }
  const size = transient.chosenSize || (sizeInfo.all.length === 1 ? sizeInfo.all[0] : '');
  addToCart(productId, size, isMadeToOrder(product, size));
  transient.chosenSize = '';
  viewCart();
}

function renderCheckoutSummary(){
  const method = transient.deliveryMethod;

  return `

    <div class="bh-cart-line"><span>${method === 'Shipping' ? 'Shipping' : 'Collection'}</span><span>${ship ? 'R' + ship.toFixed(0) : 'Free'}</span></div>
    <div class="bh-cart-line bh-cart-total"><span>Total</span><span>R${cartTotal(method).toFixed(0)}</span></div>`;

async function applyDiscount(){
  const input = document.getElementById('discountInput');
  const note = document.getElementById('discountNote');
  const code = (input ? input.value : '').trim().toUpperCase();
  if (!code){
    transient.discountCode = ''; transient.discountAmount = 0; transient.discountNote = '';
    render(); return;
  }
  note.textContent = 'Checking\u2026';
  try {
    const res = await fetch(API + '/discounts?check=1', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, subtotal: cartSubtotal() }),
    }).then(r => r.json());

    if (res.ok){
      transient.discountCode = res.code;
      transient.discountAmount = res.amount;
      transient.discountNote = res.kind === 'percent'
        ? `${res.value}% off applied \u2014 R${res.amount} saved.`
        : `R${res.amount} off applied.`;
    } else {
      transient.discountCode = ''; transient.discountAmount = 0;
      transient.discountNote = res.reason || 'That code cannot be used.';
    }
  } catch (e) {
    transient.discountCode = ''; transient.discountAmount = 0;
    transient.discountNote = "Couldn't check that code \u2014 please try again.";
  }
  render();
}

function toggleShippingField(){
  const method = document.querySelector('input[name=deliveryMethod]:checked').value;
  transient.deliveryMethod = method;
  const wrap = document.getElementById('shippingAddressWrap');
  if (wrap) wrap.style.display = method === 'Shipping' ? 'block' : 'none';
  // Update the totals in place so typed details aren't lost.
  const summary = document.getElementById('checkoutSummary');
  if (summary) summary.innerHTML = renderCheckoutSummary();
}

async function submitOrder(){
  const buyer = document.getElementById('orderBuyer').value.trim();
  const phone = document.getElementById('orderPhone').value.trim();
  const deliveryMethod = document.querySelector('input[name=deliveryMethod]:checked').value;
  const address = deliveryMethod === 'Shipping' ? document.getElementById('orderAddress').value.trim() : '';
  const errEl = document.getElementById('orderError');

  if (!buyer || !phone){ errEl.textContent = 'Please add your name and WhatsApp number.'; return; }
  if (deliveryMethod === 'Shipping' && !address){ errEl.textContent = 'Please add a shipping address.'; return; }
  if (cart.length === 0){ errEl.textContent = 'Your basket is empty.'; return; }

  errEl.textContent = 'Sending…';
  try {
    await apiFetch('/leads', {
      method: 'POST',
      body: JSON.stringify({
        buyer, phone, deliveryMethod, address,
        items: cart,
        leadTime: cart.some(i => i.toOrder) ? setting('leadTimeLabel') : '',
        subtotal: cartSubtotal().toFixed(0),
        discountCode: transient.discountCode || '',
        shipping: shippingFor(deliveryMethod).toFixed(0),
        total: cartTotal(deliveryMethod).toFixed(0),
      }),
    });
    clearCart();
    transient.discountCode = ''; transient.discountAmount = 0; transient.discountNote = '';
    transient.orderSent = true;
    transient.loadError = '';
  } catch (e) {
    errEl.textContent = "Couldn't place that order — please try again in a moment.";
    return;
  }
  render();
}

// Archived items sit quietly at the bottom, grouped by the day they were
// archived, and drop off this screen after a week. They are NEVER deleted —
// approved stories stay published in their folder the whole time.
function renderArchiveSection(){
  const archived = []
    .concat(stories.filter(archivedRecently).map(s => ({ ...s, kind: 'story' })))
    .concat(replies.filter(archivedRecently).map(r => ({ ...r, kind: 'reply' })))
    .sort((a, b) => new Date(b.archived_at) - new Date(a.archived_at));

  if (!archived.length) return '';

  const byDay = {};
  archived.forEach(item => {
    const d = new Date(item.archived_at);
    const key = d.toLocaleDateString('en-ZA', { weekday:'long', day:'numeric', month:'long' });
    (byDay[key] = byDay[key] || []).push(item);
  });

  return `
    <div style="margin-top:36px;padding-top:20px;border-top:1px solid var(--line)">
      <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:4px">Archived (${archived.length})</h3>
      <p style="font-size:.78rem;color:var(--grey);margin:0 0 6px">Tidied off the list above. These clear from this screen after 7 days \u2014 nothing is deleted, and anything approved stays in its folder.</p>
      ${Object.keys(byDay).map(day => `
        <div class="bh-arch-day">${escapeHtml(day)}</div>
        ${byDay[day].map(item => `
          <div class="bh-arch-row">
            <span class="t">
              <span class="catpill">${item.kind === 'story' ? escapeHtml(item.category || 'Story') : 'Reply'}</span>
              ${escapeHtml(String(item.text || '').slice(0, 90))}${String(item.text || '').length > 90 ? '\u2026' : ''}
            </span>
            <button class="bh-btn-ghost" style="font-size:.72rem" onclick="${item.kind === 'story' ? `archiveStory('${item.id}', false)` : `archiveReply('${item.id}', false)`}">Put back</button>
          </div>
        `).join('')}
      `).join('')}
    </div>`;
}

async function unpublishStory(id){
  await apiFetch('/stories', { method: 'PATCH', body: JSON.stringify({ id, status: 'pending' }) });
  await fetchStories();
  alert('Taken off the site. It is back in your review queue if you want to put it up again.');
  goHome();
}

async function deleteStory(id){
  const story = stories.find(s => s.id === id);
  const snippet = story ? story.text.slice(0, 60) + (story.text.length > 60 ? '…' : '') : 'this story';
  if (!confirm('Permanently delete this story and all its replies?\n\n"' + snippet + '"\n\nThis cannot be undone.')) return;
  await apiFetch('/stories', { method: 'DELETE', body: JSON.stringify({ id }) });
  await Promise.all([fetchStories(), fetchReplies()]);
  // If we were reading that story, there's nothing left to show.
  if (nav.view === 'story' && nav.activeStoryId === id) goHome();
  else render();
}

async function deleteReply(id){
  if (!confirm('Permanently delete this reply? This cannot be undone.')) return;
  await apiFetch('/replies', { method: 'DELETE', body: JSON.stringify({ id }) });
  await fetchReplies();
  render();
}

function isArchived(x){ return !!(x && x.archived_at); }

// Archived items drop off the admin screen after a week. They are never
// deleted, and anything approved stays published in its folder.
function archivedRecently(x){
  if (!x || !x.archived_at) return false;
  const days = (Date.now() - new Date(x.archived_at).getTime()) / 86400000;
  return days <= 7;
}

}

async function handleShopFile(e){
  const files = Array.from(e.target.files || []);
  if (!files.length) return;

  const statusEl = document.getElementById('imageStatus');
  if (statusEl) statusEl.textContent = `Preparing ${files.length} picture${files.length === 1 ? '' : 's'}\u2026`;

  const done = [];
  for (const file of files){
    try {
      const [thumb, full] = await Promise.all([
        resizeImage(file, 500, 0.72),
        resizeImage(file, 1400, 0.82),
      ]);
      done.push({ thumb, full });
    } catch (err) { /* skip anything that isn't a usable picture */ }
  }

  if (!done.length){
    transient.shopImages = [];
    transient.imageStatus = "Couldn't use those pictures \u2014 try different ones.";
  } else {
    // Add to whatever was already chosen, so she can pick a few at a time.
    transient.shopImages = (transient.shopImages || []).concat(done);
    const kb = Math.round(transient.shopImages.reduce((n,i) => n + i.thumb.length + i.full.length, 0) / 1024);
    transient.imageStatus = `${transient.shopImages.length} picture${transient.shopImages.length === 1 ? '' : 's'} ready (${kb} KB). The first one is used on the shop page.`;
  }
  e.target.value = '';   // let the same file be picked again if needed
  render();
}

function removeShopImage(i){
  transient.shopImages.splice(i, 1);
  transient.imageStatus = transient.shopImages.length
    ? `${transient.shopImages.length} picture${transient.shopImages.length === 1 ? '' : 's'} ready.`
    : '';
  render();
}

function moveShopImage(i, dir){
  const list = transient.shopImages;
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  render();
}

function changeProductType(cat){
  transient.category = cat;
  render(); // the form changes shape for gift vouchers
}

function toggleColour(name, btn){
  const i = transient.colours.indexOf(name);
  if (i === -1) transient.colours.push(name);
  else transient.colours.splice(i, 1);
  if (btn) btn.classList.toggle('on', i === -1);
}

function changeStockStatus(v){
  transient.stockStatus = v;
  if (v === 'made_to_order') transient.selectedSizes = [];
  const wrap = document.getElementById('inStockWrap');
  if (wrap) wrap.style.display = v === 'made_to_order' ? 'none' : 'block';
}

function toggleOrderSize(s, btn){
  const i = transient.orderSizes.indexOf(s);
  if (i === -1) transient.orderSizes.push(s);
  else transient.orderSizes.splice(i, 1);
  if (btn) btn.classList.toggle('on', i === -1);
}

// Updates only the tapped button — a full re-render would wipe whatever
// has already been typed into the name/price/description fields.
function toggleSize(s, btn){
  const i = transient.selectedSizes.indexOf(s);
  if (i === -1) transient.selectedSizes.push(s);
  else transient.selectedSizes.splice(i, 1);
  if (btn) btn.classList.toggle('on', i === -1);
}

function changeSizeType(type){
  transient.sizeType = type;
  transient.selectedSizes = type === 'freesize' ? ['Free size'] : [];
  transient.orderSizes = [];
  // Rebuild just the size grids so typed fields aren't lost.
  const grid = document.getElementById('shopSizeGrid');
  if (grid){
    grid.innerHTML = SIZE_PRESETS[type].options.map(s =>
      `<button class="bh-size-opt ${transient.selectedSizes.includes(s) ? 'on' : ''}" onclick="toggleSize('${escapeHtml(s)}', this)">${escapeHtml(s)}</button>`
    ).join('');
  }
  const oGrid = document.getElementById('shopOrderSizeGrid');
  if (oGrid){
    oGrid.innerHTML = SIZE_PRESETS[type].options.map(s =>
      `<button class="bh-size-opt to-order" onclick="toggleOrderSize('${escapeHtml(s)}', this)">${escapeHtml(s)}</button>`
    ).join('');
  }
}

async function addProduct(){
  const nameEl = document.getElementById('shopName');
  const priceEl = document.getElementById('shopPrice');
  const descEl = document.getElementById('shopDesc');
  const name = ((nameEl ? nameEl.value : '') || transient.formName || '').trim();
  const isGiftVoucher = transient.category === 'Gift Voucher';
  const price = isGiftVoucher ? String(VOUCHER_MIN) : ((priceEl ? priceEl.value : '') || transient.formPrice || '');
  const description = ((descEl ? descEl.value : '') || transient.formDesc || '').trim();

  if (!transient.category){
    transient.loadError = 'Choose a category for this product.';
    render();
    return;
  }
  if (!name || !price){
    transient.loadError = 'Give the product a name and a price before adding it.';
    render();
    return;
  }
  if (!isGiftVoucher && transient.selectedSizes.length === 0 && transient.orderSizes.length === 0){
    transient.loadError = 'Pick at least one size \u2014 either in stock, or one you can order in.';
    render();
    return;
  }
  transient.loadError = '';
  await apiFetch('/products', {
    method: 'POST',
    body: JSON.stringify({
      name, price, images: transient.shopImages,
      description,
      sizeType: transient.sizeType,
      sizes: transient.selectedSizes,
      orderSizes: transient.orderSizes,
      stockStatus: transient.stockStatus,
      category: transient.category,
      colours: transient.colours,
      productType: isGiftVoucher ? 'voucher' : 'item',
    }),
  });
  transient.shopImageData = null;
  transient.shopImages = [];
  transient.imageStatus = '';
  transient.formName = '';
  transient.formPrice = '';
  transient.formDesc = '';
  transient.selectedSizes = transient.sizeType === 'freesize' ? ['Free size'] : [];
  transient.orderSizes = [];
  transient.colours = [];
  await fetchProducts();
  render();
}
async function removeProduct(id){ await apiFetch('/products', { method: 'DELETE', body: JSON.stringify({ id }) }); await fetchProducts(); render(); }

async function addLead(){
  const buyer = document.getElementById('leadBuyer').value.trim();
  const item = document.getElementById('leadItem').value.trim();
  const phone = document.getElementById('leadPhone').value.trim();
  const price = document.getElementById('leadPrice').value.trim();
  if (!buyer || !item) return;
  await apiFetch('/leads', { method: 'POST', body: JSON.stringify({ buyer, item, phone, price, deliveryMethod: 'Collection' }) });
  await fetchLeads();
  render();
}
async function cycleLeadStatus(id){
  const lead = leads.find(l => l.id === id);
  const next = LEAD_STATUSES[(LEAD_STATUSES.indexOf(lead.status) + 1) % LEAD_STATUSES.length];
  await apiFetch('/leads', { method: 'PATCH', body: JSON.stringify({ id, status: next }) });
  await fetchLeads();
  render();
}
async function removeLead(id){ await apiFetch('/leads', { method: 'DELETE', body: JSON.stringify({ id }) }); await fetchLeads(); render(); }

function sendLeadWhatsApp(id){
  const lead = leads.find(l => l.id === id);
  if (!lead.phone){ alert('No WhatsApp number saved for this lead — add one to send a message.'); return; }
  const message = buildLeadMessage(lead);
  window.open(buildWhatsAppLink(lead.phone, message), '_blank');
}

async function downloadLeadPDF(id, kind){
  const lead = leads.find(l => l.id === id);
  transient.leadDownloadStatus = 'Preparing PDF\u2026';
  render();
  try {
    await makeOrderPDF(lead, kind || 'order');
    transient.leadDownloadStatus = 'PDF downloaded \u2014 attach it in WhatsApp.';
  } catch (e) {
    transient.leadDownloadStatus = "Couldn't make the PDF \u2014 please try again.";
  }
  render();
}

async function downloadLeadCard(id, kind){
  const lead = leads.find(l => l.id === id);
  kind = kind || 'order';
  transient.leadDownloadStatus = 'Preparing image…';
  render();
  const canvas = document.getElementById('exportCanvas');
  await drawDocCard(canvas, lead, kind);
  await downloadCanvas(canvas, `bling-happiness-${kind}.jpg`);
  transient.leadDownloadStatus = 'Downloaded — attach it in WhatsApp before sending.';
  render();
}

function renderReviewsAdmin(){
  const pending = reviews.filter(r => r.status === 'pending');

  const row = (r, isPending) => {
    const p = products.find(x => x.id === r.product_id);
    return `
      <div class="bh-qrow">
        <span class="txt">
          <span class="catpill">${escapeHtml(p ? p.name : 'Product')}</span>
          <span class="bh-stars">${'\u2605'.repeat(r.rating)}${'\u2606'.repeat(5-r.rating)}</span>
          <span class="bh-author" style="margin-left:6px">${escapeHtml(authorLabel(r))}</span>
          <br>${escapeHtml(r.text)}
        </span>
        <span class="actions">
          ${isPending ? `<button class="bh-approve" onclick="approveReview('${r.id}')">\u2713 Approve</button>` : ''}
          ${isPending ? `<button class="bh-reject" onclick="rejectReview('${r.id}')">\u2715 Reject</button>` : ''}
          <button class="bh-btn-ghost" style="color:var(--risk);font-size:.72rem" onclick="deleteReview('${r.id}')">Delete</button>
        </span>

  };
  return `
    <div class="bh-card" style="margin-bottom:16px;background:var(--blushp);border:none">
      <p style="font-size:.85rem;color:var(--grey);margin:0">Reviews wait here until you approve them, the same as stories. Approved ones show on the product and count towards its star rating.</p>
    </div>
    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin-bottom:10px">Waiting (${pending.length})</h3>
    ${pending.length === 0 ? `<p class="bh-empty">Nothing waiting right now.</p>` : pending.map(r => row(r, true)).join('')}
    <h3 class="bh-serif" style="font-size:1rem;color:var(--plum);margin:24px 0 10px">Published (${live.length})</h3>
    ${live.length === 0 ? `<p class="bh-empty">None yet.</p>` : live.map(r => row(r, false)).join('')}`;
}

async function approveReview(id){ await apiFetch('/reviews', { method:'PATCH', body: JSON.stringify({ id, status:'approved' }) }); await fetchReviews(); render(); }
async function rejectReview(id){ await apiFetch('/reviews', { method:'PATCH', body: JSON.stringify({ id, status:'rejected' }) }); await fetchReviews(); render(); }
async function deleteReview(id){
  if (!confirm('Delete this review for good?')) return;
  await apiFetch('/reviews', { method:'DELETE', body: JSON.stringify({ id }) });
  await fetchReviews(); render();
}
